<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>历史采集任务 · 飞象智批</title>
  <style>
    :root { --ink:#24345c; --muted:#7180a0; --line:#e4e9f4; --panel:#ffffff; --bg:#eef3fb; --primary:#556bd6; --green:#3da67f; --amber:#be842d; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:linear-gradient(135deg,#edf3ff 0%,#f9fbff 55%,#e6edff 100%); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { min-height:100vh; padding:30px 34px 54px; } .back { color:#5068a6; text-decoration:none; font-size:16px; font-weight:700; display:inline-flex; gap:7px; align-items:center; }
    .page { margin-top:34px; border:1px solid rgba(255,255,255,.9); border-radius:25px; background:rgba(255,255,255,.76); box-shadow:0 18px 44px rgba(70,91,144,.12); padding:20px 22px; }
    .task { display:grid; grid-template-columns:minmax(350px,1fr) 100px 105px 106px 122px; align-items:center; gap:18px; min-height:118px; padding:18px 14px; border-bottom:1px solid var(--line); }
    .task:last-child { border-bottom:0; } .task-title { font-weight:750; font-size:17px; margin-bottom:9px; } .task-sub { color:var(--muted); font-size:13px; } .num { font-weight:750; text-align:center; font-size:14px; }
    .pill { justify-self:center; padding:6px 11px; border-radius:999px; font-weight:700; font-size:12px; } .pending { color:#a46e18; background:#fff3db; } .done { color:#218264; background:#e7f7ef; } .processing { color:#405cb9; background:#e7edff; }
    button { border:0; cursor:pointer; font:inherit; font-weight:750; } .primary, .secondary { min-width:112px; padding:12px 17px; border-radius:14px; font-size:15px; } .primary { background:linear-gradient(135deg,#263b72,#596fd7); color:#fff; box-shadow:0 9px 20px rgba(56,75,145,.23); } .secondary { color:var(--ink); background:#fff; border:1px solid #dfe5f1; }
    .toast { position:fixed; right:32px; bottom:28px; padding:14px 18px; border-radius:14px; color:#216e58; background:#eaf8f1; box-shadow:0 10px 30px rgba(36,77,66,.18); font-weight:700; opacity:0; transform:translateY(12px); transition:.25s; } .toast.show { opacity:1; transform:none; }
    @media (max-width:800px) { .shell{padding:20px}.task{grid-template-columns:1fr 70px; gap:12px}.task .num,.task .pill{justify-self:start;text-align:left}.task button{grid-column:2}.page{padding:10px}.task{min-height:150px} }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html">← 返回作业考试</a>
    <section class="page" id="taskList"></section>
  </main>
  <script src="collection-flow.js"></script>
  <script>
    (() => {
      const taskSeeds = [
        { id:'today-1942', title:'今天 19:42 · 六年级3班 · 数学', pages:126, samples:2 },
        { id:'today-1618', title:'今天 16:18 · 六年级1班 · 数学', pages:98, samples:2 },
        { id:'yesterday-1835', title:'昨天 18:35 · 八年级3班 · 数学', pages:144, samples:3, confirmed:true },
        { id:'yesterday-1206', title:'昨天 12:06 · 六年级2班 · 数学', pages:112, samples:2, confirmed:true },
        { id:'aug09-1740', title:'8月9日 17:40 · 七年级4班 · 数学', pages:136, samples:3, confirmed:true },
      ];
      let historyState = FxCollectionFlow.normalizeHistoryState(null);
      try {
        historyState = FxCollectionFlow.normalizeHistoryState(JSON.parse(localStorage.getItem('fxCollectionHistoryState') || 'null'));
      } catch (_) {}

      const taskList = document.getElementById('taskList');
      taskList.innerHTML = taskSeeds.map((task) => {
        const confirmed = task.confirmed || historyState.records[task.id]?.status === '已确认';
        const action = confirmed ? '查看结果' : '去确认';
        return `<article class="task ${confirmed ? '' : 'pending-task'}" data-task="${task.id}">
          <div><div class="task-title">${task.title}</div><div class="task-sub">高扫采集任务</div></div>
          <div class="num">${task.pages} 页</div><div class="num">${task.samples} 份样卷</div>
          <span class="pill ${confirmed ? 'done' : 'pending'}">${confirmed ? '已确认' : '待确认'}</span>
          <button class="${confirmed ? 'secondary' : 'primary'}" type="button" data-action="open-history-task" data-confirmed="${confirmed}">${action}</button>
        </article>`;
      }).join('');

      taskList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-action="open-history-task"]');
        if (!button) return;
        const id = button.closest('.task').dataset.task;
        const suffix = button.dataset.confirmed === 'true' ? '&mode=view' : '';
        location.href = 'collection-confirm.html?task=' + encodeURIComponent(id) + suffix;
      });
    })();
  </script>
</body>
</html>
