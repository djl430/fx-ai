<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3f9">
  <title>飞象智批 · 批改工作台改版 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18223b;
      --muted: #6f7890;
      --line: rgba(90, 107, 143, .16);
      --panel: rgba(255, 255, 255, .68);
      --panel-strong: rgba(255, 255, 255, .88);
      --navy: #202b4b;
      --blue: #647be9;
      --lavender: #9a87dd;
      --mint: #7ec9b6;
      --amber: #d99343;
      --red: #df5b62;
      --shadow: 0 24px 70px rgba(73, 85, 125, .13);
      --soft-shadow: 0 12px 32px rgba(73, 85, 125, .09);
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: #dfe5ee; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 17% 10%, rgba(220, 235, 255, .92), transparent 32%),
        radial-gradient(circle at 83% 18%, rgba(227, 220, 252, .72), transparent 31%),
        linear-gradient(135deg, #e9eff6 0%, #e8eaf3 48%, #dde7f2 100%);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(100, 123, 233, .28);
      outline-offset: 3px;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: calc(100vh - 32px);
      margin: 16px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 30px;
      overflow: hidden;
      background: rgba(244, 247, 252, .66);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 28px 20px 20px;
      border-right: 1px solid var(--line);
      background: rgba(250, 252, 255, .64);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }
    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 15px;
      color: white;
      font-weight: 800;
      background: linear-gradient(145deg, #8194f3, #8d78d8);
      box-shadow: 0 12px 24px rgba(111, 101, 206, .28);
    }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 17px; letter-spacing: -.02em; }
    .brand small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .primary-nav { display: grid; gap: 8px; }
    .primary-nav button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 15px;
      padding: 13px 14px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .primary-nav button::before {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 10px;
      background: rgba(122, 136, 188, .09);
      font-size: 14px;
      content: attr(data-icon);
    }
    .primary-nav button:hover { background: rgba(255, 255, 255, .74); }
    .primary-nav button[aria-current="page"] {
      color: #26345f;
      background: rgba(255, 255, 255, .9);
      box-shadow: var(--soft-shadow);
    }
    .primary-nav button[aria-current="page"]::before {
      color: white;
      background: linear-gradient(145deg, #7c90ee, #8c78da);
    }
    .sidebar-note {
      margin-top: auto;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--muted);
      background: rgba(255, 255, 255, .52);
      font-size: 12px;
      line-height: 1.6;
    }
    .main-column { min-width: 0; }
    .workspace { padding: 30px; }
    .panel {
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(18px);
    }
    .page-stack { display: grid; gap: 22px; animation: page-in .42s ease both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
    .page-heading, .panel-heading, .hero, .task-row, .exception-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .page-heading h1, .panel-heading h2, .hero h1 { margin: 0; letter-spacing: -.035em; }
    .page-heading h1 { font-size: clamp(28px, 3.4vw, 42px); }
    .page-heading p, .panel-heading p, .hero p { margin: 7px 0 0; color: var(--muted); }
    .eyebrow {
      margin: 0 0 7px !important;
      color: #6978a8 !important;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .hero {
      min-height: 184px;
      padding: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 20%, rgba(178, 164, 235, .32), transparent 34%),
        radial-gradient(circle at 67% 100%, rgba(149, 205, 225, .28), transparent 38%),
        var(--panel-strong);
    }
    .hero h1 { font-size: clamp(32px, 4vw, 54px); }
    .hero-copy { max-width: 650px; }
    .hero-actions { display: flex; align-items: center; gap: 10px; }
    .scan-task-entry { position: relative; padding-right: 35px; }
    .notification-bubble {
      position: absolute;
      top: -7px;
      right: -5px;
      display: grid;
      min-width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid #f7f9ff;
      border-radius: 999px;
      padding: 0 6px;
      color: #fff;
      background: #d66b51;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(183, 75, 54, .24);
    }
    .button-primary, .button-secondary, .button-ghost, .text-button, .filter-chip {
      border: 0;
      border-radius: 13px;
      cursor: pointer;
    }
    .button-primary, .button-secondary {
      min-height: 44px;
      padding: 0 17px;
      font-weight: 760;
    }
    .button-primary {
      color: white;
      background: linear-gradient(135deg, #263456, #5265b2);
      box-shadow: 0 12px 25px rgba(44, 56, 103, .23);
    }
    .button-secondary {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .78);
    }
    .button-ghost, .text-button {
      padding: 8px 10px;
      color: #56659e;
      background: transparent;
      font-weight: 700;
    }
    .button-primary:hover, .button-secondary:hover, .text-button:hover { transform: translateY(-1px); }
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .processing-card { display: grid; gap: 16px; padding: 22px 24px; background: linear-gradient(125deg, rgba(255,255,255,.88), rgba(239,243,255,.82)); }
    .processing-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .processing-title { display: flex; gap: 13px; align-items: flex-start; }
    .processing-title > span { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; color: #5b6dc6; background: #e9edff; font-size: 21px; }
    .processing-title h2 { margin: 5px 0; font-size: 19px; }
    .processing-title p { margin: 0; color: var(--muted); }
    .processing-progress strong { display: flex; justify-content: space-between; margin-bottom: 9px; font-size: 12px; }
    .processing-progress__track { display: block; height: 9px; overflow: hidden; border-radius: 999px; background: #e6eafa; }
    .processing-progress__track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6374d9, #7e8bea); }
    .processing-meta { display: flex; flex-wrap: wrap; gap: 15px; color: #4f806b; font-size: 11px; }
    .processing-meta span { white-space: nowrap; }
    .metric {
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 19px;
      background: rgba(255, 255, 255, .58);
    }
    .metric strong { display: block; font-size: 28px; letter-spacing: -.04em; }
    .metric span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .section-panel { padding: 23px; }
    .panel-heading { margin-bottom: 18px; }
    .panel-heading h2 { font-size: 21px; }
    .task-list, .exception-list { display: grid; gap: 10px; }
    .task-row, .exception-row {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid transparent;
      border-radius: 16px;
      color: inherit;
      background: rgba(255, 255, 255, .52);
      cursor: pointer;
      text-align: left;
    }
    .task-row:hover, .exception-row:hover { border-color: var(--line); background: rgba(255, 255, 255, .84); }
    .task-main { display: flex; min-width: 0; align-items: center; gap: 13px; }
    .task-icon, .exception-icon {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 14px;
      color: #5668b2;
      background: linear-gradient(145deg, #edf2ff, #eee9fb);
    }
    .task-main strong, .task-main small { display: block; }
    .task-main small { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .task-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 9px;
      color: #4e5d93;
      background: #eef1ff;
      font-size: 11px;
      font-weight: 760;
    }
    .status-badge.warning { color: #8a5921; background: #fff2df; }
    .exception-card {
      min-height: 100%;
      padding: 23px;
      color: #3e3440;
      background:
        radial-gradient(circle at 100% 0, rgba(242, 187, 109, .28), transparent 38%),
        rgba(255, 251, 245, .75);
    }
    .exception-total { display: block; margin: 20px 0 2px; font-size: 46px; letter-spacing: -.05em; }
    .exception-card > p { margin: 4px 0 22px; color: #7d6b60; line-height: 1.55; }
    .exception-types { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .exception-types span { border-radius: 999px; padding: 7px 9px; background: rgba(255, 255, 255, .68); font-size: 11px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .home-filter-bar { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 14px; padding: 4px 10px; border-radius: 18px; background: #fff; box-shadow: 0 7px 20px rgba(68, 83, 132, .08); }
    .home-filter-bar::before { content: "⌕"; color: #5870dd; font-size: 20px; line-height: 1; transform: rotate(-35deg); }
    .home-filter-bar label { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; color: #27324d; font-size: 13px; font-weight: 750; }
    .home-filter-bar select { border: 0; outline: 0; color: #27324d; background: transparent; font: inherit; cursor: pointer; }
    .filter-chip { padding: 8px 12px; color: var(--muted); background: rgba(255, 255, 255, .56); }
    .filter-chip[aria-pressed="true"] { color: white; background: var(--navy); }
    .back-row { display: flex; align-items: center; gap: 10px; }
    .back-row .button-ghost { padding-left: 0; }
    .exception-group { padding: 19px; }
    .exception-group + .exception-group { margin-top: 14px; }
    .exception-group__title { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .exception-group__title h2 { margin: 0; font-size: 18px; }
    .exception-group__title span { color: var(--amber); font-size: 12px; font-weight: 760; }
    .exception-row { cursor: default; }
    .exception-row button { flex: 0 0 auto; }
    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      padding: 25px;
    }
    .task-header h1 { margin: 0; font-size: clamp(27px, 3vw, 39px); letter-spacing: -.04em; }
    .task-header p { margin: 8px 0 0; color: var(--muted); }
    .task-header__stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .task-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 17px;
      background: rgba(255, 255, 255, .54);
      scrollbar-width: none;
    }
    .task-tabs::-webkit-scrollbar { display: none; }
    .task-tabs button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-weight: 720;
    }
    .task-tabs button[aria-selected="true"] {
      color: var(--ink);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 8px 18px rgba(74, 85, 123, .1);
    }
    .task-body { min-height: 420px; }
    .overview-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; }
    .overview-grid > section { padding: 23px; }
    .stage-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; margin-top: 20px; }
    .stage {
      position: relative;
      min-height: 100px;
      padding: 14px;
      border-radius: 15px;
      background: rgba(245, 247, 252, .86);
    }
    .stage[data-state="complete"] { color: #315e58; background: #e7f5f1; }
    .stage[data-state="current"] { color: #5d4d8f; background: #eeeafb; }
    .stage strong, .stage small { display: block; }
    .stage small { margin-top: 8px; color: inherit; opacity: .72; }
    .summary-list { display: grid; gap: 11px; margin-top: 18px; }
    .summary-list div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .summary-list span { color: var(--muted); }
    .submission-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .submission-table { width: 100%; border-collapse: collapse; }
    .submission-table th, .submission-table td { padding: 13px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .submission-table th { color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .05em; }
    .submission-table td { font-size: 13px; }
    .submission-table tr:last-child td { border-bottom: 0; }
    .student-cell { display: flex; align-items: center; gap: 10px; }
    .student-avatar {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 11px;
      color: #4f5f9f;
      background: #edf0fc;
      font-weight: 780;
    }
    .row-action { border: 0; color: #5969a6; background: transparent; cursor: pointer; font-weight: 740; }
    .state-ok { color: #3f7a70; }
    .state-warning { color: #a06425; }
    .anomaly-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr) 270px; gap: 16px; }
    .anomaly-layout > section, .anomaly-layout > aside { padding: 20px; }
    .anomaly-nav { display: grid; gap: 8px; margin-top: 16px; }
    .anomaly-nav button {
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: rgba(255, 255, 255, .52);
      cursor: pointer;
      text-align: left;
    }
    .anomaly-nav button[aria-current="true"] { border-color: rgba(213, 143, 65, .34); background: #fff7ea; }
    .paper-preview {
      position: relative;
      min-height: 330px;
      margin-top: 16px;
      padding: 28px;
      border: 1px solid #dfe3ec;
      border-radius: 8px;
      color: #444b5a;
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(125, 138, 164, .08) 27px 28px),
        #fff;
      box-shadow: 0 18px 35px rgba(51, 61, 89, .12);
      font-family: "Songti SC", serif;
      line-height: 1.9;
    }
    .paper-preview .problem-zone { margin-top: 18px; padding: 12px; border: 2px dashed rgba(219, 144, 61, .72); background: rgba(255, 244, 225, .65); }
    .impact-list { display: grid; gap: 9px; margin: 16px 0; }
    .impact-list span { display: flex; justify-content: space-between; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, .62); font-size: 12px; }
    .action-stack { display: grid; gap: 9px; }
    .toast {
      position: fixed;
      z-index: 20;
      right: 28px;
      bottom: 28px;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 16px;
      padding: 14px 17px;
      color: white;
      background: rgba(36, 49, 78, .94);
      box-shadow: var(--shadow);
    }
    .drawer-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: flex;
      justify-content: flex-end;
      background: rgba(31, 39, 60, .18);
      backdrop-filter: blur(5px);
    }
    .student-drawer {
      width: min(520px, 94vw);
      height: 100%;
      overflow-y: auto;
      padding: 28px;
      background: rgba(249, 251, 255, .97);
      box-shadow: -20px 0 60px rgba(43, 54, 86, .18);
    }
    .drawer-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .drawer-heading h2 { margin: 0; font-size: 27px; }
    .drawer-heading button { border: 0; background: transparent; cursor: pointer; font-size: 22px; }
    .drawer-card { margin-top: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 17px; background: white; }
    .drawer-card h3 { margin: 0 0 11px; }
    .drawer-card p { color: var(--muted); line-height: 1.6; }
    .student-detail-page { display: grid; gap: 18px; animation: page-in .42s ease both; }
    .page-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .page-action-bar--start { justify-content: flex-start; }
    .page-action-bar__actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .student-detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .student-detail-toolbar h1 { margin: 7px 0 5px; font-size: clamp(28px, 3vw, 42px); letter-spacing: -.045em; }
    .student-detail-toolbar p { margin: 0; color: var(--muted); }
    .student-detail-layout {
      display: grid;
      grid-template-columns: 220px minmax(420px, 1fr) 330px;
      align-items: start;
      gap: 16px;
    }
    .student-detail-layout > section,
    .student-detail-layout > aside { padding: 20px; }
    .detail-student-list {
      display: grid;
      gap: 8px;
      max-height: 690px;
      margin-top: 15px;
      overflow-y: auto;
    }
    .detail-student-list button {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: rgba(255, 255, 255, .54);
      cursor: pointer;
      text-align: left;
    }
    .detail-student-list button[aria-current="true"] {
      border-color: rgba(91, 109, 194, .28);
      background: #eef1ff;
      box-shadow: 0 8px 20px rgba(67, 80, 135, .08);
    }
    .detail-student-list .student-avatar { width: 34px; height: 34px; }
    .detail-student-list strong,
    .detail-student-list small { display: block; }
    .detail-student-list small { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .detail-student-list b { font-size: 13px; }
    .detail-paper-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .detail-paper-head h2 { margin: 5px 0 0; font-size: 24px; }
    .detail-paper-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .question-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .question-nav button {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .68);
      cursor: pointer;
    }
    .question-nav button[aria-current="true"] { color: #fff; border-color: var(--navy); background: var(--navy); }
    .grading-paper {
      position: relative;
      min-height: 560px;
      padding: 30px;
      border: 1px solid #dfe3ec;
      border-radius: 9px;
      background:
        linear-gradient(90deg, transparent 0 44px, rgba(211, 78, 78, .07) 44px 45px, transparent 45px),
        repeating-linear-gradient(0deg, transparent 0 29px, rgba(125, 138, 164, .08) 29px 30px),
        #fff;
      box-shadow: 0 20px 40px rgba(51, 61, 89, .11);
      font-family: "Songti SC", serif;
    }
    .grading-paper__identity { padding-bottom: 16px; border-bottom: 1px solid #e4e7ee; }
    .grading-paper__identity strong { font-size: 19px; }
    .grading-paper__identity span { float: right; color: var(--muted); font-size: 12px; }
    .paper-question {
      position: relative;
      margin-top: 18px;
      padding: 14px 64px 14px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      line-height: 1.75;
    }
    .paper-question[data-selected="true"] { border-color: rgba(91, 109, 194, .3); background: rgba(239, 242, 255, .54); }
    .paper-question strong,
    .paper-question span { display: block; }
    .paper-question span { margin-top: 7px; color: #4d5464; }
    .paper-question__mark {
      position: absolute;
      top: 13px;
      right: 14px;
      color: var(--red);
      font-family: "Kaiti SC", cursive;
      font-size: 17px;
      font-weight: 700;
      transform: rotate(-5deg);
    }
    .question-review-panel { position: sticky; top: 18px; }
    .question-review-panel h2 { margin: 6px 0 4px; font-size: 24px; }
    .ai-review {

      function renderTask() {
        const task = activeTask();
        if (task.id === "agent-review") return renderAgentReviewTask() + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : "");
        if (task.id === "paper-flow") return renderPaperFlowDemo() + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : "");
        if (task.id === "guided-homework") return renderGuidedPerPaperWorkflow() + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : "");
        if (task.id === "quiz") return renderClusterGradingTask() + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : "");
        if (task.id === "weekend" && state.weekendStage !== "results") return renderWeekendDecisionDemo() + (state.toast ? '<div class="toast" role="status">' + state.toast + '</div>' : "");
        if (state.taskTab === "ai-review-queue") {
          return `${renderAIReviewQueue(task)}${state.toast ? `<div class="toast" role="status">${state.toast}</div>` : ""}`;
        }
        let body = state.studentWorkMode === "detail" ? renderStudentDetail(task) : renderStudentWorkList(task);
        if (state.taskTab === "anomalies") body = renderAnomalies(task);
        if (state.taskTab === "trace") body = renderTrace(task);
        if (state.taskTab === "insights") body = renderInsights(task);
        return `<div class="page-stack"><div class="task-body">${body}</div></div>${renderStudentDrawer(task)}${renderEvidenceDialog(task)}${state.toast ? `<div class="toast" role="status">${state.toast}</div>` : ""}`;

      function advancePaperFlow() {
        if (state.view !== "grading" || state.gradingMode !== "task" || state.activeTaskId !== "paper-flow" || state.paperFlowStage !== "processing") return;

        const completedIndex = state.paperFlowCount || 0;
        const currentCard = app.querySelector('.paper-thumb-grid .paper-thumb.is-working');
        const status = completedIndex >= 32 ? { label:"待复核", className:"is-confirm" } : completedIndex >= 28 ? { label:"建议抽查", className:"is-sample" } : { label:"完成批改", className:"is-done" };
        if (currentCard) {
          currentCard.classList.remove("is-working");
          currentCard.classList.add(status.className);
          const badge = currentCard.querySelector(".paper-thumb-sheet b");
          const label = currentCard.querySelector(":scope > span");
          if (badge) badge.textContent = "✓";
          if (label) label.textContent = status.label;
        }
        state.paperFlowCount = Math.min(34, completedIndex + 1);
        const countLabel = app.querySelector(".paper-simple-head span");
        if (countLabel) countLabel.textContent = `${state.paperFlowCount} / 34`;
        if (state.paperFlowCount >= 34) {
          const task = activeTask();
          task.status = "待确认";
          task.listTag = "待确认";
          task.progress = 100;
          paperFlowTimer = window.setTimeout(() => {
            if (state.activeTaskId === "paper-flow" && state.paperFlowStage === "processing") {
              state.paperFlowStage = "layers";
              render();
            }
          }, 350);
          return;
        }
        const nextIndex = state.paperFlowCount;
        const grid = app.querySelector(".paper-thumb-grid");
        if (grid) grid.insertAdjacentHTML("beforeend", `<article class="paper-thumb is-working"><div class="paper-thumb-sheet"><i></i><i></i><i></i><b>AI</b></div><strong>${names[nextIndex]}</strong><span>批改中</span></article>`);
        paperFlowTimer = window.setTimeout(advancePaperFlow, 150);
      }

      function render() {

          render();
        }
        if (action.dataset.action === "cluster-individual-score") {
          state.toast = `${action.dataset.student || "该学生"}的得分已单独确认，组内其他学生不受影响`;
          render();
        }
        if (action.dataset.action === "cluster-confirm-all") {
          state.toast = "已确认本题所有 AI 预赋分分组，未批改组仍保留待处理";
          render();
        }
        if (action.dataset.action === "cluster-confirm-score") {
          state.toast = "已确认当前答案组并完成批量赋分";
          render();
        }
        if (action.dataset.action === "cluster-open-rule") {
          state.clusterRuleDialog = true;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "cluster-close-rule") {
          state.clusterRuleDialog = false;
          render();
        }
        if (action.dataset.action === "cluster-preview-rule") {
          state.toast = "规则影响预览：6 名学生将重新赋分，2 份边界作答保留待确认";
          render();
        }
        if (action.dataset.action === "cluster-apply-rule") {
          state.clusterRuleDialog = false;
          state.toast = "AI 已理解评分点规则，并完成当前答案组的批量赋分";
          render();
        }
        if (action.dataset.action === "open-quiz-decision") {
          state.quizStage = "decision";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "preview-quiz-impact") {
          state.toast = "影响预览已生成：7 份可直接应用，2 份特殊作答将保留为例外项";
          render();
        }
        if (action.dataset.action === "submit-quiz-rule") {
          const rule = document.querySelector('[name="quiz-rule-input"]')?.value.trim();
          state.toast = rule ? "AI 已将补充要求转为结构化评分规则，等待确认后执行" : "请先输入需要补充的评分规则";
          render();
        }
        if (action.dataset.action === "apply-quiz-rule") {
          state.quizStage = "exceptions";
          state.toast = "已按评分规则批量处理 7 份同类作答";
          render();
        }
        if (action.dataset.action === "finish-quiz-exceptions") {
          state.quizStage = "complete";
          activeTask().status = "已完成";
          activeTask().listTag = "";
          activeTask().updated = "刚刚";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "view-quiz-results") {
          state.quizStage = "results";
          state.taskTab = "submissions";
          state.studentWorkMode = "list";
          state.toast = "学生得分、批改痕迹与学情统计已更新";
          render();
        }
        if (action.dataset.action === "open-weekend-decision") {
          state.weekendStage = "decision";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "open-weekend-sample") {
          state.weekendStage = "sampling";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "back-weekend-summary") {
          state.weekendStage = "summary";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "preview-weekend-impact") {
          state.toast = "AI 已完成影响预览：10 份可直接应用，2 份特殊作答将保留为例外项";
          render();
        }
        if (action.dataset.action === "submit-weekend-rule") {
          const rule = document.querySelector('[name="weekend-rule-input"]')?.value.trim();
          state.toast = rule ? "AI 已将补充要求纳入本次评分规则，等待老师确认后执行" : "请先输入需要补充的评分规则";
          render();
        }
        if (action.dataset.action === "apply-weekend-rule") {
          state.weekendStage = "exceptions";
          state.toast = "已按评分规则批量完成 10 份相似作答";
          render();
        }
        if (action.dataset.action === "finish-weekend-exceptions") {
          state.weekendStage = "complete";
          activeTask().status = "已完成";
          activeTask().listTag = "";
          activeTask().updated = "刚刚";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "view-weekend-results") {
          state.weekendStage = "results";
          state.taskTab = "submissions";
          state.studentWorkMode = "list";
          state.toast = "已更新学生得分、批改痕迹与班级错因统计";
          render();
        }
        if (action.dataset.action === "task-tab") {
          const task = activeTask();
          if (action.dataset.tab === "insights" && task.id === "homework") {
            window.location.href = "https://zingistop.github.io/class-error-diagnosis-flow/#generating-science";
            return;
          }
          if (action.dataset.tab === "insights" && task.id === "exam") { window.location.href = "file:///Users/dengjingli_1/Documents/GitHub/fx-ai/exam-insights.html"; return; }
          if (action.dataset.tab === "insights" && task.id === "practice") { window.location.href = "file:///Users/dengjingli_1/Documents/GitHub/fx-ai/homework-insights.html"; return; }
          state.taskTab = action.dataset.tab;
          if (action.dataset.tab === "submissions") state.studentWorkMode = "list";
          state.drawerStudentId = null;
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "open-student") {
          state.drawerStudentId = action.dataset.studentId;
          render();
        }
        if (action.dataset.action === "open-student-detail") {
          state.taskTab = "submissions";
          state.studentWorkMode = "detail";
          state.detailStudentId = action.dataset.studentId;
          state.detailQuestionId = "q1";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "open-student-submission") {
          state.taskTab = "submissions";
          state.studentWorkMode = "detail";
          state.detailStudentId = action.dataset.studentId;
          state.detailQuestionId = "q1";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "back-to-submissions") {
          state.taskTab = "submissions";
          state.studentWorkMode = "list";
          state.detailQuestionId = "q1";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "back-to-student-detail") {
          state.taskTab = "submissions";
          state.studentWorkMode = "detail";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "switch-detail-student") {
          state.detailStudentId = action.dataset.studentId;
          state.detailQuestionId = "q1";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "select-detail-question") {
          state.detailQuestionId = action.dataset.questionId;
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "show-ai-review-queue") {
          state.taskTab = "ai-review-queue";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "back-to-student-work") {
          state.taskTab = "submissions";
          state.studentWorkMode = "list";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "adjust-ai-suggestion") {
          state.detailQuestionId = action.dataset.questionId;
          state.showGradeEditor = true;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "edit-question-grade") {
          state.detailQuestionId = action.dataset.questionId;
          state.showGradeEditor = true;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "accept-ai-suggestion") {
          const task = activeTask();
          const student = task.studentRows.find((item) => item.id === state.detailStudentId);
          state.detailQuestionId = action.dataset.questionId || state.detailQuestionId;
          const question = ensureStudentGrades(task, student).find((item) => item.id === state.detailQuestionId);
          question.teacherConfirmed = true;
          question.uncertain = false;
          student.grading = "教师已确认";
          student.teacherModified = true;
          task.updated = "刚刚";
          state.showGradeEditor = false;
          state.toast = "已采纳 AI 批改建议";
          render();
        }
        if (action.dataset.action === "accept-review-group") {
          const task = activeTask();
          const questionId = action.dataset.questionId;
          const adjustedScore = Number(document.querySelector('[name="batch-review-score"]')?.value ?? 4);
          if (!Number.isFinite(adjustedScore) || adjustedScore < 0 || adjustedScore > 6) { state.toast = "批量得分需在 0–6 分之间"; render(); return; }
          let confirmedCount = 0;
          task.studentRows.forEach((student) => {
            const question = ensureStudentGrades(task, student).find((item) => item.id === questionId);
            if (!question || !question.uncertain || question.teacherConfirmed) return;
            const previousScore = question.score;
            question.score = adjustedScore;
            question.judgment = adjustedScore === question.maxScore ? "正确" : adjustedScore === 0 ? "错误" : "部分正确";
            student.score = String(Math.max(0, Number(student.score || 0) + adjustedScore - previousScore));
            question.teacherConfirmed = true;
            question.uncertain = false;
            student.grading = "教师已确认";
            student.teacherModified = true;
            confirmedCount += 1;
          });
          task.updated = "刚刚";
          state.toast = `已统一确认 ${confirmedCount} 份同类作答`;
          render();
        }
        if (action.dataset.action === "open-batch-review") {
          state.taskTab = "ai-review-queue";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "skip-ai-review") {
          state.taskTab = "submissions";
          state.studentWorkMode = "list";
          state.toast = "任务已完成；未复核题目暂不生成学生侧批改痕迹";
          render();
        }
        if (action.dataset.action === "review-one-student") {
          state.detailStudentId = action.dataset.studentId;
          state.detailQuestionId = "q18";
          state.taskTab = "submissions";
          state.studentWorkMode = "detail";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "open-student-from-insight") {
          state.detailStudentId = action.dataset.studentId;
          state.detailQuestionId = "q18";
          state.taskTab = "submissions";
          state.studentWorkMode = "detail";
          state.showGradeEditor = false;
          state.toast = "";
          render();
        }
        if (action.dataset.action === "generate-brief") {
          state.toast = "已按影响人数与教学优先级生成 3 道题的讲评清单";
          render();
        }
        if (action.dataset.action === "open-video-explanation") {
          state.toast = "讲解视频演示入口：已打开第 3 题讲解";
          render();
        }
        if (action.dataset.action === "quick-judgment") {
          const task = activeTask();
          const student = task.studentRows.find((item) => item.id === state.detailStudentId);
          const question = ensureStudentGrades(task, student).find((item) => item.id === action.dataset.questionId);
          if (!question) return;
          const previousScore = question.score;
          question.judgment = action.dataset.judgment;
          if (task.kind === "考试" && question.gradingMode === "objective") {
            question.score = question.judgment === "正确" ? question.maxScore : 0;
            student.score = String(Math.max(0, Number(student.score || 0) + question.score - previousScore));
          }
          question.teacherModified = true;
          question.teacherConfirmed = true;
          question.uncertain = false;
          student.grading = "教师已修改";
          student.teacherModified = true;
          task.updated = "刚刚";
          state.toast = "";
          render();
        }
        if (action.dataset.action === "save-detail-grade") {
          const task = activeTask();
          const student = task.studentRows.find((item) => item.id === state.detailStudentId);
          state.detailQuestionId = action.dataset.questionId || state.detailQuestionId;
          const question = ensureStudentGrades(task, student).find((item) => item.id === state.detailQuestionId);
          const judgment = document.querySelector('[name="detail-judgment"]')?.value;
          const scoreInput = document.querySelector('[name="detail-score"]');
          const score = scoreInput ? Number(scoreInput.value) : question.score;
          const comment = document.querySelector('[name="detail-comment"]')?.value.trim();
          if (!Number.isFinite(score) || score < 0 || score > question.maxScore) {
            state.toast = `本题得分需在 0–${question.maxScore} 分之间`;
            render();
          } else {
            const previousQuestionScore = question.score;
            question.judgment = judgment;
            question.score = score;
            question.comment = comment || "教师已确认本题结果。";
            question.teacherModified = true;
            question.teacherConfirmed = true;
            question.uncertain = false;
            const previousTotal = Number(student.score);
            student.score = Number.isFinite(previousTotal)
              ? String(Math.max(0, previousTotal + score - previousQuestionScore))
              : String(ensureStudentGrades(task, student).reduce((total, item) => total + item.score, 0));
            student.grading = "教师已修改";
            student.teacherModified = true;
            task.updated = "刚刚";
            state.showGradeEditor = false;
            state.toast = "已保存本题修改，并同步更新学生总分";
            render();
          }
        }
        if (action.dataset.action === "close-student") {
          state.drawerStudentId = null;
          render();
        }
        if (action.dataset.action === "go-student-anomaly") {
          state.drawerStudentId = null;
          state.taskTab = "anomalies";
          render();
        }
        if (action.dataset.action === "select-anomaly") {
          state.selectedAnomalyId = action.dataset.anomalyId;
          render();
        }
        if (action.dataset.action === "resolve-current" || action.dataset.action === "resolve-similar" || action.dataset.action === "resolve-auto") {
          const task = activeTask();
          const selected = task.anomalies.find((item) => item.id === state.selectedAnomalyId) || task.anomalies[task.anomalies.length - 1];
          const resolvedCount = action.dataset.action === "resolve-similar" ? (selected?.count || 1) : action.dataset.action === "resolve-auto" ? task.anomalyCount : 1;
          state.toast = action.dataset.action === "resolve-similar" ? `已批量处理 ${resolvedCount} 名学生` : action.dataset.action === "resolve-auto" ? `已处理全部 ${resolvedCount} 项可自动确认异常` : "已处理当前学生异常";
          task.anomalyCount = Math.max(0, task.anomalyCount - resolvedCount);
          if (action.dataset.action === "resolve-auto") {
            task.anomalies = [];
            task.studentRows.forEach((student) => {
              student.anomaly = "无";
              student.grading = "AI 批改中";
              student.match = "已匹配";
            });
          } else if (selected) {
            if (action.dataset.action === "resolve-similar" || selected.count <= 1) {
              task.anomalies = task.anomalies.filter((item) => item.id !== selected.id);
            } else {
              selected.count -= 1;
              selected.student = selected.student.replace(/等.*$/, "");
            }
            const keyword = selected.type === "图像质量异常" ? "模糊" : selected.type === "缺页" ? "缺少" : selected.type === "学生匹配失败" ? "涂改" : selected.type;
            task.studentRows.forEach((student) => {
              if (student.anomaly.includes(keyword) || action.dataset.action === "resolve-similar" && selected.type === "图像质量异常") {
                student.anomaly = "无";
                student.grading = "AI 批改中";
                student.match = "已匹配";
              }
            });
          }
          render();
        }
        if (action.dataset.action === "select-trace-student") {
          state.traceStudentId = action.dataset.studentId;
          render();
        }
        if (action.dataset.action === "toggle-trace") {
          state.traceAfter = !state.traceAfter;
          render();
        }
        if (action.dataset.action === "set-student-trace-mode") {
          state.studentTraceMode = action.dataset.mode === "basic" ? "basic" : "detailed";
          render();
        }
        if (action.dataset.action === "scanner-device-home") {
          state.scannerStep = "home";
          render();
        }
        if (action.dataset.action === "scanner-scan-mode") {
          state.scannerStep = "class";
          render();
        }
        if (action.dataset.action === "scanner-trace-mode") {
          state.scannerStep = "trace-ready";
          render();
        }
        if (action.dataset.action === "scanner-start-trace") {
          state.scannerStep = "trace-output";
          render();
        }
        if (action.dataset.action === "open-evidence") {
          state.evidenceOpen = true;
          render();
        }
        if (action.dataset.action === "close-evidence") {
          state.evidenceOpen = false;
          render();
        }
        if (action.dataset.action === "scanner-select-class") {
          state.scannerTaskId = action.dataset.taskId;
          render();
        }
        if (action.dataset.action === "scanner-next") {
          state.scannerStep = "ready";
          render();
        }
        if (action.dataset.action === "scanner-back") {
          state.scannerStep = "class";
          render();
        }
        if (action.dataset.action === "scanner-start") {
          state.scannerStep = "scanning";
          render();
        }
        if (action.dataset.action === "scanner-quality") {
          state.scannerStep = "handoff";
          render();
        }
        if (action.dataset.action === "scanner-save") {
          state.scannerStep = "saved";
          render();
        }
        if (action.dataset.action === "scanner-open-task") {
          state.view = "grading";
          state.gradingMode = "task";
          state.activeTaskId = state.scannerTaskId;
          state.taskTab = "submissions";
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.drawerStudentId) {
          state.drawerStudentId = null;
          render();
          setTimeout(() => document.querySelector('[data-action="task-tab"][data-tab="submissions"]')?.focus(), 0);
        } else if (state.evidenceOpen) {
          state.evidenceOpen = false;
          render();
          setTimeout(() => document.querySelector('[data-action="open-evidence"]')?.focus(), 0);
        }
      });

      document.addEventListener("change", (event) => {
        const typeFilter = event.target.closest('[data-action="home-type-filter"]');
        if (typeFilter) { state.homeTypeFilter = typeFilter.value; render(); return; }
        const classFilter = event.target.closest('[data-action="home-class-filter"]');
        if (classFilter) { state.homeClassFilter = classFilter.value; render(); return; }
        const traceField = event.target.closest('[data-action="edit-trace-cause"], [data-action="edit-trace-advice"]');
        if (traceField) {
          const task = activeTask();
          const student = task.studentRows.find((item) => item.id === state.detailStudentId);
          const question = ensureStudentGrades(task, student).find((item) => item.id === traceField.dataset.questionId);
          if (question) question[traceField.dataset.action === "edit-trace-cause" ? "traceCause" : "traceAdvice"] = traceField.value.trim();
          return;
        }
        const input = event.target.closest('[data-action="edit-subjective-score"]');
        if (!input) return;
        const task = activeTask();
        const student = task.studentRows.find((item) => item.id === state.detailStudentId);
        const question = ensureStudentGrades(task, student).find((item) => item.id === input.dataset.questionId);
        const nextScore = Number(input.value);
        if (!question || !Number.isFinite(nextScore) || nextScore < 0 || nextScore > question.maxScore) { state.toast = `得分需在 0–${question?.maxScore || 0} 分之间`; render(); return; }
        const previousScore = question.score;
        question.score = nextScore;
        question.judgment = nextScore === question.maxScore ? "正确" : nextScore === 0 ? "错误" : "部分正确";
        question.teacherModified = true;
        question.teacherConfirmed = true;
        question.uncertain = false;
        student.score = String(Math.max(0, Number(student.score || 0) + nextScore - previousScore));
        student.grading = "教师已修改";
        task.updated = "刚刚";
        state.toast = `第 ${question.number} 题得分已更新为 ${nextScore} 分`;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
