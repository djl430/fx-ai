        if (isUnansweredResponse(value)) return "未填";
        if (isUnreadableResponse(value)) return "识别不清";
        return value;
      }

      function studentPaperResponseMarkup(answer, resultMark, block = false) {
        const value = String(answer || "未作答");
        const empty = /未作答|没有写|未写|未完成|未填|看不清|字迹模糊|不确定/.test(value);
        return `
          <span class="student-paper-response ${block ? "is-block" : ""}">
            <span class="student-paper-answer ${empty ? "is-empty" : ""}">${value}</span>
            ${resultMark}
          </span>
        `;
      }

      function studentPaperChoiceResponseMarkup(answer, resultMark) {
        const value = studentChoiceSelection(answer);
        const empty = value === "未填" || value === "识别不清";
        return `
          <span class="student-paper-response is-choice">
            （<span class="student-paper-answer ${empty ? "is-empty" : ""}">${value}</span>）
            ${resultMark}
          </span>
        `;
      }

      function studentPaperEvidenceMarkup(question, student) {
        if (!student) return "";
        const steps = student.steps?.length
          ? `<div class="student-paper-steps">${student.steps.map((step) => `
              <div class="student-paper-step"><span>${escapeSnapshotXml(step.text)}</span><span class="mark-icon ${step.result}" aria-label="${labels[step.result].name}"></span></div>
            `).join("")}</div>`
          : "";
        return steps;
      }

      function firstHomeworkPaperQuestionMarkup(question, student, resultMark) {
        const answer = student?.answer || "未作答";
        const response = (value = answer, block = false) => studentPaperResponseMarkup(value, resultMark, block);
        const evidence = studentPaperEvidenceMarkup(question, student);
        switch (question.id) {
          case 1:
            return `
              <div class="student-paper-prompt"><b>1.</b> 二次函数 y = 2x² − 4x + 1 的图像开口方向是${studentPaperChoiceResponseMarkup(answer, resultMark)}。</div>
              <div class="student-paper-options"><span>A. 向下</span><span>B. 向上</span><span>C. 向左</span><span>D. 向右</span></div>
            `;
          case 2:
            return `<div class="student-paper-prompt"><b>2.</b> 函数 y = 2x²，当 x = 1/2 时，y=${response(answer)}。</div>`;
          case 3:
            return `<div class="student-paper-prompt"><b>3.</b> 用配方法求 y = 2x² − 8x + 5 的顶点坐标和最小值。</div>${response(answer, true)}${evidence}`;
          case 4:
            return `<div class="student-paper-prompt"><b>4.</b> 已知抛物线顶点为（1，−3），且经过点（0，−1），求函数解析式。</div>${response(answer, true)}${evidence}`;
          case 5:
            return `<div class="student-paper-prompt"><b>5.</b> 小明说：函数 y = (x−2)² + 1 无论 x 取何值，y 都不小于 1。你同意吗？说明理由。</div>${response(answer, true)}${evidence}`;
          case 6:
            return `<div class="student-paper-prompt"><b>6.</b> 用 20 米长的围栏靠墙围成一个矩形花圃，设垂直于墙的一边长为 x 米，求面积函数及最大面积。</div>${response(answer, true)}${evidence}`;
          default:
            return `<strong>第 ${question.id} 题 · ${question.title}</strong><p>${question.type}</p>${response(answer, true)}`;
        }
      }

      function supportsDisplayedGradingBasis(question) {
        return !/(选择题|判断题)/.test(question.type);
      }

      function studentAnswerPeekMarkup(question, student) {
        const showGradingBasis = supportsDisplayedGradingBasis(question);
        const individualEvidence = showGradingBasis ? studentEvidenceText(question, student) : "";
        return `
          <aside class="student-answer-peek" id="studentAnswerPeek-${question.id}" role="note">
            <span class="student-answer-peek__label">答案</span>
            <strong>${question.answer}</strong>
            ${individualEvidence ? `
              <div class="student-answer-peek__evidence">
                <span class="student-evidence__icon" aria-hidden="true">✦</span>
                <p class="student-evidence__text">${escapeSnapshotXml(individualEvidence)}</p>
              </div>
            ` : ""}
            <button class="student-answer-peek__edit" type="button" data-student-rule-edit="${question.id}" ${regradingQuestions.has(question.id) ? "disabled" : ""}>${showGradingBasis ? "修改答案与标准" : "修改答案"}</button>
          </aside>
        `;
      }

      function similarAnswerStudents(questionId) {
        if (!usesPaperDirectGrading || activeStudentName !== students[0] || Number(questionId) !== 1) return [];
        const question = questions.find((item) => item.id === Number(questionId));
        const source = question?.students.find((student) => student.name === activeStudentName);
        if (!question || !source) return [];
        const normalizedAnswer = studentChoiceSelection(source.answer);
        return question.students
          .filter((student) => studentChoiceSelection(student.answer) === normalizedAnswer)
          .slice(0, 4);
      }

      function similarAnswerSuggestionMarkup(question) {
        const matchingStudents = similarAnswerStudents(question.id);
        if (matchingStudents.length !== 4) return "";
        return `
          <aside class="similar-answer-suggestion" role="note" aria-label="相同作答批量修改建议">
            <div class="similar-answer-suggestion__head">
              <span class="similar-answer-suggestion__spark" aria-hidden="true">✦</span>
              <span>AI 批改建议</span>
            </div>
            <strong>检测到 4 人相同作答</strong>
            <p>4 人均选择 B（向上），可复用当前批改结果，提高批改效率。</p>
            <div class="similar-answer-suggestion__actions">
              <button class="similar-answer-suggestion__action" type="button" data-similar-answer-preview data-question-id="${question.id}">预览 4 人作答</button>
              <button class="similar-answer-suggestion__action is-primary" type="button" data-similar-answer-apply data-question-id="${question.id}">一起修改</button>
            </div>
          </aside>
        `;
      }

      function studentPaperMarkup(pageQuestions) {
        return `
          <header class="student-paper-head">
            <div class="student-paper-head__meta">
              <span>${className}</span>
              <span>姓名：<b>${activeStudentName}</b></span>
            </div>
            <h2>${taskTitle}</h2>
          </header>
          ${pageQuestions.map((question) => {
            const student = studentAttempt(question);
            const currentResult = student?.result || "ungraded";
            const directGradingAttributes = usesPaperDirectGrading
              ? `data-student-paper-question="${question.id}" role="button" tabindex="0" aria-label="第${question.id}题，当前${labels[currentResult].name}，点击切换批改结果" aria-describedby="studentAnswerPeek-${question.id}"`
              : "";
            const resultMark = student && student.result !== "ungraded"
              ? isExam
                ? `<span class="student-paper-score">${studentScore(student, question)}/${maxScore(question)}</span>`
                : usesPaperDirectGrading
                  ? `<span class="student-paper-mark is-inline"><span class="mark-icon ${student.result}"></span></span>`
                  : `<span class="student-paper-mark"><span class="mark-icon ${student.result}"></span></span>`
              : "";
            const directPaperQuestionContent = usesPaperDirectGrading
              ? firstHomeworkPaperQuestionMarkup(question, student, resultMark)
              : "";
            const paperQuestionContent = usesPaperDirectGrading
              ? `${directPaperQuestionContent}${studentAnswerPeekMarkup(question, student)}`
              : `
                <strong>第 ${question.id} 题 · ${question.title}</strong>
                <p>${question.type}</p>
                <div class="student-paper-answer ${student ? "" : "is-empty"}">学生作答：${student?.answer || "暂无作答"}</div>
                ${resultMark}
              `;
            const similarAnswerSuggestion = usesPaperDirectGrading ? similarAnswerSuggestionMarkup(question) : "";
            return `
              <div class="student-paper-question-shell">
                <section class="student-paper-question" ${directGradingAttributes}>
                  ${paperQuestionContent}
                </section>
                ${similarAnswerSuggestion}
              </div>
            `;
          }).join("")}
        `;
      }

      function studentQuestionParts(question, student) {
        const isCompound = !isExam && (question.answer.includes("；") || question.id === 4);
        if (!isCompound) return [];
        const expected = question.answer.split(/[；，]/).map((part) => part.trim()).filter(Boolean);
        const answers = String(student.answer || "").split(/[；，]/).map((part) => part.trim()).filter(Boolean);
        if (!Array.isArray(student.partResults) || student.partResults.length !== expected.length) {
          student.partResults = expected.map((_, index) => {
            if (student.result === "correct" || student.result === "wrong" || student.result === "ungraded") return student.result;
            return index === 0 ? "correct" : "wrong";
          });
        }
        return expected.map((expectedAnswer, index) => ({
          label: `空${index + 1}`,
          answer: answers[index] || expectedAnswer,
          result: student.partResults[index]
        }));
      }

      function syncStudentResultFromParts(student) {
        if (student.partResults.every((result) => result === "correct")) student.result = "correct";
        else if (student.partResults.every((result) => result === "wrong")) student.result = "wrong";
        else if (student.partResults.every((result) => result === "ungraded")) student.result = "ungraded";
        else student.result = "partial";
      }

      function updateStudentPartResult(questionId, partIndex, result) {
        const question = questions.find((item) => item.id === Number(questionId));
        const student = question?.students.find((item) => item.name === activeStudentName);
        if (!student || !["correct", "wrong"].includes(result)) return;
        studentQuestionParts(question, student);
        student.partResults[Number(partIndex)] = result;
        syncStudentResultFromParts(student);
        studentCompletion.delete(activeStudentName);
        renderStudentWorkspace();
      }

      function updateStudentBulkResult(questionId, result) {
        const question = questions.find((item) => item.id === Number(questionId));
        const student = question?.students.find((item) => item.name === activeStudentName);
        if (!student || !["correct", "wrong"].includes(result)) return;
        const parts = studentQuestionParts(question, student);
        student.partResults = parts.map(() => result);
        student.result = result;
        studentCompletion.delete(activeStudentName);
        renderStudentWorkspace();
      }

      function judgeButtons(question, student, attribute = "data-student-result") {
        return `
          <button class="student-judge-button ${student.result === "correct" ? "is-active" : ""}" type="button" ${attribute}="correct" data-question-id="${question.id}" aria-label="第${question.id}题正确">✓</button>
          <button class="student-judge-button ${student.result === "wrong" ? "is-active" : ""}" type="button" ${attribute}="wrong" data-question-id="${question.id}" aria-label="第${question.id}题错误">×</button>
        `;
      }

      function studentToolsMarkup(pageQuestions) {
        return pageQuestions.map((question) => {
          const student = studentAttempt(question);
          if (!student) {
            return `
              <section class="student-question-tool">
                <div class="student-question-tool__head"><strong>题${question.id}</strong><button class="student-tool-menu" type="button" aria-label="更多操作">···</button></div>
                <p class="student-tool-answer is-empty">暂无作答</p>
              </section>
            `;
          }

          if (isExam) {
            if (isObjectiveQuestion(question)) {
              return `
                <section class="student-question-tool student-exam-tool">
                  <div class="student-question-tool__head">
                    <div class="student-exam-tool__meta"><strong>题${question.id}</strong><span class="student-exam-type">${question.type.split(" · ")[0]}</span></div>
                    <span class="student-exam-score-summary">${studentScore(student, question)}/${maxScore(question)} 分</span>
                  </div>
                  <div class="student-exam-objective">
                    <div class="student-exam-judge-group">
                      <button class="student-exam-judge-button ${student.result === "correct" ? "is-active" : ""}" type="button" data-student-result="correct" data-question-id="${question.id}" aria-label="第${question.id}题判对"><i>✓</i><span>对</span></button>
                      <button class="student-exam-judge-button ${student.result === "wrong" ? "is-active" : ""}" type="button" data-student-result="wrong" data-question-id="${question.id}" aria-label="第${question.id}题判错"><i>×</i><span>错</span></button>
                    </div>
                    <button class="student-tool-menu" type="button" aria-label="更多操作">···</button>
                  </div>
                  <p class="student-tool-answer">答案：${student.answer}</p>
                </section>
              `;
            }
            return `
              <section class="student-question-tool student-exam-tool">
                <div class="student-question-tool__head">
                  <div class="student-exam-tool__meta"><strong>题${question.id}</strong><span class="student-exam-type">${question.type.split(" · ")[0]}</span></div>
                  <span class="student-exam-score-summary">${studentScore(student, question)}/${maxScore(question)} 分</span>
                </div>
                <p class="student-tool-answer">答案：${student.answer}</p>
                <label class="student-subjective-score"><span>老师赋分</span><span class="student-subjective-score__editor"><input type="number" min="0" max="${maxScore(question)}" step="0.5" value="${scoreInputValue(student, question)}" data-student-score data-question-id="${question.id}" aria-label="第${question.id}题得分"> / ${maxScore(question)} 分</span></label>
              </section>
            `;
          }

          const parts = studentQuestionParts(question, student);
          if (parts.length) {
            const allCorrect = student.partResults.every((result) => result === "correct");
            const allWrong = student.partResults.every((result) => result === "wrong");
            return `
              <section class="student-question-tool">
                <div class="student-question-tool__head">
                  <strong>题${question.id}</strong>
                  <div class="student-judge-group">
                    <button class="student-judge-button with-label ${allCorrect ? "is-active" : ""}" type="button" data-student-bulk-result="correct" data-question-id="${question.id}"><i>✓</i><span>全对</span></button>
                    <button class="student-judge-button with-label ${allWrong ? "is-active" : ""}" type="button" data-student-bulk-result="wrong" data-question-id="${question.id}"><i>×</i><span>全错</span></button>
                    <button class="student-tool-menu" type="button" aria-label="更多操作">···</button>
                  </div>
                </div>
                <div class="student-part-list">${parts.map((part, index) => `
                  <div class="student-part-row">
                    <span>${part.label}</span>
                    <div class="student-judge-group">
                      <button class="student-judge-button ${part.result === "correct" ? "is-active" : ""}" type="button" data-student-part-result="correct" data-question-id="${question.id}" data-part-index="${index}" aria-label="${part.label}正确">✓</button>
                      <button class="student-judge-button ${part.result === "wrong" ? "is-active" : ""}" type="button" data-student-part-result="wrong" data-question-id="${question.id}" data-part-index="${index}" aria-label="${part.label}错误">×</button>
                    </div>
                  </div>
                `).join("")}</div>
                <p class="student-tool-answer">答案：${student.answer}</p>
              </section>
            `;
          }

          return `
            <section class="student-question-tool">
              <div class="student-question-tool__head">
                <strong>题${question.id}</strong>
                <div class="student-judge-group">
                  ${judgeButtons(question, student)}
                  <button class="student-tool-menu" type="button" aria-label="更多操作">···</button>
                </div>
              </div>
              <p class="student-tool-answer">答案：${student.answer}</p>
            </section>
          `;
        }).join("");
      }

      function studentToolPanelMarkup(pageQuestions, index, pages) {
        if (usesPaperDirectGrading) return "";
        return `
          <aside class="student-tool-panel" aria-label="第 ${index + 1} 页${isExam ? "结构化赋分" : "结构化批改"}工具">
            <header class="student-tool-head">
              <strong class="student-tool-page">${index + 1}/${pages.length}</strong>
            </header>
            <div class="student-question-tools">${studentToolsMarkup(pageQuestions)}</div>
          </aside>
        `;
      }

      function renderStudentPages() {
        const pages = studentPages();
        studentPageStack.innerHTML = pages.map((pageQuestions, index) => `
          <section class="student-page-row" data-student-page="${index + 1}" data-paper-direct="${usesPaperDirectGrading}">
            <main class="student-paper-stage" aria-label="第 ${index + 1} 页学生作业">
              <article class="student-paper">${studentPaperMarkup(pageQuestions)}</article>
            </main>
            ${studentToolPanelMarkup(pageQuestions, index, pages)}
          </section>
        `).join("");
      }

      function renderStudentWorkspace() {
        renderStudentList();
        renderStudentPages();
        renderStudentRegradeStatus();
        confirmStudent.textContent = studentCompletion.has(activeStudentName)
          ? isExam ? "✓ 已确认赋分，可继续检查" : "✓ 已确认，可继续检查"
          : isExam ? "确认本学生赋分" : "确认批改";
        confirmAllStudents.textContent = studentCompletion.size === studentNames.length
          ? isExam ? "✓ 已确认全部赋分" : "✓ 已确认全部批改"
          : isExam ? "一键确认赋分" : "一键确认批改";
      }

      function updateStudentResult(questionId, result) {
        const question = questions.find((item) => item.id === Number(questionId));
        const student = question?.students.find((item) => item.name === activeStudentName);
        if (!student || !labels[result]) return;
        student.result = result;
        delete student.partResults;
        if (isExam) student.score = defaultScoreForResult(result, question);
        studentCompletion.delete(activeStudentName);
        renderStudentWorkspace();
      }

      function renderSimilarAnswerPreview(questionId) {
        const question = questions.find((item) => item.id === Number(questionId));
        const matchingStudents = similarAnswerStudents(questionId);
        const previewGrid = document.getElementById("similarAnswerPreviewGrid");
        if (!question || matchingStudents.length !== 4) return false;
        previewGrid.innerHTML = matchingStudents.map((student) => `
          <article class="similar-answer-crop">
            <div class="similar-answer-crop__student">
              <strong>${escapeSnapshotXml(student.name)}</strong>
              <span>第 1 题 · ${labels[student.result].name}</span>
            </div>
            <div class="similar-answer-crop__question">二次函数 y = 2x² − 4x + 1 的图像开口方向是（　）。</div>
            <div class="similar-answer-crop__response">学生作答：（${escapeSnapshotXml(studentChoiceSelection(student.answer))}）</div>
            ${student.result === "ungraded" ? "" : `<span class="similar-answer-crop__mark"><span class="mark-icon ${student.result}"></span></span>`}
          </article>
        `).join("");
        document.getElementById("similarAnswerApplyAll").dataset.questionId = String(questionId);
        return true;
      }

      function applySimilarAnswerBatch(questionId) {
        const question = questions.find((item) => item.id === Number(questionId));
        const source = question?.students.find((student) => student.name === activeStudentName);
        const matchingStudents = similarAnswerStudents(questionId);
        if (!question || !source || matchingStudents.length !== 4) return;
        matchingStudents.forEach((student) => {
          student.result = source.result;
          delete student.partResults;
          studentCompletion.delete(student.name);
        });
        renderStudentWorkspace();
        const modal = document.getElementById("similarAnswerModal");
        if (modal.classList.contains("open")) setModal(modal, false);
        showToast(`已同步修改 4 人 · 第 ${question.id} 题均标记为${labels[source.result].name}`);
      }

      function pinStudentPaperAnswer(questionId) {
        window.clearTimeout(studentAnswerPinTimer);
        studentPageStack.querySelectorAll(".is-answer-pinned").forEach((item) => item.classList.remove("is-answer-pinned"));
        const question = studentPageStack.querySelector(`[data-student-paper-question="${questionId}"]`);
        if (!question) return;
        question.classList.add("is-answer-pinned");
        studentAnswerPinTimer = window.setTimeout(() => question.classList.remove("is-answer-pinned"), 1600);
      }

      function cycleStudentPaperResult(questionId) {
        const question = questions.find((item) => item.id === Number(questionId));
        if (question && regradingQuestions.has(question.id)) return;
        const student = question?.students.find((item) => item.name === activeStudentName);
        if (!usesPaperDirectGrading || !student) return;
        const nextResult = {
          ungraded: "correct",
          correct: "wrong",
          wrong: "partial",
          partial: "correct"
        }[student.result] || "correct";
        updateStudentResult(questionId, nextResult);
        pinStudentPaperAnswer(questionId);
        showToast(`${activeStudentName} · 第 ${questionId} 题已标记为${labels[nextResult].name}`);
      }

      function gradingViewLabel(view) {
        if (view === "student") return isExam ? "按学生赋分" : "按学生批改";
        return isExam ? "按题赋分" : "按题批改";
      }

      function closeGradingViewDropdowns() {
        document.querySelectorAll("[data-grading-view-dropdown]").forEach((dropdown) => {
          dropdown.classList.remove("is-open");
          dropdown.querySelector(".grading-mode-menu").hidden = true;
          dropdown.querySelector("[data-grading-view-trigger]").setAttribute("aria-expanded", "false");
        });
      }

      function syncGradingViewDropdowns() {
        document.querySelectorAll("[data-grading-view-dropdown]").forEach((dropdown) => {
          const trigger = dropdown.querySelector("[data-grading-view-trigger]");
          const current = dropdown.querySelector("[data-grading-view-current]");
          current.textContent = gradingViewLabel(gradingView);
          trigger.setAttribute("aria-expanded", "false");
          dropdown.classList.remove("is-open");
          dropdown.querySelector(".grading-mode-menu").hidden = true;
          dropdown.querySelectorAll("[data-grading-view-option]").forEach((option) => {
            const selected = option.dataset.gradingViewOption === gradingView;
            option.classList.toggle("is-selected", selected);
            option.setAttribute("aria-selected", String(selected));
          });
        });
      }

      function setGradingView(view) {
        gradingView = view === "student" ? "student" : "question";
        questionWorkspace.hidden = gradingView !== "question";
        studentWorkspace.hidden = gradingView !== "student";
        syncGradingViewDropdowns();
        if (gradingView === "question") renderAll();
        else renderStudentWorkspace();
      }

      document.querySelectorAll("[data-grading-view-dropdown]").forEach((dropdown) => {
        const trigger = dropdown.querySelector("[data-grading-view-trigger]");
        const menu = dropdown.querySelector(".grading-mode-menu");
        trigger.addEventListener("click", () => {
          const shouldOpen = menu.hidden;
          closeGradingViewDropdowns();
          if (!shouldOpen) return;
          menu.hidden = false;
          dropdown.classList.add("is-open");
          trigger.setAttribute("aria-expanded", "true");
        });
        dropdown.querySelectorAll("[data-grading-view-option]").forEach((option) => {
          option.addEventListener("click", () => setGradingView(option.dataset.gradingViewOption));
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("[data-grading-view-dropdown]")) closeGradingViewDropdowns();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeGradingViewDropdowns();
      });

      studentList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-student-name]");
        if (!button) return;
        activeStudentName = button.dataset.studentName;
        renderStudentWorkspace();
        studentPageStack.scrollTop = 0;
      });

      function openStudentRuleEditor(questionId) {
        const question = questions.find((item) => item.id === Number(questionId));
        if (!usesPaperDirectGrading || !question || regradingQuestions.has(question.id)) return;
        const showGradingBasis = supportsDisplayedGradingBasis(question);
        activeQuestionId = question.id;
        editingStudentRuleQuestionId = question.id;
        studentRuleTitle.textContent = showGradingBasis ? "修改答案与批改标准" : "修改答案";
        studentRuleQuestionLabel.textContent = `第 ${question.id} 题 · ${question.title}`;
        studentGradingAnswerInput.value = question.answer;
        studentGradingRuleField.hidden = !showGradingBasis;
        studentGradingRuleInput.disabled = !showGradingBasis;
        studentGradingRuleInput.value = showGradingBasis ? (question.teacherBasis || question.basis).join("\n") : "";
        setModal(modals.studentRule, true);
        studentGradingAnswerInput.focus();
      }

      studentPageStack.addEventListener("click", (event) => {
        const ruleEdit = event.target.closest("[data-student-rule-edit]");
        if (ruleEdit) {
          event.preventDefault();
          event.stopPropagation();
          openStudentRuleEditor(ruleEdit.dataset.studentRuleEdit);
          return;
        }
        const similarPreview = event.target.closest("[data-similar-answer-preview]");
        if (similarPreview) {
          event.preventDefault();
          event.stopPropagation();
          if (renderSimilarAnswerPreview(similarPreview.dataset.questionId)) {
            setModal(modals.similarAnswer, true);
          }
          return;
        }
        const similarApply = event.target.closest("[data-similar-answer-apply]");
        if (similarApply) {
          event.preventDefault();
          event.stopPropagation();
          applySimilarAnswerBatch(similarApply.dataset.questionId);
          return;
        }
        const paperQuestion = event.target.closest("[data-student-paper-question]");
        if (paperQuestion) {
          cycleStudentPaperResult(paperQuestion.dataset.studentPaperQuestion);
          return;
        }
        const partButton = event.target.closest("[data-student-part-result]");
        if (partButton) {
          updateStudentPartResult(partButton.dataset.questionId, partButton.dataset.partIndex, partButton.dataset.studentPartResult);
          showToast(`${activeStudentName} · 第 ${partButton.dataset.questionId} 题${Number(partButton.dataset.partIndex) + 1}空已更新`);
          return;
        }
        const bulkButton = event.target.closest("[data-student-bulk-result]");
        if (bulkButton) {
          updateStudentBulkResult(bulkButton.dataset.questionId, bulkButton.dataset.studentBulkResult);
          showToast(`${activeStudentName} · 第 ${bulkButton.dataset.questionId} 题已设为${bulkButton.dataset.studentBulkResult === "correct" ? "全对" : "全错"}`);
          return;
        }
        const button = event.target.closest("[data-student-result]");
        if (!button) return;
        updateStudentResult(button.dataset.questionId, button.dataset.studentResult);
        showToast(`${activeStudentName} · 第 ${button.dataset.questionId} 题已标记为${labels[button.dataset.studentResult].name}`);
      });

      studentPageStack.addEventListener("keydown", (event) => {
        if (event.target.closest("[data-student-rule-edit]")) return;
        if (event.key !== "Enter" && event.key !== " ") return;
        const paperQuestion = event.target.closest("[data-student-paper-question]");
        if (!paperQuestion) return;
        event.preventDefault();
        const questionId = paperQuestion.dataset.studentPaperQuestion;
        cycleStudentPaperResult(questionId);
        studentPageStack.querySelector(`[data-student-paper-question="${questionId}"]`)?.focus({ preventScroll: true });
      });

      studentPageStack.addEventListener("change", (event) => {
        const input = event.target.closest("[data-student-score]");
        if (!input) return;
        const question = questions.find((item) => item.id === Number(input.dataset.questionId));
        const student = question?.students.find((item) => item.name === activeStudentName);
        if (!student || input.value === "") {
          renderStudentWorkspace();
          return;
        }
        const parsed = Number(input.value);
        if (!Number.isFinite(parsed)) {
          renderStudentWorkspace();
          return;
        }
        const max = maxScore(question);
        student.score = Math.max(0, Math.min(max, Math.round(parsed * 2) / 2));
        student.result = student.score === max ? "correct" : student.score === 0 ? "wrong" : "partial";
        studentCompletion.delete(activeStudentName);
        renderStudentWorkspace();
        showToast(`${activeStudentName} · 第 ${question.id} 题已更新为 ${formatScore(student.score)} 分`);
      });

      confirmStudent.addEventListener("click", () => {
        studentCompletion.add(activeStudentName);
        const confirmedName = activeStudentName;
        const currentIndex = studentNames.indexOf(activeStudentName);
        const nextStudent = studentNames.find((name, index) => index > currentIndex && !studentCompletion.has(name))
          || studentNames.find((name) => !studentCompletion.has(name));
        if (nextStudent) activeStudentName = nextStudent;
        renderStudentWorkspace();
        showToast(nextStudent
          ? `已确认 ${confirmedName}，自动进入 ${nextStudent}`
          : `全部 ${studentNames.length} 名学生已确认`);
      });

      confirmAllStudents.addEventListener("click", () => {
        confirmAllGradingResults();
        renderStudentWorkspace();
      });

      let resultNavigationFrame = 0;

      function setActiveResultNavigation(result) {
        resultNavigation.querySelectorAll("[data-result-target]").forEach((button) => {
          const active = button.dataset.resultTarget === result;
          button.classList.toggle("is-active", active);
          if (active) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
      }

      function syncResultNavigation() {
        const sections = [...groupsScroll.querySelectorAll(".group-section[data-result]")];
        if (!sections.length) return;
        const nearBottom = groupsScroll.scrollTop + groupsScroll.clientHeight >= groupsScroll.scrollHeight - 2;
        if (nearBottom) {
          setActiveResultNavigation(sections.at(-1).dataset.result);
          return;
        }
        const scrollRect = groupsScroll.getBoundingClientRect();
        const marker = scrollRect.top + Math.min(140, scrollRect.height * .28);
        let current = sections[0];
        sections.forEach((section) => {
          if (section.getBoundingClientRect().top <= marker) current = section;
        });
        setActiveResultNavigation(current.dataset.result);
      }

      function bindResultNavigation() {
        resultNavigation.querySelectorAll("[data-result-target]").forEach((button) => {
          button.addEventListener("click", () => {
            const target = groupsScroll.querySelector(`.group-section[data-result="${button.dataset.resultTarget}"]`);
            if (!target) return;
            const top = groupsScroll.scrollTop
              + target.getBoundingClientRect().top
              - groupsScroll.getBoundingClientRect().top
              - 12;
            groupsScroll.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
            setActiveResultNavigation(button.dataset.resultTarget);
          });
        });
        groupsScroll.addEventListener("scroll", () => {
          if (resultNavigationFrame) return;
          resultNavigationFrame = requestAnimationFrame(() => {
            resultNavigationFrame = 0;
            syncResultNavigation();
          });
        }, { passive: true });
      }

      function renderGroups() {
        const question = activeQuestion();
        if (isSimilarityGrouping && question.groups) {
          renderSimilarityGroups(question);
          return;
        }
        groupsScroll.innerHTML = order.map(result => {
          const group = question.students.filter(student => student.result === result);
          return `
            <section class="group-section" data-result="${result}">
              <header class="group-head">
                <div class="group-heading">
                  <span class="dot ${result}"></span>
                  <h3>${labels[result].name}</h3>
                  <span class="group-count">${group.length} 人</span>
                </div>
              </header>
              ${group.length ? `<div class="student-grid" style="--columns:${columns}">${group.map(student => studentCard(student)).join("")}</div>` : `<div class="empty-group">当前没有学生作答</div>`}
            </section>
          `;
        }).join("");

        bindPaperInteractions();
        syncResultNavigation();
      }

      function renderSimilarityGroups(question) {
        const groupResultTool = (group) => {
          const result = labels[group.result] ? group.result : "ungraded";
          return `
          <button class="group-result-button" type="button" data-batch-group="${group.id}" data-current-result="${result}" aria-label="点击切换本组批改结果，当前${labels[result].name}">
            <span class="mark-icon ${result}" aria-hidden="true"></span>
          </button>
        `;
        };

        groupsScroll.innerHTML = question.groups
          .slice()
          .sort((a, b) => order.indexOf(a.result) - order.indexOf(b.result))
          .map(group => {
            const studentsInGroup = question.students.filter(student => student.groupId === group.id);
            return `
              <section class="group-section shape-group-section" data-result="${group.result}" data-group="${group.id}">
                <header class="shape-group-head">
                  <div class="shape-group-head__top">
                    <div class="shape-group-title">
                      <span class="dot ${group.result}"></span>
                      <h3>${group.title}</h3>
                    </div>
                    <div class="shape-group-state">
                      <div class="group-result-tools" aria-label="${group.title}批改结果">
                        ${groupResultTool(group)}
                      </div>
                      <span class="shape-group-count">${studentsInGroup.length} 人</span>
                    </div>
                  </div>
                </header>
                ${studentsInGroup.length ? `<div class="student-grid" style="--columns:${columns}">${studentsInGroup.map(student => studentCard(student)).join("")}</div>` : `<div class="empty-group">当前没有学生作答</div>`}
              </section>
            `;
          }).join("");

        bindPaperInteractions();
        bindGroupActions();
        syncResultNavigation();
      }

      function bindGroupActions() {
        groupsScroll.querySelectorAll("[data-batch-group]").forEach(button => {
          button.addEventListener("click", event => {
            event.stopPropagation();
            const question = activeQuestion();
            const group = question.groups?.find(item => item.id === button.dataset.batchGroup);
            const currentResult = group?.result || "ungraded";
            batchUpdateGroup(button.dataset.batchGroup, cycle[currentResult] || "correct", button);
          });
        });
      }

      function batchUpdateGroup(groupId, result, trigger) {
        const question = activeQuestion();
        const group = question.groups?.find(item => item.id === groupId);
        if (group) group.result = result;
        const studentsInGroup = question.students.filter(student => student.groupId === groupId);
        studentsInGroup.forEach(student => {
          student.result = result;
          delete student.partResults;
          const paper = groupsScroll.querySelector(`.answer-paper[data-student="${student.id}"]`);
          if (paper) renderCardResult(paper.closest(".student-card"), paper, student, question);
        });
        const section = trigger.closest(".group-section");
        if (section) {
          section.dataset.result = result;
          const dot = section.querySelector(".shape-group-title .dot");
          if (dot) dot.className = `dot ${result}`;
          const resultButton = section.querySelector(".group-result-button");
          if (resultButton) {
            resultButton.dataset.currentResult = result;
            resultButton.setAttribute("aria-label", `点击切换本组批改结果，当前${labels[result].name}`);
            const icon = resultButton.querySelector(".mark-icon");
            if (icon) icon.className = `mark-icon ${result}`;
          }
        }
        showToast(`已将本组 ${studentsInGroup.length} 份作答批为${labels[result].name}`);
      }

      function bindPaperInteractions() {
        groupsScroll.querySelectorAll("[data-score-input]").forEach((input) => {
          input.closest("[data-score-editor]").addEventListener("click", (event) => event.stopPropagation());
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") input.blur();
          });
          input.addEventListener("change", () => commitExamScore(input.dataset.student, input.value));
        });
        groupsScroll.querySelectorAll(".answer-paper").forEach(paper => {
          paper.addEventListener("click", () => cycleResult(paper.dataset.student, paper));
          paper.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              cycleResult(paper.dataset.student, paper);
            }
          });
        });
      }

      function studentCard(student) {
        const question = activeQuestion();
        const mark = isExam
          ? `<span class="score-mark" data-score-editor><input class="score-input" type="number" min="0" max="${maxScore(question)}" step="0.5" value="${scoreInputValue(student, question)}" placeholder="待评" data-score-input data-student="${student.id}" aria-label="${student.name}第 ${question.id} 题得分"> / ${maxScore(question)} 分</span>`
          : `<span class="paper-trace-mark ${student.result}"><span class="mark-icon ${student.result}"></span></span>`;
        return `
          <article class="student-card" data-result="${student.result}">
            <header class="student-card-head">
              <span class="student-name">${student.name}</span>
            </header>
            <div class="answer-paper" role="button" tabindex="0" data-student="${student.id}" aria-label="切换${student.name}的批改结果">
              ${mark}
              <div class="handwriting">${student.answer}</div>
            </div>
            ${studentEvidenceMarkup(question, student)}
          </article>
        `;
      }

      function renderCardResult(card, paper, student, question) {
        card.dataset.result = student.result;
        if (isExam) {
          const scoreInput = paper.querySelector(".score-input");
          if (scoreInput) scoreInput.value = scoreInputValue(student, question);
          return;
        }
        const trace = paper.querySelector(".paper-trace-mark");
        const icon = paper.querySelector(".mark-icon");
        if (trace) trace.className = `paper-trace-mark ${student.result}`;
        if (icon) icon.className = `mark-icon ${student.result}`;
      }

      function cycleResult(studentId, paper) {
        const question = activeQuestion();
        if (regradingQuestions.has(question.id)) return;
        const student = question.students.find(item => item.id === studentId);

        if (isExam) {
          const max = maxScore(question);
          const currentScore = typeof student.score === "number"
            ? student.score
            : defaultScoreForResult(student.result, question);
          const numericScore = typeof currentScore === "number" ? currentScore : max;
          const nextScore = numericScore <= 0 ? max : Math.max(0, Math.round((numericScore - 0.5) * 2) / 2);
          student.score = nextScore;
          student.result = nextScore === max ? "correct" : nextScore === 0 ? "wrong" : "partial";
          renderAll();
          showToast(`${student.name}：已调整为 ${formatScore(nextScore)} / ${max} 分`);
          return;
        }

        const oldResult = student.result;
        student.result = cycle[oldResult];
        delete student.partResults;
        renderCardResult(paper.closest(".student-card"), paper, student, question);
        showToast(`${student.name}：${labels[oldResult].name} → ${labels[student.result].name}`);
      }

      function commitExamScore(studentId, rawValue) {
        const question = activeQuestion();
        const student = question.students.find((item) => item.id === studentId);
        const max = maxScore(question);
        if (!student || rawValue === "") {
          renderAll();
          return;
        }
        const parsed = Number(rawValue);
        if (!Number.isFinite(parsed)) {
          renderAll();
          return;
        }
        const score = Math.max(0, Math.min(max, Math.round(parsed * 2) / 2));
        student.score = score;
        student.result = score === max ? "correct" : score === 0 ? "wrong" : "partial";
        renderAll();
      }

      function renderAll() {
        renderQuestions();
        renderAssistant();
        renderGroups();
      }

      editGradingAnswer.addEventListener("click", () => {
        const question = activeQuestion();
        if (!usesPaperDirectGrading || regradingQuestions.has(question.id)) return;
        editingRuleQuestionId = question.id;
        gradingAnswerInput.value = question.answer;
        gradingRuleInput.value = question.basis.join("\n");
        renderRuleEditor(question);
        gradingAnswerInput.focus();
      });

      gradingAnswerEditor.querySelector("[data-rule-cancel]").addEventListener("click", () => {
        editingRuleQuestionId = null;
        renderRuleEditor(activeQuestion());
      });

      gradingAnswerEditor.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = activeQuestion();
        if (!usesPaperDirectGrading || editingRuleQuestionId !== question.id) return;
        const showGradingBasis = supportsDisplayedGradingBasis(question);
        const nextAnswer = gradingAnswerInput.value.trim();
        const nextRules = showGradingBasis
          ? gradingRuleInput.value.split("\n").map((item) => item.trim()).filter(Boolean)
          : [`答案 ${nextAnswer} 判为正确，其他作答判为错误。`];
        if (!nextAnswer || (showGradingBasis && !nextRules.length)) {
          showToast(showGradingBasis ? "请填写答案和至少一条批改标准" : "请填写答案");
          return;
        }
        applyTeacherRule(question, nextAnswer, nextRules);
      });

      studentRuleEditor.querySelector("[data-student-rule-cancel]").addEventListener("click", () => {
        editingStudentRuleQuestionId = null;
        setModal(modals.studentRule, false);
      });

      studentRuleEditor.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = questions.find((item) => item.id === editingStudentRuleQuestionId);
        if (!usesPaperDirectGrading || !question || regradingQuestions.has(question.id)) return;
        const showGradingBasis = supportsDisplayedGradingBasis(question);
        const nextAnswer = studentGradingAnswerInput.value.trim();
        const nextRules = showGradingBasis ? studentGradingRuleInput.value.split("\n").map((item) => item.trim()).filter(Boolean) : [`选择 ${studentChoiceSelection(nextAnswer)} 判为正确，其他选项判为错误。`];
        if (!nextAnswer || (showGradingBasis && !nextRules.length)) {
          showToast(showGradingBasis ? "请填写老师答案和至少一条批改依据" : "请填写老师答案");
          return;
        }
        editingStudentRuleQuestionId = null;
        setModal(modals.studentRule, false);
        applyTeacherRule(question, nextAnswer, nextRules);
      });

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }

      document.querySelectorAll(".density-button").forEach(button => {
        button.addEventListener("click", () => {
          columns = Number(button.dataset.columns);
          document.querySelectorAll(".density-button").forEach(item => item.classList.toggle("active", item === button));
          renderGroups();
          showToast(`已切换为每行 ${columns} 份作业`);
        });
      });

      function confirmAllGradingResults() {
        studentNames.forEach((name) => studentCompletion.add(name));
        questions.forEach((question) => {
          question.status = "completed";
          gradingProgress = FxCollectionFlow.markQuestionCompleted(gradingProgress, gradingProgressKey, question.id);
        });
        saveGradingProgress();
        renderQuestions();
        persistTaskCompletionIfReady();
        showTaskCompletion();
        showToast(`已确认全部 ${questions.length} 道题的${isExam ? "赋分" : "批改"}结果`);
      }

      confirmAllButton.addEventListener("click", confirmAllGradingResults);

      confirmQuestionButton.addEventListener("click", () => {
        const currentIndex = questions.findIndex(question => question.id === activeQuestionId);
        questions[currentIndex].status = "completed";
        gradingProgress = FxCollectionFlow.markQuestionCompleted(
          gradingProgress,
          gradingProgressKey,
          questions[currentIndex].id,
        );
        saveGradingProgress();
        const allCompleted = persistTaskCompletionIfReady();
        if (allCompleted) showTaskCompletion();
        const nextQuestion = questions.find((question) => question.status !== "completed");
        if (nextQuestion) {
          activeQuestionId = nextQuestion.id;
          explanationDetails.open = false;
          renderAll();
          groupsScroll.scrollTop = 0;
          showToast(`已确认第 ${questions[currentIndex].id} 题，自动进入第 ${nextQuestion.id} 题`);
          return;
        }
        renderAll();
        showToast(allCompleted ? `全部题目${isExam ? "赋分" : "批改"}已确认` : "已确认最后一题，可以发布批改结果");
      });

      const modals = {
        similarAnswer: document.getElementById("similarAnswerModal"),
        studentRule: document.getElementById("studentRuleModal"),
        questionSnapshot: document.getElementById("questionSnapshotModal")
      };

      function setModal(modal, open) {
        modal.classList.toggle("open", open);
        modal.setAttribute("aria-hidden", String(!open));
        if (!open && modal.id === "studentRuleModal") editingStudentRuleQuestionId = null;
        if (open) modal.querySelector(".modal-close").focus();
      }

      document.querySelectorAll("[data-modal]").forEach(button => button.addEventListener("click", () => setModal(modals[button.dataset.modal], true)));
      document.getElementById("similarAnswerApplyAll").addEventListener("click", (event) => {
        applySimilarAnswerBatch(event.currentTarget.dataset.questionId);
      });
      document.querySelector("#similarAnswerModal .modal-close-secondary").addEventListener("click", () => setModal(modals.similarAnswer, false));
      document.querySelectorAll(".modal-backdrop").forEach(modal => {
        modal.querySelector(".modal-close").addEventListener("click", () => setModal(modal, false));
        modal.addEventListener("click", event => { if (event.target === modal) setModal(modal, false); });
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") document.querySelectorAll(".modal-backdrop.open").forEach(modal => setModal(modal, false));
      });

      bindResultNavigation();
      setGradingView("question");
    })();
  </script>
</body>
</html>
