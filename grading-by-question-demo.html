<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>飞象智批 · 按题批改 Demo</title>
  <style>
    :root {
      --ink: #172341;
      --muted: #74809a;
      --line: #dfe6f2;
      --panel: rgba(255, 255, 255, 0.92);
      --canvas: #eef3fa;
      --brand: #4f66d8;
      --brand-dark: #30457e;
      --brand-soft: #edf1ff;
      --green: #23996b;
      --green-soft: #edf9f4;
      --amber: #d38a24;
      --amber-soft: #fff7e8;
      --red: #d95662;
      --red-soft: #fff1f2;
      --gray: #8390a9;
      --gray-soft: #f2f5f9;
      --shadow: 0 18px 50px rgba(39, 57, 99, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 4%, rgba(99, 121, 229, 0.18), transparent 27%),
        radial-gradient(circle at 16% 96%, rgba(72, 157, 142, 0.10), transparent 28%),
        var(--canvas);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .app-shell {
      height: 100vh;
      padding: 18px;
    }

    .app {
      height: 100%;
      min-height: 720px;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 26px;
      background: rgba(249, 251, 255, 0.82);
      box-shadow: 0 24px 70px rgba(38, 54, 92, 0.13);
      overflow: hidden;
      backdrop-filter: blur(24px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.78);
    }

    .title-lockup { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .grading-task-lockup { min-width: 0; }
    .grading-task-lockup strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .grading-task-lockup strong { max-width:460px; color:var(--ink); font-size:15px; }

    .back-link {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      text-decoration: none;
      color: var(--brand-dark);
      background: #f3f6fc;
      border: 1px solid var(--line);
      transition: .18s ease;
      flex: none;
    }

    .back-link:hover { transform: translateX(-2px); background: #fff; }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--brand);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 23px;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions { display: flex; gap: 10px; flex: none; }

    .grading-mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #f3f6fc;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    .grading-mode-button {
      min-height: 30px;
      padding: 0 13px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: .18s ease;
    }

    .grading-mode-button:hover { color: var(--brand-dark); }
    .grading-mode-button.active {
      color: #fff;
      background: var(--brand-dark);
      box-shadow: 0 5px 12px rgba(48,69,126,.18);
    }

    .grading-mode-button:focus-visible {
      outline: 3px solid rgba(79,102,216,.25);
      outline-offset: 2px;
    }

    .button {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: .18s ease;
      box-shadow: 0 4px 12px rgba(45,64,104,.04);
    }

    .button:hover { transform: translateY(-1px); border-color: #c8d2e7; box-shadow: 0 7px 18px rgba(45,64,104,.08); }
    .button:focus-visible, .question-item:focus-visible, .answer-paper:focus-visible, .density-button:focus-visible { outline: 3px solid rgba(79,102,216,.25); outline-offset: 2px; }
    .button.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #26395f 0%, #5365b7 100%);
      box-shadow: 0 12px 24px rgba(38, 57, 95, .22);
    }
    .button.primary:hover {
      background: linear-gradient(135deg, #223555 0%, #4b5fab 100%);
      box-shadow: 0 15px 28px rgba(38, 57, 95, .26);
    }
    .button.primary:disabled {
      opacity: .78;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    .button.ghost { color: var(--brand-dark); background: rgba(255,255,255,.72); }
    .button.is-disabled {
      color: #9aa6bd;
      background: rgba(255,255,255,.56);
      cursor: not-allowed;
      pointer-events: none;
      opacity: .72;
      box-shadow: none;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 190px 300px minmax(560px, 1fr);
    }

    .workspace[hidden] { display: none; }

    .rail, .assistant, .answer-zone { min-height: 0; }

    .rail {
      display: grid;
      grid-template-rows: minmax(0,1fr) auto;
      border-right: 1px solid var(--line);
      background: rgba(247, 249, 253, .95);
    }

    .panel-heading { padding: 20px 18px 12px; }
    .panel-kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .panel-heading h2 { margin: 5px 0 0; font-size: 17px; }

    .question-list {
      overflow: auto;
      padding: 20px 12px 18px;
      scrollbar-width: thin;
    }

    .question-item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      margin: 4px 0;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: .18s ease;
    }

    .question-item:hover { background: #fff; border-color: var(--line); }
    .question-item.active { background: var(--brand-soft); border-color: #cdd6ff; box-shadow: inset 3px 0 0 var(--brand); }

    .q-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: white;
      border: 1px solid var(--line);
      font-weight: 800;
      color: var(--brand-dark);
    }

    .active .q-number { color: white; background: var(--brand); border-color: var(--brand); }
    .q-meta { min-width: 0; }
    .q-title { display: block; font-size: 13px; font-weight: 850; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-state { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 10px; color: var(--muted); }
    .q-state::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .q-state.pending { color: var(--amber); font-weight: 700; }
    .q-state.pending::before { background: var(--amber); }
    .q-rate { font-size: 12px; font-weight: 800; color: var(--brand-dark); }
    .q-rate.is-high { color: var(--green); }
    .q-rate.is-mid { color: var(--amber); }
    .q-rate.is-low { color: var(--red); }
    .q-rate.is-score { color: var(--brand-dark); }

    .rail-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.8);
    }

    .rail-footer .button { width: 100%; min-height: 38px; padding-inline: 10px; font-size: 13px; }

    .assistant {
      overflow: auto;
      padding: 20px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.58);
      scrollbar-width: thin;
    }

    .metric-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 0;
      background: linear-gradient(145deg, #fff, #f6f8ff);
    }

    .metric-value {
      color: var(--brand-dark);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .metric-card.is-hidden { display: none; }

    .assist-card {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 22px rgba(45,64,104,.04);
    }

    .assist-card.answer-card { background: #fff; }
    .assist-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .answer-value { margin-top: 9px; font-family: "Songti SC", "STSong", serif; font-size: 17px; line-height: 1.7; color: var(--ink); }
    .basis-card {
      padding: 16px 16px 18px;
      border-color: #dce4ff;
      border-radius: 18px;
      background: linear-gradient(145deg, #f3f5ff, #f9fbff);
      box-shadow: 0 16px 38px rgba(54, 76, 146, .08);
    }
    .basis-card__head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }
    .basis-card__icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 12px;
      color: var(--brand);
      background: #e9eeff;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .basis-card .assist-label {
      color: var(--brand);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
    }
    .basis-list {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 7px;
      color: #546079;
      font-size: 12px;
      line-height: 1.58;
    }
    .basis-list li { padding-left: 3px; }
    .basis-list li::marker { color: #53607a; font-size: .9em; }
    .basis-list li.is-primary {
      color: #263454;
      font-weight: 900;
    }

    details.assist-card { padding: 0; overflow: hidden; }
    details.assist-card summary { list-style: none; padding: 15px 16px; cursor: pointer; font-size: 13px; font-weight: 750; display: flex; align-items: center; justify-content: space-between; }
    details.assist-card summary::-webkit-details-marker { display: none; }
    details.assist-card summary::after { content: "↓"; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--gray-soft); color: var(--muted); font-size: 15px; }
    details.assist-card[open] summary::after { content: "↑"; }
    .explanation { padding: 0 16px 16px; color: #53617a; font-size: 17px; line-height: 1.7; }
    .answer-details { margin-top: 14px; border-top: 1px solid var(--line); }
    .answer-details summary { list-style: none; padding: 13px 0 0; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; display: flex; align-items: center; justify-content: space-between; }
    .answer-details summary::-webkit-details-marker { display: none; }
    .answer-details summary::after { content: "↓"; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--gray-soft); color: var(--muted); font-size: 15px; }
    .answer-details[open] summary::after { content: "↑"; }
    .answer-details .explanation {
      padding: 12px 0 0;
      font-size: 12px;
      line-height: 1.65;
    }

    .answer-zone {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      background: rgba(247,249,253,.72);
    }

    .answer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 9px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.74);
    }

    .density-control { display: flex; align-items: center; gap: 8px; flex: none; }
    .density-label { color: var(--muted); font-size: 11px; }
    .density-switch { display: flex; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: white; }
    .density-button { width: 28px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 800; }
    .density-button.active { color: white; background: var(--brand-dark); }

    .groups-scroll {
      overflow: auto;
      padding: 20px 62px 20px 20px;
      scrollbar-width: thin;
    }

    .result-rail {
      position: absolute;
      z-index: 12;
      top: 68px;
      right: 12px;
      bottom: 70px;
      width: 38px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: flex-end;
      padding: 10px 0;
      pointer-events: none;
    }

    .result-rail__button {
      position: relative;
      z-index: 1;
      width: 38px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 7px 0 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
    }

    .result-rail__tick {
      width: 12px;
      height: 2px;
      border-radius: 999px;
      background: #b7c0ce;
      transition: width .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .result-rail__button:hover .result-rail__tick,
    .result-rail__button:focus-visible .result-rail__tick,
    .result-rail__button.is-active .result-rail__tick {
      width: 27px;
      background: #263244;
      box-shadow: 0 0 0 1px rgba(38,50,68,.04);
    }

    .result-rail__button:focus-visible { outline: none; }

    .result-rail__tooltip {
      position: absolute;
      right: 42px;
      top: 50%;
      transform: translate(4px,-50%);
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.96);
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(45,64,104,.1);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .result-rail__button:hover .result-rail__tooltip,
    .result-rail__button:focus-visible .result-rail__tooltip {
      opacity: 1;
      transform: translate(0,-50%);
    }

    .group-section {
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.86);
      box-shadow: 0 10px 26px rgba(45,64,104,.045);
      overflow: hidden;
    }

    .group-section[data-result="correct"] { border-left: 4px solid var(--green); }
    .group-section[data-result="partial"] { border-left: 4px solid var(--amber); }
    .group-section[data-result="wrong"] { border-left: 4px solid var(--red); }
    .group-section[data-result="ungraded"] { border-left: 4px solid var(--gray); }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
    }

    .group-heading { display: flex; align-items: center; gap: 9px; }
    .group-heading h3 { margin: 0; font-size: 14px; }
    .group-count { color: var(--muted); font-size: 11px; }
    .shape-group-head {
      display: block;
      padding: 15px 15px 13px;
      border-bottom: 1px solid var(--line);
    }

    .shape-group-head__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .shape-group-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .shape-group-title h3 { margin: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shape-group-state {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .shape-group-count {
      flex: none;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f6ff;
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
    }

    .group-section[data-result="correct"] .shape-group-count { color: var(--green); background: var(--green-soft); }
    .group-section[data-result="partial"] .shape-group-count { color: var(--amber); background: var(--amber-soft); }
    .group-section[data-result="wrong"] .shape-group-count { color: var(--red); background: var(--red-soft); }
    .group-section[data-result="ungraded"] .shape-group-count { color: var(--gray); background: var(--gray-soft); }

    .group-result-tools {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #dfe6f5;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .group-result-button {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: .16s ease;
    }

    .group-result-button:hover {
      transform: translateY(-1px);
      background: #f4f7ff;
    }

    .group-result-button[data-current-result="correct"] {
      border-color: #bfe8d4;
      background: var(--green-soft);
    }

    .group-result-button[data-current-result="partial"] {
      border-color: #f0d6a6;
      background: var(--amber-soft);
    }

    .group-result-button[data-current-result="wrong"] {
      border-color: transparent;
      background: transparent;
    }

    .group-result-button[data-current-result="ungraded"] {
      border-color: #d4dae8;
      background: var(--gray-soft);
    }

    .group-result-button .mark-icon {
      width: 18px;
      height: 18px;
      font-size: 22px;
      line-height: 18px;
    }

    .shape-group-meta {
      display: grid;
      gap: 6px;
      margin: 10px 0 0 17px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .shape-group-meta span { display: block; }

    .shape-group-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0 17px;
    }

    .group-action {
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.86);
      color: #465578;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: .16s ease;
    }

    .group-action:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(45,64,104,.08); }
    .group-action[data-batch-result="correct"] { color: var(--green); border-color: #cbe9dc; background: var(--green-soft); }
    .group-action[data-batch-result="partial"] { color: var(--amber); border-color: #f0d6a6; background: var(--amber-soft); }
    .group-action[data-batch-result="wrong"] { color: var(--red); border-color: #f0c4c9; background: var(--red-soft); }
    .group-action[data-confirm-group] { color: #fff; border-color: transparent; background: linear-gradient(135deg, #26395f 0%, #5365b7 100%); }
    .group-action.is-done { color: var(--green); border-color: #cbe9dc; background: var(--green-soft); }

    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.correct { background: var(--green); }
    .dot.partial { background: var(--amber); }
    .dot.wrong { background: var(--red); }
    .dot.ungraded { background: var(--gray); }

    .student-grid {
      --columns: 3;
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0,1fr));
      gap: 12px;
      padding: 14px;
    }

    .student-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
      transition: .18s ease;
    }

    .student-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(45,64,104,.10); }
    .student-card[data-result="correct"] { border-color: #cbe9dc; }
    .student-card[data-result="partial"] { border-color: #f0d6a6; }
    .student-card[data-result="wrong"] { border-color: #f0c4c9; }

    .student-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 11px 8px; }
    .student-name { font-size: 12px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .answer-paper {
      width: calc(100% - 20px);
      min-height: 106px;
      margin: 0 10px 10px;
      padding: 20px 14px 13px;
      border: 1px solid #eadfce;
      border-radius: 10px;
      background:
        repeating-linear-gradient(to bottom, transparent 0 25px, rgba(99,113,142,.10) 25px 26px),
        linear-gradient(90deg, transparent 0 22px, rgba(221,91,91,.12) 22px 23px, transparent 23px),
        #fffdf8;
      cursor: pointer;
      text-align: left;
      color: #28344f;
      transition: .18s ease;
      position: relative;
    }

    .answer-paper::after {
      content: "点击切换结果";
      position: absolute;
      right: 8px;
      bottom: 6px;
      padding: 3px 6px;
      border-radius: 6px;
      color: transparent;
      background: transparent;
      font-family: "PingFang SC", sans-serif;
      font-size: 9px;
      transition: .18s ease;
    }

    .student-card:hover .answer-paper::after { color: #60709a; background: rgba(238,242,252,.94); }
    .answer-paper:hover { border-color: #c8d2e7; }
    .handwriting { font-family: "Kaiti SC", "STKaiti", serif; font-size: 16px; line-height: 1.7; white-space: pre-line; }

    .paper-trace-mark {
      position: absolute;
      right: 14px;
      top: 12px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: rotate(-8deg);
      background: rgba(255,255,255,.72);
    }

    .paper-trace-mark.correct { color: var(--green); }
    .paper-trace-mark.partial { color: var(--amber); }
    .paper-trace-mark.wrong { color: var(--red); }
    .paper-trace-mark.ungraded { display: none; }

    .mark-icon {
      position: relative;
      display: inline-block;
      width: 22px;
      height: 22px;
      font-family: "Kaiti SC", "STKaiti", serif;
      font-size: 26px;
      line-height: 22px;
      font-weight: 900;
    }

    .mark-icon.correct {
      width: 34px;
      height: 34px;
      background: url("/Users/dengjingli_1/Downloads/正确 (1).png") center / contain no-repeat;
      font-size: 0;
      line-height: 1;
    }
    .mark-icon.correct::before { content: ""; }
    .mark-icon.wrong::before { content: "×"; }
    .mark-icon.partial::before { content: "✓"; }
    .mark-icon.partial {
      width: 34px;
      height: 34px;
      background: url("/Users/dengjingli_1/Downloads/半对 (1).png") center / contain no-repeat;
      font-size: 0;
      line-height: 1;
    }
    .mark-icon.partial::before { content: ""; }

    .group-result-button .mark-icon,
    .group-result-button .mark-icon.correct,
    .group-result-button .mark-icon.partial {
      width: 20px;
      height: 20px;
      font-size: 22px;
      line-height: 20px;
    }

    .group-result-button .mark-icon.wrong::before {
      color: var(--red);
      font-size: 24px;
      line-height: 20px;
    }

    .group-result-button .mark-icon.ungraded::before {
      content: "—";
      color: #8994aa;
      font-size: 18px;
      line-height: 20px;
    }

    .score-mark {
      position: absolute;
      right: 12px;
      top: 10px;
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--brand);
      background: #edf1ff;
      font-family: "PingFang SC", sans-serif;
      font-size: 12px;
      font-weight: 900;
    }

    .score-input {
      width: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-weight: inherit;
      text-align: right;
      -moz-appearance: textfield;
    }

    .score-input::-webkit-inner-spin-button,
    .score-input::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
    .score-input:focus { border-bottom-color: currentColor; }
    .score-input::placeholder { color: #8590ae; opacity: 1; }

    .question-confirm-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      padding: 9px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
    }

    .question-confirm-bar .button {
      min-width: 178px;
      min-height: 38px;
      box-shadow: 0 12px 26px rgba(79,102,216,.20);
    }

    .empty-group { padding: 20px; color: var(--muted); font-size: 12px; text-align: center; }

    .toast {
      position: fixed;
      left: 50%;
      top: 88px;
      z-index: 50;
      max-width: calc(100vw - 48px);
      padding: 12px 16px;
      border-radius: 12px;
      color: white;
      background: #243351;
      box-shadow: 0 12px 30px rgba(20,31,56,.24);
      font-size: 12px;
      transform: translateX(-50%) translateY(-12px);
      opacity: 0;
      pointer-events: none;
      transition: .24s ease;
    }

    .toast.show { transform: translateX(-50%); opacity: 1; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(19, 29, 53, .45);
      backdrop-filter: blur(8px);
    }

    .modal-backdrop.open { display: grid; }
    .modal {
      width: min(820px, 94vw);
      max-height: 88vh;
      overflow: auto;
      border-radius: 22px;
      background: #f9fbff;
      box-shadow: 0 26px 80px rgba(16,27,51,.30);
      animation: modal-in .22s ease both;
    }

    @keyframes modal-in { from { transform: translateY(12px) scale(.98); opacity: 0; } }
    .modal-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-family: "Songti SC", serif; font-size: 22px; }
    .modal-close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: white; cursor: pointer; }
    .modal-body { padding: 22px; }

    .preview-paper {
      min-height: 520px;
      padding: 30px 42px;
      border: 1px solid #eadfce;
      border-radius: 14px;
      background:
        repeating-linear-gradient(to bottom, transparent 0 31px, rgba(91,105,133,.09) 31px 32px),
        #fffdf8;
      box-shadow: 0 14px 35px rgba(60,67,84,.09);
    }

    .preview-paper h3 { margin: 0 0 26px; text-align: center; font-family: "Songti SC", serif; font-size: 24px; }
    .preview-question { margin: 25px 0; font-family: "Songti SC", serif; line-height: 1.8; }
    .teacher-mark { margin: 8px 0 0 52px; color: #db4d59; font-family: "Kaiti SC", "STKaiti", serif; font-size: 20px; transform: rotate(-1deg); }

    .student-workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 190px minmax(620px,1fr) 360px;
      background: #eef2f8;
    }

    .student-workspace[hidden] { display: none; }

    .student-roster {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      border-right: 1px solid var(--line);
      background: rgba(247,249,253,.96);
    }

    .student-roster__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 18px 14px 10px;
    }

    .student-roster__head strong { font-size: 14px; }
    .student-roster__head span { color: var(--muted); font-size: 10px; }

    .student-list {
      overflow: auto;
      padding: 0 10px 16px;
      scrollbar-width: thin;
    }

    .student-list-item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      padding: 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .student-list-item:hover { border-color: var(--line); background: #fff; }
    .student-list-item.active {
      border-color: #cdd6ff;
      background: var(--brand-soft);
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .student-list-item strong { display: block; font-size: 13px; }
    .student-list-item small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .student-list-item small.is-confirmed { color: var(--green); font-weight: 800; }
    .student-list-item b { color: var(--brand-dark); font-size: 12px; }

    .student-roster__footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.94);
    }

    .student-roster__footer .button {
      width: 100%;
      min-height: 42px;
      border-radius: 999px;
      background: linear-gradient(135deg,#73c9f3,#3f8ef5);
      box-shadow: 0 10px 22px rgba(63,142,245,.22);
    }

    .student-paper-stage {
      min-width: 0;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 16%, rgba(79,102,216,.08), transparent 26%),
        linear-gradient(135deg, rgba(255,255,255,.4), transparent 46%),
        #e7edf6;
      scrollbar-width: thin;
    }

    .student-paper {
      width: min(720px,100%);
      min-height: 980px;
      position: relative;
      padding: 34px 42px 54px;
      border: 1px solid #e6ddce;
      border-radius: 10px;
      background:
        linear-gradient(90deg, transparent 0 62px, rgba(216,83,83,.1) 62px 63px, transparent 63px),
        repeating-linear-gradient(to bottom, transparent 0 39px, rgba(75,90,120,.05) 39px 40px),
        #fffdfa;
      box-shadow: 0 22px 55px rgba(35,45,78,.16);
      font-family: "Songti SC", "STSong", serif;
    }

    .student-paper::before {
      content: "学生作业原卷";
      position: absolute;
      top: 14px;
      right: 18px;
      color: #a4a099;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
      letter-spacing: .14em;
    }

    .student-paper-head {
      margin-bottom: 24px;
      padding: 0 0 18px 30px;
      border-bottom: 1px solid #d8d7d1;
    }

    .student-paper-head__meta { display: flex; justify-content: space-between; gap: 20px; color: #5f6470; font-size: 12px; }
    .student-paper-head h2 { margin: 18px 0 0; text-align: center; font-size: 19px; letter-spacing: .08em; }

    .student-paper-question {
      position: relative;
      margin: 0 0 26px;
      padding: 0 54px 18px 30px;
      border-bottom: 1px dashed rgba(120,130,150,.24);
    }

    .student-paper-question strong { font-size: 15px; }
    .student-paper-question p { margin: 7px 0; color: #696e78; font-size: 12px; }
    .student-paper-answer { color: #30343d; font-family: "Kaiti SC", "STKaiti", serif; font-size: 19px; line-height: 1.65; }
    .student-paper-answer.is-empty { color: #aaa69d; font-family: inherit; font-size: 13px; }

    .student-paper-mark {
      position: absolute;
      top: 1px;
      right: 2px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      transform: rotate(-7deg);
    }

    .student-paper-mark .mark-icon,
    .student-paper-mark .mark-icon.correct,
    .student-paper-mark .mark-icon.partial,
    .student-paper-mark .mark-icon.wrong { width: 36px; height: 36px; }

    .student-paper-score {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 52px;
      padding: 5px 7px;
      border: 1px solid rgba(219,77,89,.34);
      border-radius: 999px;
      color: #cf3f4c;
      background: rgba(255,255,255,.82);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      transform: rotate(-4deg);
    }

    .student-tool-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      border-left: 1px solid var(--line);
      background: rgba(255,255,255,.97);
    }

    .student-tool-head {
      display: flex;
      align-items: center;
      min-height: 68px;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .student-tool-page { color: #20293d; font-size: 14px; }

    .student-question-tools {
      overflow: auto;
      padding: 0 26px 24px;
      scrollbar-width: thin;
    }

    .student-question-tool {
      padding: 23px 0 21px;
      border-bottom: 1px solid var(--line);
    }

    .student-question-tool__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .student-question-tool__head > strong { color: #1e2738; font-size: 13px; }
    .student-tool-answer { margin: 15px 0 0; color: #252d3d; font-size: 13px; line-height: 1.6; }
    .student-tool-answer.is-empty { color: #a1aabc; }

    .student-judge-group { display: flex; align-items: center; gap: 4px; }

    .student-judge-button {
      min-width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      color: #253044;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      transition: .16s ease;
    }

    .student-judge-button:hover { background: #f3f6fb; }
    .student-judge-button.is-active[data-student-result="correct"],
    .student-judge-button.is-active[data-student-bulk-result="correct"],
    .student-judge-button.is-active[data-student-part-result="correct"] {
      color: #1dbd6d;
      box-shadow: inset 0 0 0 2px #35c97b;
      background: #edfff5;
    }

    .student-judge-button.is-active[data-student-result="wrong"],
    .student-judge-button.is-active[data-student-bulk-result="wrong"],
    .student-judge-button.is-active[data-student-part-result="wrong"] {
      color: #ff565a;
      box-shadow: inset 0 0 0 2px #ff6468;
      background: #fff4f4;
    }

    .student-judge-button.with-label { width: auto; padding-inline: 7px 9px; border-radius: 8px; font-size: 12px; }
    .student-judge-button.with-label i { font-style: normal; font-size: 20px; line-height: 1; }
    .student-tool-menu { width: 28px; height: 28px; margin-left: 6px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-size: 17px; letter-spacing: .08em; }
    .student-tool-menu:hover { background: #f3f6fb; }

    .student-part-list { display: grid; gap: 5px; margin-top: 12px; padding-left: 48px; }
    .student-part-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }
    .student-part-row > span { color: #31394a; font-size: 13px; }
    .student-part-row .student-judge-button { height: 30px; min-width: 30px; }

    .student-result-options {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
      margin-top: 10px;
    }

    .student-result-option {
      min-height: 30px;
      padding: 0 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      transition: .16s ease;
    }

    .student-result-option:hover { transform: translateY(-1px); border-color: #c6d0e4; }
    .student-result-option.active { color: var(--brand-dark); border-color: #aebdf3; background: var(--brand-soft); }
    .student-result-option.active[data-student-result="correct"] { color: var(--green); border-color: #a9ddc7; background: var(--green-soft); }
    .student-result-option.active[data-student-result="partial"] { color: var(--amber); border-color: #efd39e; background: var(--amber-soft); }
    .student-result-option.active[data-student-result="wrong"] { color: var(--red); border-color: #efbbc1; background: var(--red-soft); }

    .student-score-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .student-score-row input { width: 58px; height: 32px; padding: 0 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }

    .student-tool-footer { display: flex; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: rgba(255,255,255,.98); }
    .student-tool-footer .button { min-width: 126px; border-radius: 999px; background: #2585f4; box-shadow: 0 9px 20px rgba(37,133,244,.2); }

    @media (max-width: 1180px) {
      body { overflow: auto; }
      .app-shell { height: auto; min-height: 100vh; }
      .app { height: auto; min-height: 100vh; }
      .workspace { grid-template-columns: 170px 270px minmax(480px,1fr); min-height: 760px; }
      .groups-scroll { padding-right: 52px; }
      .result-rail { right: 8px; width: 34px; }
      .result-rail__button { width: 34px; }
      .student-workspace { min-width: 1050px; }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app-shell { padding: 0; }
      .app { border-radius: 0; grid-template-rows: auto auto; }
      .topbar { padding: 14px; flex-wrap: wrap; }
      .workspace { display: block; min-height: 0; }
      .rail { display: block; border-right: 0; border-bottom: 1px solid var(--line); }
      .panel-heading { padding-bottom: 8px; }
      .question-list { display: flex; overflow-x: auto; padding: 4px 12px 12px; }
      .question-item { min-width: 150px; }
      .rail-footer { position: sticky; bottom: 0; z-index: 10; }
      .assistant { border-right: 0; border-bottom: 1px solid var(--line); }
      .answer-zone { min-height: 700px; }
    }

    @media (max-width: 620px) {
      h1 { font-size: 18px; }
      .top-actions { width: 100%; }
      .top-actions .button { flex: 1; padding: 0 9px; }
      .grading-mode-switch { width: 100%; }
      .grading-mode-button { flex: 1; }
      .answer-toolbar { align-items: flex-start; }
      .density-label { display: none; }
      .student-grid { --columns: 2 !important; }
      .groups-scroll { padding: 12px 46px 12px 12px; }
    }
    /* 批改符号统一使用仓库内资源，确保 GitHub 页面可正常加载 */
    .mark-icon.correct,
    .grade-symbol.correct {
      background-image: url("assets/correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }

    .mark-icon.partial,
    .mark-icon.half,
    .grade-symbol.partial,
    .grade-symbol.half {
      background-image: url("assets/half-correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }

    .mark-icon.incorrect,
    .mark-icon.wrong,
    .grade-symbol.incorrect,
    .grade-symbol.wrong {
      background-image: url("assets/wrong.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }
  </style>
  <style id="project-grading-symbol-assets">
    .mark-icon.correct,
    .grade-symbol.correct {
      background-image: url("assets/correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
      font-size: 0 !important;
    }

    .mark-icon.partial,
    .mark-icon.half,
    .grade-symbol.partial,
    .grade-symbol.half {
      background-image: url("assets/half-correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
      font-size: 0 !important;
    }

    .mark-icon.incorrect,
    .mark-icon.wrong,
    .grade-symbol.incorrect,
    .grade-symbol.wrong {
      background-image: url("assets/wrong.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;

<body>
  <div class="app-shell">
    <main class="app">
      <header class="topbar">
        <div class="title-lockup">
        <a class="back-link" href="./index.html?preserveCollection=1" aria-label="返回批改首页">←</a>
          <div class="grading-task-lockup">
            <strong id="gradingTaskTitle">二次函数单元作业</strong>
          </div>
        </div>
        <div class="top-actions">
          <div class="grading-mode-switch" role="tablist" aria-label="批改方式">
            <button class="grading-mode-button active" type="button" role="tab" data-grading-view="question" aria-selected="true">按题批改</button>
            <button class="grading-mode-button" type="button" role="tab" data-grading-view="student" aria-selected="false">按学生批改</button>
          </div>
        </div>
      </header>

      <section class="workspace" id="questionWorkspace">
        <aside class="rail" aria-label="题号导航">
          <nav class="question-list" id="questionList"></nav>
          <div class="rail-footer">
            <button class="button primary" type="button" id="confirmAll">一键确认批改</button>
          </div>
        </aside>

        <aside class="assistant" aria-label="题目批改辅助信息">
          <section class="assist-card metric-card is-hidden">
            <div class="assist-label" id="metricLabel">正确率</div>
            <div class="metric-value" id="accuracyValue"></div>
          </section>

          <section class="assist-card answer-card">
            <div class="assist-label">答案</div>
            <div class="answer-value" id="answerValue"></div>
            <details class="answer-details" id="explanationDetails">
              <summary>解析</summary>
              <div class="explanation" id="explanationText"></div>
            </details>
          </section>

          <section class="assist-card basis-card">
            <div class="basis-card__head">
              <span class="basis-card__icon" aria-hidden="true">✦</span>
              <div class="assist-label">AI 批改依据</div>
            </div>
            <ul class="basis-list" id="basisList"></ul>
          </section>
        </aside>

        <section class="answer-zone" aria-label="题目分组批改">
          <div class="answer-toolbar">
            <div></div>
            <div class="density-control" aria-label="每行卡片数量">
              <span class="density-label">每行</span>
              <div class="density-switch">
                <button class="density-button" type="button" data-columns="2">2</button>
                <button class="density-button active" type="button" data-columns="3">3</button>
                <button class="density-button" type="button" data-columns="4">4</button>
              </div>
            </div>
          </div>
          <div class="groups-scroll" id="groupsScroll"></div>
          <nav class="result-rail" id="resultRail" aria-label="批改结果快速定位">
