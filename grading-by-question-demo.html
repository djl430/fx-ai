<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>飞象智批 · 按题批改 Demo</title>
  <style>
    :root {
      --ink: #172341;
      --muted: #74809a;
      --line: #dfe6f2;
      --panel: rgba(255, 255, 255, 0.92);
      --canvas: #eef3fa;
      --brand: #4f66d8;
      --brand-dark: #30457e;
      --brand-soft: #edf1ff;
      --green: #23996b;
      --green-soft: #edf9f4;
      --amber: #d38a24;
      --amber-soft: #fff7e8;
      --red: #d95662;
      --red-soft: #fff1f2;
      --gray: #8390a9;
      --gray-soft: #f2f5f9;
      --shadow: 0 18px 50px rgba(39, 57, 99, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 4%, rgba(99, 121, 229, 0.18), transparent 27%),
        radial-gradient(circle at 16% 96%, rgba(72, 157, 142, 0.10), transparent 28%),
        var(--canvas);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .app-shell {
      height: 100vh;
      padding: 18px;
    }

    .app {
      height: 100%;
      min-height: 720px;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 26px;
      background: rgba(249, 251, 255, 0.82);
      box-shadow: 0 24px 70px rgba(38, 54, 92, 0.13);
      overflow: hidden;
      backdrop-filter: blur(24px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.78);
    }

    .title-lockup { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .grading-task-lockup { min-width: 0; }
    .grading-task-lockup strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .grading-task-lockup strong { max-width:460px; color:var(--ink); font-size:15px; }

    .back-link {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      text-decoration: none;
      color: var(--brand-dark);
      background: #f3f6fc;
      border: 1px solid var(--line);
      transition: .18s ease;
      flex: none;
    }

    .back-link:hover { transform: translateX(-2px); background: #fff; }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--brand);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 23px;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grading-mode-dock {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.58);
    }

    .grading-mode-dropdown {
      position: relative;
      display: inline-block;
      min-width: 126px;
    }

    .grading-mode-trigger {
      width: 100%;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 13px 0 15px;
      border: 0;
      border-radius: 18px;
      color: #202b40;
      background: #f0f1f3;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background .18s ease, box-shadow .18s ease;
    }

    .grading-mode-trigger:hover { background: #e8ebef; }
    .grading-mode-trigger:focus-visible {
      outline: 3px solid rgba(79,102,216,.22);
      outline-offset: 2px;
    }

    .grading-mode-trigger__arrow {
      width: 7px;
      height: 7px;
      flex: none;
      border-top: 2px solid #5473d8;
      border-left: 2px solid #5473d8;
      transform: translateY(-2px) rotate(225deg);
      transition: transform .18s ease;
    }

    .grading-mode-dropdown.is-open .grading-mode-trigger__arrow {
      transform: translateY(2px) rotate(45deg);
    }

    .grading-mode-menu {
      position: absolute;
      z-index: 40;
      top: calc(100% + 5px);
      left: 0;
      width: 100%;
      padding: 5px;
      border: 1px solid #e4e8f0;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(31,44,72,.14);
    }

    .grading-mode-menu[hidden] { display: none; }

    .grading-mode-option {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 0;
      border-radius: 5px;
      color: #202b40;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .grading-mode-option:hover { background: #f5f7fb; }
    .grading-mode-option.is-selected { color: #26385e; background: #eef5ff; }
    .grading-mode-option:focus-visible { outline: 2px solid rgba(79,102,216,.3); outline-offset: -2px; }

    .button {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: .18s ease;
      box-shadow: 0 4px 12px rgba(45,64,104,.04);
    }

    .button:hover { transform: translateY(-1px); border-color: #c8d2e7; box-shadow: 0 7px 18px rgba(45,64,104,.08); }
    .button:focus-visible, .question-item:focus-visible, .answer-paper:focus-visible, .density-button:focus-visible { outline: 3px solid rgba(79,102,216,.25); outline-offset: 2px; }
    .button.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #26395f 0%, #5365b7 100%);
      box-shadow: 0 12px 24px rgba(38, 57, 95, .22);
    }
    .button.primary:hover {
      background: linear-gradient(135deg, #223555 0%, #4b5fab 100%);
      box-shadow: 0 15px 28px rgba(38, 57, 95, .26);
    }
    .button.primary:disabled {
      opacity: .78;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    .button.ghost { color: var(--brand-dark); background: rgba(255,255,255,.72); }
    .button.is-disabled {
      color: #9aa6bd;
      background: rgba(255,255,255,.56);
      cursor: not-allowed;
      pointer-events: none;
      opacity: .72;
      box-shadow: none;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 190px 300px minmax(560px, 1fr);
    }

    .workspace[hidden] { display: none; }

    .rail, .assistant, .answer-zone { min-height: 0; }

    .rail {
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      border-right: 1px solid var(--line);
      background: rgba(247, 249, 253, .95);
    }

    .panel-heading { padding: 20px 18px 12px; }
    .panel-kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .panel-heading h2 { margin: 5px 0 0; font-size: 17px; }

    .question-list {
      overflow: auto;
      padding: 20px 12px 18px;
      scrollbar-width: thin;
    }

    .question-item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      margin: 4px 0;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: .18s ease;
    }

    .question-item:hover { background: #fff; border-color: var(--line); }
    .question-item.active { background: var(--brand-soft); border-color: #cdd6ff; box-shadow: inset 3px 0 0 var(--brand); }

    .q-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: white;
      border: 1px solid var(--line);
      font-weight: 800;
      color: var(--brand-dark);
    }

    .active .q-number { color: white; background: var(--brand); border-color: var(--brand); }
    .q-meta { min-width: 0; }
    .q-title { display: block; font-size: 13px; font-weight: 850; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-state { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 10px; color: var(--muted); }
    .q-state::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .q-state.pending { color: var(--amber); font-weight: 700; }
    .q-state.pending::before { background: var(--amber); }
    .q-rate { font-size: 12px; font-weight: 800; color: var(--brand-dark); }
    .q-rate.is-high { color: var(--green); }
    .q-rate.is-mid { color: var(--amber); }
    .q-rate.is-low { color: var(--red); }
    .q-rate.is-score { color: var(--brand-dark); }

    .rail-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.8);
    }

    .rail-footer .button { width: 100%; min-height: 38px; padding-inline: 10px; font-size: 13px; }

    .assistant {
      overflow: auto;
      padding: 20px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.58);
      scrollbar-width: thin;
    }

    .metric-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 0;
      background: linear-gradient(145deg, #fff, #f6f8ff);
    }

    .metric-value {
      color: var(--brand-dark);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .metric-card.is-hidden { display: none; }

    .assist-card {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 8px 22px rgba(45,64,104,.04);
    }

    .assist-card.answer-card { background: #fff; }
    .answer-card__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .assist-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .answer-value { margin-top: 9px; font-family: "Songti SC", "STSong", serif; font-size: 17px; line-height: 1.7; color: var(--ink); }

    .question-snapshot-card {
      margin-top: 0;
      padding: 12px;
      background: rgba(255,255,255,.95);
    }

    .question-snapshot-card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 9px;
    }

    .question-snapshot-button {
      position: relative;
      width: 100%;
      display: block;
      padding: 0;
      overflow: hidden;
      border: 1px solid #e3d8c8;
      border-radius: 11px;
      background: #fffdf8;
      cursor: zoom-in;
      box-shadow: 0 6px 16px rgba(51,61,83,.08);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .question-snapshot-button:hover {
      border-color: #aebce3;
      box-shadow: 0 10px 24px rgba(44,64,112,.14);
      transform: translateY(-1px);
    }

    .question-snapshot-button:focus-visible {
      outline: 3px solid rgba(79,102,216,.25);
      outline-offset: 2px;
    }

    .question-snapshot-thumbnail {
      width: 100%;
      aspect-ratio: 38 / 15;
      display: block;
      object-fit: contain;
      background: #fffdf8;
    }

    .basis-card {
      padding: 16px 16px 18px;
      border-color: #dce4ff;
      border-radius: 18px;
      background: linear-gradient(145deg, #f3f5ff, #f9fbff);
      box-shadow: 0 16px 38px rgba(54, 76, 146, .08);
    }
    .basis-card[hidden] { display: none; }
    .basis-card__head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }
    .basis-card__icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 12px;
      color: var(--brand);
      background: #e9eeff;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .basis-card .assist-label {
      color: var(--brand);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
    }
    .basis-list {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 7px;
      color: #546079;
      font-size: 12px;
      line-height: 1.58;
    }
    .basis-list li { padding-left: 3px; }
    .basis-list li::marker { color: #53607a; font-size: .9em; }
    .basis-list li.is-primary {
      color: #263454;
      font-weight: 900;
    }
    .answer-edit-button { margin-left: auto; padding: 4px 8px; border: 1px solid #cfd9f3; border-radius: 7px; color: #4b6195; background: #f8faff; font-size: 10px; font-weight: 800; cursor: pointer; }
    .answer-edit-button:hover { border-color: #aebce3; background: #f1f5ff; }
    .answer-edit-button:disabled { opacity: .48; cursor: wait; }
    .grading-rule-editor { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #dce4f6; }
    .grading-rule-editor[hidden] { display: none; }
    .grading-rule-editor label { color: #384868; font-size: 11px; font-weight: 850; }
    .grading-rule-editor input,
    .grading-rule-editor textarea { width: 100%; padding: 9px 10px; border: 1px solid #cfd9ed; border-radius: 9px; color: #33415d; background: #fff; font-size: 11px; line-height: 1.55; }
    .grading-rule-editor textarea { resize: vertical; }
    .grading-rule-field { display: grid; gap: 8px; }
    .grading-rule-field[hidden] { display: none; }
    .grading-rule-editor__actions { display: flex; justify-content: flex-end; gap: 7px; }
    .grading-rule-editor__actions button { min-height: 28px; padding: 0 9px; border: 1px solid #d4dced; border-radius: 7px; color: #53617d; background: #fff; font-size: 10px; font-weight: 800; cursor: pointer; }
    .grading-rule-editor__actions button[type="submit"] { color: #fff; border-color: #40588f; background: #40588f; }
    .question-regrade-status { margin-top: 11px; padding: 10px; border-radius: 10px; color: #425271; background: rgba(255,255,255,.68); font-size: 10px; line-height: 1.5; }
    .question-regrade-status[hidden] { display: none; }
    .question-regrade-progress { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: #e4e9f4; }
    .question-regrade-progress span { height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg,#6078d9,#38a583); transition: width .12s ease; }
    .answer-zone.is-regrading .answer-paper { pointer-events: none; opacity: .72; }

    details.assist-card { padding: 0; overflow: hidden; }
    details.assist-card summary { list-style: none; padding: 15px 16px; cursor: pointer; font-size: 13px; font-weight: 750; display: flex; align-items: center; justify-content: space-between; }
    details.assist-card summary::-webkit-details-marker { display: none; }
    details.assist-card summary::after { content: "↓"; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--gray-soft); color: var(--muted); font-size: 15px; }
    details.assist-card[open] summary::after { content: "↑"; }
    .explanation { padding: 0 16px 16px; color: #53617a; font-size: 17px; line-height: 1.7; }
    .answer-details { margin-top: 14px; border-top: 1px solid var(--line); }
    .answer-details summary { list-style: none; padding: 13px 0 0; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; display: flex; align-items: center; justify-content: space-between; }
    .answer-details summary::-webkit-details-marker { display: none; }
    .answer-details summary::after { content: "↓"; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--gray-soft); color: var(--muted); font-size: 15px; }
    .answer-details[open] summary::after { content: "↑"; }
    .answer-details .explanation {
      padding: 12px 0 0;
      font-size: 12px;
      line-height: 1.65;
    }

    .answer-zone {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      background: rgba(247,249,253,.72);
    }

    .answer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.74);
    }

    .result-navigation {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: 8px;
      margin-left: 18px;
    }

    .result-navigation__button {
      --result-color: var(--gray);
      position: relative;
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: color .18s ease, background-color .18s ease;
    }

    .result-navigation__button[data-result-target="correct"] { --result-color: var(--green); }
    .result-navigation__button[data-result-target="partial"] { --result-color: var(--amber); }
    .result-navigation__button[data-result-target="wrong"] { --result-color: var(--red); }
    .result-navigation__button[data-result-target="ungraded"] { --result-color: var(--gray); }

    .result-navigation__button:hover,
    .result-navigation__button:focus-visible,
    .result-navigation__button.is-active {
      color: var(--result-color);
      background: color-mix(in srgb, var(--result-color) 8%, transparent);
    }

    .result-navigation__button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--result-color) 20%, transparent);
      outline-offset: 1px;
    }

    .result-navigation__button.is-active::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: 1px;
      left: 18px;
      height: 2px;
      border-radius: 999px;
      background: var(--result-color);
    }

    .density-control { display: flex; align-items: center; gap: 8px; flex: none; }
    .density-label { color: var(--muted); font-size: 11px; }
    .density-switch { display: flex; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: white; }
    .density-button { width: 28px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 800; }
    .density-button.active { color: white; background: var(--brand-dark); }

    .groups-scroll {
      overflow: auto;
      padding: 20px;
      scrollbar-width: thin;
    }

    .group-section {
      position: relative;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.86);
      box-shadow: 0 10px 26px rgba(45,64,104,.045);
      overflow: visible;
    }

    .group-section:hover,
    .group-section:focus-within { z-index: 4; }

    .group-section[data-result="correct"] { border-left: 4px solid var(--green); }
    .group-section[data-result="partial"] { border-left: 4px solid var(--amber); }
    .group-section[data-result="wrong"] { border-left: 4px solid var(--red); }
    .group-section[data-result="ungraded"] { border-left: 4px solid var(--gray); }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
    }

    .group-heading { display: flex; align-items: center; gap: 9px; }
    .group-heading h3 { margin: 0; font-size: 14px; }
    .group-count { color: var(--muted); font-size: 11px; }
    .shape-group-head {
      display: block;
      padding: 15px 15px 13px;
      border-bottom: 1px solid var(--line);
    }

    .shape-group-head__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .shape-group-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .shape-group-title h3 { margin: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shape-group-state {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .shape-group-count {
      flex: none;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f6ff;
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
    }

    .group-section[data-result="correct"] .shape-group-count { color: var(--green); background: var(--green-soft); }
    .group-section[data-result="partial"] .shape-group-count { color: var(--amber); background: var(--amber-soft); }
    .group-section[data-result="wrong"] .shape-group-count { color: var(--red); background: var(--red-soft); }
    .group-section[data-result="ungraded"] .shape-group-count { color: var(--gray); background: var(--gray-soft); }

    .group-result-tools {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #dfe6f5;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }

    .group-result-button {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: .16s ease;
    }

    .group-result-button:hover {
      transform: translateY(-1px);
      background: #f4f7ff;
    }

    .student-paper-question strong { font-size: 15px; }
    .student-paper-question p { margin: 7px 0; color: #696e78; font-size: 12px; }
    .student-paper-answer { color: #30343d; font-family: "Kaiti SC", "STKaiti", serif; font-size: 19px; line-height: 1.65; }
    .student-paper-steps { display: grid; gap: 7px; margin: 12px 0 0 8px; }
    .student-paper-step { display: grid; grid-template-columns: minmax(0,1fr) 23px; gap: 10px; align-items: center; min-height: 27px; padding: 2px 8px 3px 0; border-bottom: 1px solid rgba(111,124,147,.16); color: #343b48; font-family: "Kaiti SC", "STKaiti", serif; font-size: 16px; }
    .student-paper-step .mark-icon { width: 21px; height: 21px; }
    .student-paper-answer.is-empty { color: #aaa69d; font-family: inherit; font-size: 13px; }

    .student-paper-prompt {
      color: #252a35;
      font-size: 15px;
      line-height: 1.9;
    }

    .student-paper-prompt b { margin-right: 5px; font-size: 16px; }

    .student-paper-options {
      margin: 8px 0 0 24px;
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 6px 24px;
      color: #333842;
      font-size: 14px;
      line-height: 1.7;
    }

    .student-paper-response {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 84px;
      margin-inline: 4px;
      vertical-align: middle;
    }

    .student-paper-response.is-choice { min-width: 0; margin-inline: 1px; }

    .student-paper-response.is-block {
      display: flex;
      min-height: 54px;
      margin: 9px 0 0;
      padding: 8px 10px 7px;
      border-bottom: 1px solid #8f9299;
    }

    .student-paper-response .student-paper-answer {
      min-width: 56px;
      padding: 0 8px 1px;
      border-bottom: 1px solid #8f9299;
    }

    .student-paper-response.is-choice .student-paper-answer {
      min-width: 0;
      padding-inline: 3px;
      border: 0;
      text-align: center;
    }

    .student-paper-response.is-block .student-paper-answer {
      flex: 1;
      padding: 0;
      border: 0;
    }

    .student-paper-mark {
      position: absolute;
      top: 1px;
      right: 2px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      transform: rotate(-7deg);
    }

    .student-paper-mark .mark-icon,
    .student-paper-mark .mark-icon.correct,
    .student-paper-mark .mark-icon.partial,
    .student-paper-mark .mark-icon.wrong { width: 36px; height: 36px; }

    .student-paper-mark.is-inline {
      position: static;
      width: 30px;
      height: 30px;
      display: inline-grid;
      flex: none;
      vertical-align: middle;
      transform: rotate(-7deg);
    }

    .student-paper-mark.is-inline .mark-icon,
    .student-paper-mark.is-inline .mark-icon.correct,
    .student-paper-mark.is-inline .mark-icon.partial,
    .student-paper-mark.is-inline .mark-icon.wrong { width: 29px; height: 29px; }

    .student-answer-peek {
      position: absolute;
      top: 0;
      right: calc(100% + 22px);
      z-index: 8;
      width: 188px;
      padding: 13px 14px;
      border: 1px solid #d8dfef;
      border-radius: 12px;
      color: #34405a;
      background: rgba(255,255,255,.98);
      box-shadow: 0 14px 34px rgba(39,57,99,.16);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-6px);
      transition: opacity .14s ease, visibility .14s ease, transform .14s ease;
    }

    .student-answer-peek::after {
      content: "";
      position: absolute;
      top: 18px;
      right: -7px;
      border-width: 7px 0 7px 7px;
      border-style: solid;
      border-color: transparent transparent transparent #fff;
    }

    .student-answer-peek::before {
      content: "";
      position: absolute;
      top: 0;
      right: -24px;
      width: 24px;
      height: 100%;
    }

    .student-answer-peek__label {
      display: block;
      color: var(--brand);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .student-answer-peek strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.55;
    }

    .student-answer-peek__evidence {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }

    .student-answer-peek__edit { width: 100%; min-height: 30px; margin-top: 10px; border: 1px solid #cbd6ee; border-radius: 8px; color: #43598d; background: #f6f8ff; font-size: 10px; font-weight: 850; cursor: pointer; }
    .student-answer-peek__edit:hover { border-color: #9dace0; background: #edf1ff; }
    .student-answer-peek__edit:disabled { opacity: .55; cursor: wait; }

    .student-paper-question[data-student-paper-question]:hover .student-answer-peek,
    .student-paper-question[data-student-paper-question]:focus-visible .student-answer-peek,
    .student-paper-question[data-student-paper-question]:focus-within .student-answer-peek,
    .student-paper-question.is-answer-pinned .student-answer-peek {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0);
    }

    .student-paper-score {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 52px;
      padding: 5px 7px;
      border: 1px solid rgba(219,77,89,.34);
      border-radius: 999px;
      color: #cf3f4c;
      background: rgba(255,255,255,.82);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      transform: rotate(-4deg);
    }

    .student-tool-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr);
      border-left: 1px solid var(--line);
      background: rgba(255,255,255,.97);
    }

    .student-tool-head {
      display: flex;
      align-items: center;
      min-height: 68px;
      padding: 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .student-tool-page { color: #20293d; font-size: 14px; }

    .student-question-tools {
      overflow: visible;
      padding: 0 26px 24px;
    }

    .student-question-tool {
      padding: 23px 0 21px;
      border-bottom: 1px solid var(--line);
    }

    .student-question-tool__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .student-question-tool__head > strong { color: #1e2738; font-size: 13px; }
    .student-tool-answer { margin: 15px 0 0; color: #252d3d; font-size: 13px; line-height: 1.6; }
    .student-tool-answer.is-empty { color: #a1aabc; }

    .student-judge-group { display: flex; align-items: center; gap: 4px; }

    .student-judge-button {
      min-width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      color: #253044;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      transition: .16s ease;
    }

    .student-judge-button:hover { background: #f3f6fb; }
    .student-judge-button.is-active[data-student-result="correct"],
    .student-judge-button.is-active[data-student-bulk-result="correct"],
    .student-judge-button.is-active[data-student-part-result="correct"] {
      color: #1dbd6d;
      box-shadow: inset 0 0 0 2px #35c97b;
      background: #edfff5;
    }

    .student-judge-button.is-active[data-student-result="wrong"],
    .student-judge-button.is-active[data-student-bulk-result="wrong"],
    .student-judge-button.is-active[data-student-part-result="wrong"] {
      color: #ff565a;
      box-shadow: inset 0 0 0 2px #ff6468;
      background: #fff4f4;
    }

    .student-judge-button.with-label { width: auto; padding-inline: 7px 9px; border-radius: 8px; font-size: 12px; }
    .student-judge-button.with-label i { font-style: normal; font-size: 20px; line-height: 1; }
    .student-tool-menu { width: 28px; height: 28px; margin-left: 6px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-size: 17px; letter-spacing: .08em; }
    .student-tool-menu:hover { background: #f3f6fb; }

    .student-part-list { display: grid; gap: 5px; margin-top: 12px; padding-left: 48px; }
    .student-part-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; }
    .student-part-row > span { color: #31394a; font-size: 13px; }
    .student-part-row .student-judge-button { height: 30px; min-width: 30px; }

    .student-result-options {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
      margin-top: 10px;
    }

    .student-result-option {
      min-height: 30px;
      padding: 0 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      transition: .16s ease;
    }

    .student-result-option:hover { transform: translateY(-1px); border-color: #c6d0e4; }
    .student-result-option.active { color: var(--brand-dark); border-color: #aebdf3; background: var(--brand-soft); }
    .student-result-option.active[data-student-result="correct"] { color: var(--green); border-color: #a9ddc7; background: var(--green-soft); }
    .student-result-option.active[data-student-result="partial"] { color: var(--amber); border-color: #efd39e; background: var(--amber-soft); }
    .student-result-option.active[data-student-result="wrong"] { color: var(--red); border-color: #efbbc1; background: var(--red-soft); }

    .student-score-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .student-score-row input { width: 58px; height: 32px; padding: 0 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }

    .student-exam-tool__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .student-exam-type {
      max-width: 112px;
      overflow: hidden;
      padding: 3px 7px;
      border-radius: 999px;
      color: #67738d;
      background: #f1f4f9;
      font-size: 9px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-exam-objective {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .student-exam-judge-group { display: inline-flex; align-items: center; gap: 8px; }

    .student-exam-judge-button {
      min-width: 64px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #536079;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: .16s ease;
    }

    .student-exam-judge-button i { font-style: normal; font-size: 18px; line-height: 1; }
    .student-exam-judge-button:hover { border-color: #bec9dc; transform: translateY(-1px); }
    .student-exam-judge-button.is-active[data-student-result="correct"] { color: var(--green); border-color: #83d7b4; background: var(--green-soft); box-shadow: inset 0 0 0 1px rgba(35,153,107,.1); }
    .student-exam-judge-button.is-active[data-student-result="wrong"] { color: var(--red); border-color: #ef9ca4; background: var(--red-soft); box-shadow: inset 0 0 0 1px rgba(217,86,98,.08); }

    .student-exam-score-summary {
      color: #26395f;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .student-subjective-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid #e4e9f2;
      border-radius: 11px;
      color: #526079;
      background: #f8faff;
      font-size: 11px;
      font-weight: 750;
    }

    .student-subjective-score__editor { display: inline-flex; align-items: center; gap: 6px; color: #2b3650; }
    .student-subjective-score input { width: 64px; height: 34px; padding: 0 8px; border: 1px solid #cbd5e6; border-radius: 8px; color: #172341; background: #fff; font-weight: 850; text-align: center; }
    .student-subjective-score input:focus { outline: 3px solid rgba(79,102,216,.16); border-color: #8192dc; }

    .student-review-footer {
      position: sticky;
      bottom: 0;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.98);
    }
    .student-review-footer .button {
      min-width: 178px;
      min-height: 38px;
      border-radius: 10px;
      box-shadow: 0 12px 26px rgba(79,102,216,.20);
    }
    #confirmStudent { display: inline-flex; visibility: visible; }

    @media (max-width: 1400px) {
      .student-answer-peek {
        top: -8px;
        right: auto;
        left: 12px;
        width: 230px;
        transform: translateY(-100%) translateY(-6px);
      }

      .student-answer-peek::after { display: none; }

      .student-paper-question[data-student-paper-question]:hover .student-answer-peek,
      .student-paper-question[data-student-paper-question]:focus-visible .student-answer-peek,
      .student-paper-question[data-student-paper-question]:focus-within .student-answer-peek,
      .student-paper-question.is-answer-pinned .student-answer-peek {
        transform: translateY(-100%);
      }

      .similar-answer-suggestion {
        top: calc(100% + 8px);
        right: 10px;
        left: auto;
        width: 270px;
        transform: translateY(6px);
      }

      .student-paper-question-shell:hover .similar-answer-suggestion,
      .student-paper-question-shell:focus-within .similar-answer-suggestion { transform: translateY(0); }
    }

    @media (max-width: 1180px) {
      body { overflow: auto; }
      .app-shell { height: auto; min-height: 100vh; }
      .app { height: auto; min-height: 100vh; }
      .workspace { grid-template-columns: 170px 270px minmax(480px,1fr); min-height: 760px; }
      .result-navigation { margin-left: 0; }
      .student-workspace { min-width: 1170px; }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app-shell { padding: 0; }
      .app { border-radius: 0; grid-template-rows: auto auto; }
      .topbar { padding: 14px; flex-wrap: wrap; }
      .workspace { display: block; min-height: 0; }
      .rail { display: block; border-right: 0; border-bottom: 1px solid var(--line); }
      .panel-heading { padding-bottom: 8px; }
      .question-list { display: flex; overflow-x: auto; padding: 4px 12px 12px; }
      .question-item { min-width: 150px; }
      .rail-footer { position: sticky; bottom: 0; z-index: 10; }
      .assistant { border-right: 0; border-bottom: 1px solid var(--line); }
      .answer-zone { min-height: 700px; }
    }

    @media (max-width: 620px) {
      h1 { font-size: 18px; }
      .answer-toolbar { align-items: flex-start; }
      .density-label { display: none; }
      .student-grid { --columns: 2 !important; }
      .groups-scroll { padding: 12px 46px 12px 12px; }
    }
    /* 批改符号统一使用仓库内资源，确保 GitHub 页面可正常加载 */
    .mark-icon.correct,
    .grade-symbol.correct {
      background-image: url("assets/correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }

    .mark-icon.partial,
    .mark-icon.half,
    .grade-symbol.partial,
    .grade-symbol.half {
      background-image: url("assets/half-correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }

    .mark-icon.incorrect,
    .mark-icon.wrong,
    .grade-symbol.incorrect,
    .grade-symbol.wrong {
      background-image: url("assets/wrong.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
    }
  </style>
  <style id="project-grading-symbol-assets">
    .mark-icon.correct,
    .grade-symbol.correct {
      background-image: url("assets/correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
      font-size: 0 !important;
    }

    .mark-icon.partial,
    .mark-icon.half,
    .grade-symbol.partial,
    .grade-symbol.half {
      background-image: url("assets/half-correct.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
      font-size: 0 !important;
    }

    .mark-icon.incorrect,
    .mark-icon.wrong,
    .grade-symbol.incorrect,
    .grade-symbol.wrong {
      background-image: url("assets/wrong.png") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      color: transparent !important;
      font-size: 0 !important;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app">
      <header class="topbar">
        <div class="title-lockup">
        <a class="back-link" href="./index.html?preserveCollection=1" aria-label="返回批改首页">←</a>
          <div class="grading-task-lockup">
            <strong id="gradingTaskTitle">二次函数单元作业</strong>
          </div>
        </div>
      </header>

      <section class="workspace" id="questionWorkspace">
        <aside class="rail" aria-label="题号导航">
          <div class="grading-mode-dock">
            <div class="grading-mode-dropdown" data-grading-view-dropdown>
              <button class="grading-mode-trigger" type="button" data-grading-view-trigger aria-haspopup="listbox" aria-expanded="false">
                <span data-grading-view-current>按题批改</span>
                <span class="grading-mode-trigger__arrow" aria-hidden="true"></span>
              </button>
              <div class="grading-mode-menu" role="listbox" aria-label="批改方式" hidden>
                <button class="grading-mode-option is-selected" type="button" role="option" aria-selected="true" data-grading-view-option="question">按题批改</button>
                <button class="grading-mode-option" type="button" role="option" aria-selected="false" data-grading-view-option="student">按学生批改</button>
              </div>
            </div>
          </div>
          <nav class="question-list" id="questionList"></nav>
          <div class="rail-footer">
            <button class="button primary" type="button" id="confirmAll">一键确认批改</button>
          </div>
        </aside>

        <aside class="assistant" aria-label="题目批改辅助信息">
          <section class="assist-card metric-card is-hidden">
            <div class="assist-label" id="metricLabel">正确率</div>
            <div class="metric-value" id="accuracyValue"></div>
          </section>

          <section class="assist-card question-snapshot-card">
            <div class="question-snapshot-card__head">
              <div class="assist-label">题干</div>
            </div>
            <button class="question-snapshot-button" id="questionSnapshotButton" type="button" data-modal="questionSnapshot" aria-label="放大查看题干截图">
              <img class="question-snapshot-thumbnail" id="questionSnapshotThumbnail" alt="题干截图" />
            </button>
          </section>

          <section class="assist-card answer-card">
            <div class="answer-card__head">
              <div class="assist-label">答案</div>
              <button class="answer-edit-button" id="editGradingAnswer" type="button" hidden>编辑答案</button>
            </div>
            <div class="answer-value" id="answerValue"></div>
            <details class="answer-details" id="explanationDetails">
              <summary>解析</summary>
              <div class="explanation" id="explanationText"></div>
            </details>
            <form class="grading-rule-editor" id="gradingAnswerEditor" hidden>
              <label for="gradingAnswerInput">答案</label>
              <input id="gradingAnswerInput" type="text" />
              <div class="grading-rule-field" id="gradingRuleField">
                <label for="gradingRuleInput">批改标准与得分要求</label>
                <textarea id="gradingRuleInput" rows="6"></textarea>
              </div>
              <div class="grading-rule-editor__actions">
                <button type="button" data-rule-cancel>取消</button>
                <button type="submit">保存并重新批改</button>
              </div>
            </form>
            <div class="question-regrade-status" id="questionRegradeStatus" role="status" aria-live="polite" hidden></div>
          </section>

          <section class="assist-card basis-card">
            <div class="basis-card__head">
              <span class="basis-card__icon" aria-hidden="true">✦</span>
              <div class="assist-label">AI 批改依据</div>
            </div>
            <ul class="basis-list" id="basisList"></ul>
          </section>
        </aside>

        <section class="answer-zone" aria-label="题目分组批改">
          <div class="answer-toolbar">
            <nav class="result-navigation" id="resultNavigation" aria-label="批改结果快速定位">
              <button class="result-navigation__button is-active" type="button" data-result-target="correct" aria-current="true">正确</button>
              <button class="result-navigation__button" type="button" data-result-target="partial">半对</button>
              <button class="result-navigation__button" type="button" data-result-target="wrong">错误</button>
              <button class="result-navigation__button" type="button" data-result-target="ungraded">未批改</button>
            </nav>
            <div class="density-control" aria-label="每行卡片数量">
              <span class="density-label">每行</span>
              <div class="density-switch">
                <button class="density-button" type="button" data-columns="2">2</button>
                <button class="density-button active" type="button" data-columns="3">3</button>
                <button class="density-button" type="button" data-columns="4">4</button>
              </div>
            </div>
          </div>

          .flatMap(([result, count]) => Array(Number(count)).fill(result))
          .slice(0, CLASS_SIZE);
        const offsets = {};
        return students.map((name, index) => {
          const result = resultSequence[index] || "ungraded";
          const profiles = question.resultProfiles[result];
          const offset = offsets[result] || 0;
          const profile = profiles[offset % profiles.length];
          offsets[result] = offset + 1;
          return {
            id: `${question.id}-${index}`,
            name,
            result,
            ...profile,
            steps: profile.steps?.map((step) => ({ ...step })),
            matchedCriteria: profile.matchedCriteria ? [...profile.matchedCriteria] : [],
            missingCriteria: profile.missingCriteria ? [...profile.missingCriteria] : [],
            regradeResult: profile.regradeResult || result
          };
        });
      }

      function expandQuestionStudents(question, qIndex) {
        if (usesPaperDirectGrading && question.resultProfiles) {
          return expandCapabilityStudents(question);
        }
        const shift = shiftedPatterns[qIndex % shiftedPatterns.length];
        const resultForIndex = (index) => {
          const initialResult = resultPattern[(index + shift) % resultPattern.length];
          return isExam && isObjectiveQuestion(question) && initialResult === "partial" ? "wrong" : initialResult;
        };

        if (question.groups) {
          const existingByName = new Map(question.groups.flatMap((group) =>
            group.students.map((student) => [student.name, { ...student, group }])
          ));
          return students.map((name, index) => {
            const existing = existingByName.get(name);
            if (existing) {
              return {
                id: `${question.id}-${index}`,
                name,
                answer: existing.answer,
                result: existing.group.result,
                groupId: existing.group.id
              };
            }
            const result = resultForIndex(index);
            const matchingGroups = question.groups.filter((group) => group.result === result);
            const group = matchingGroups[index % matchingGroups.length] || question.groups[index % question.groups.length];
            const sample = group.students[index % group.students.length];
            return {
              id: `${question.id}-${index}`,
              name,
              answer: sample?.answer || question.answer,
              result: group.result,
              groupId: group.id
            };
          });
        }

        return students.map((name, index) => {
          const result = resultForIndex(index);
          return {
            id: `${question.id}-${index}`,
            name,
            answer: question.responses[index % question.responses.length],
            result
          };
        });
      }

      function formatScore(score) {
        if (score === "待评") return score;
        return Number.isInteger(score) ? `${score}` : score.toFixed(1);
      }

      function defaultScoreForResult(result, question) {
        const max = maxScore(question);
        if (result === "correct") return max;
        if (result === "partial") return Math.max(1, Math.round(max * 0.65));
        if (result === "wrong") return 0;
        return "待评";
      }

      function studentScore(student, question) {

      function scoreInputValue(student, question) {

      function averageExamScore(question) {
        const scores = question.students

              : defaultScoreForResult(student.result, question);
            return typeof score === "number" ? score : null;

          .filter((score) => score !== null);
        if (!scores.length) return "0";
        return formatScore(scores.reduce((total, score) => total + score, 0) / scores.length);

      function escapeSnapshotXml(value) {
        const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" };
        return String(value).replace(/[&<>"']/g, character => entities[character]);
      }

      function wrapSnapshotText(value, maxWidth = 28) {
        const lines = [];
        let line = "";
        let width = 0;
        [...String(value)].forEach((character) => {
          const characterWidth = /[\u0000-\u00ff]/.test(character) ? .56 : 1;
          if (line && width + characterWidth > maxWidth) {
            lines.push(line);
            line = character;
            width = characterWidth;
            return;
          }
          line += character;
          width += characterWidth;
        });
        if (line) lines.push(line);
        return lines;
      }

      function studentEvidenceText(question, student) {
        const statements = [];
        if (student.method) statements.push(`AI 识别为${student.method}`);

        if (student.matchedCriteria?.length) statements.push(`作答满足${student.matchedCriteria.join("、")}`);
        if (student.missingCriteria?.length) statements.push(`但缺少${student.missingCriteria.join("、")}`);
        if (student.steps?.length && !student.evidence) {
          const correctSteps = student.steps.filter((step) => step.result === "correct").length;
          statements.push(correctSteps === student.steps.length
            ? `${student.steps.length}个关键步骤均正确`
            : `${student.steps.length}个关键步骤中${correctSteps}个正确`);
        }
        if (!statements.length) {
          if (student.result === "ungraded") statements.push("字迹模糊，当前无法确认批改结果");
          else if (student.result === "correct") statements.push("答案与关键过程符合本题批改标准");
          else if (student.result === "partial") statements.push("作答部分符合本题批改标准");
          else statements.push("作答与本题答案不一致");
        }
        return `${statements.join("，").replace(/[。；，]+$/, "")}。`;

          question.students.forEach((student) => {

          });
          question.accuracy = Math.round(question.students.filter((student) => student.result === "correct").length / CLASS_SIZE * 100);

        if (isExam) {

          const scores = attempts.reduce((sum, { question, student }) => sum + studentScore(student, question), 0);
          return totals ? Math.round(scores / totals * 100) : 0;
        }
        const points = attempts.reduce((total, { student }) => (
          total + (student.result === "correct" ? 1 : student.result === "partial" ? .5 : 0)
        ), 0);
        return Math.round(points / attempts.length * 100);
