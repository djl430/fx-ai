<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2fb">
  <title>确认采集结果 · 飞象智批</title>
  <style>
    :root {
      --ink: #24345c;
      --muted: #7180a0;
      --line: rgba(103, 119, 158, .16);
      --primary: #5268d6;
      --primary-dark: #2b3f78;
      --paper: #fffdf9;
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(209, 227, 255, .92), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(225, 218, 252, .7), transparent 30%),
        linear-gradient(135deg, #edf3fb 0%, #f8faff 55%, #e9eef9 100%);
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(82, 104, 214, .25);
      outline-offset: 3px;
    }
    .shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 28px 82px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #5068a6;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }
    .page-head { margin: 22px 0 14px; }
    .eyebrow {
      margin: 0 0 8px;
      color: #6d7daf;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(24px, 2.4vw, 30px);
      letter-spacing: -.035em;
    }
    .scan-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #526180;
      font-size: 13px;
    }
    .notice-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 12px;
      margin-top: 12px;
    }
    .notice-actions__right { display: flex; align-items: flex-end; flex-direction: column; gap: 8px; }
    .scan-notice strong { color: #4058bd; font-size: 16px; }
    .sample-list { display: grid; gap: 12px; }
    .sample {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 18px;
      background: rgba(255, 255, 255, .7);
      box-shadow: 0 15px 38px rgba(70, 88, 134, .09);
      backdrop-filter: blur(18px);
    }
    .sample-head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
      padding: 10px 48px 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .52);
    }
    .sample-delete,
    .page-delete {
      position: absolute;
      z-index: 6;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #bd4e59;
      background: #fff0f2;
      box-shadow: 0 7px 16px rgba(156, 60, 70, .13);
      cursor: pointer;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .16s ease, transform .16s ease, background .16s ease;
    }
    .sample-delete { top: 10px; right: 12px; }
    .page-delete { top: 9px; right: 9px; }
    .sample-head:hover .sample-delete,
    .sample-head:focus-within .sample-delete,
    .scan-card:hover .page-delete,
    .scan-card:focus-within .page-delete { opacity: 1; pointer-events: auto; transform: none; }
    .sample-delete:hover,
    .page-delete:hover { color: #fff; background: #ce5661; }
    .sample-badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 10px;
      color: #5369c8;
      background: #e9edff;
      font-size: 12px;
      font-weight: 850;
    }
    .sample-fields {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 7px;
    }
    .kind-field { position: relative; flex: 0 0 auto; }
    .kind-field::after {
      position: absolute;
      top: 50%;
      right: 10px;
      pointer-events: none;
      content: "⌄";
      transform: translateY(-57%);
      color: #4d63be;
      font-size: 12px;
      font-weight: 900;
    }
    .kind-select {
      appearance: none;
      min-width: 74px;
      height: 32px;
      border: 1px solid #cfd8fb;
      border-radius: 10px;
      padding: 0 27px 0 11px;
      color: #465dbb;
      background: #f0f3ff;
      font-size: 12px;
      font-weight: 800;
    }
    .sample-title-input {
      width: min(430px, 100%);
      min-width: 120px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
      font-size: 16px;
      font-weight: 820;
    }
    .sample-title-input:hover { border-color: #dbe2f4; background: rgba(255, 255, 255, .72); }
    .sample-title-input:focus { border-color: #9eb0ef; background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(82, 104, 214, .12); }
    .sample-meta {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .hint {
      flex: 0 0 auto;
      color: #7885aa;
      font-size: 11px;
    }
    .pages {
      display: flex;
      min-height: 216px;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: flex-start;
      gap: 10px;
      overflow: visible;
      padding: 13px;
      transition: background .18s ease, box-shadow .18s ease;
    }
    .pages:empty::before {
      display: grid;
      width: 100%;
      min-height: 188px;
      place-items: center;
      border: 1.5px dashed #c9d3ef;
      border-radius: 16px;
      color: #8490ae;
      background: rgba(244, 247, 255, .55);
      content: "将上方样卷页面拖到这里";
      font-size: 12px;
      font-weight: 700;
    }
    .pages.drag-over {
      background: rgba(230, 236, 255, .72);
      box-shadow: inset 0 0 0 2px #7185df;
    }
    .scan-card {
      position: relative;
      width: 172px;
      min-width: 172px;
      min-height: 202px;
      border: 1px solid #dbe2ee;
      border-radius: 10px;
      padding: 8px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(63, 78, 112, .08);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .scan-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(63, 78, 112, .14); }
    .scan-card.is-dragging { opacity: .45; transform: rotate(1.5deg) scale(.98); cursor: grabbing; }
    .clip {
      position: absolute;
      top: -4px;
      left: calc(50% - 15px);
      width: 30px;
      height: 6px;
      border-radius: 0 0 7px 7px;
      background: #e8ebf1;
    }
    .scan-paper {
      position: relative;
      height: 184px;
      padding: 18px 11px 28px;
      color: #5c6174;
      background: repeating-linear-gradient(to bottom, var(--paper) 0, var(--paper) 19px, #eee6db 20px);
      font-family: Georgia, "Songti SC", serif;
    }
    .scan-paper h4 { margin: 0 0 10px; font-size: 11px; font-weight: 500; text-align: center; }
    .scan-paper p { margin: 6px 0; font-size: 9px; }
    .paper-page-number {
      position: absolute;
      right: 0;
      bottom: 7px;
      left: 0;
      color: #8a8f9d;
      font-size: 9px;
      text-align: center;
    }
    .scan-mark { position: absolute; right: 18px; bottom: 14px; color: #e95a60; font-size: 24px; }
    .add-sample {
      min-height: 38px;
      border: 1px solid #c6d0fa;
      border-radius: 12px;
      padding: 0 20px;
      color: #4f64bd;
      background: rgba(255, 255, 255, .66);
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(79, 98, 172, .06);
    }
    .add-sample:hover { background: #fff; transform: translateY(-1px); }
    .anomaly-summary {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      color: #7b5c2d;
      font-size: 12px;
      font-weight: 750;
      text-align: right;
    }
    .anomaly-summary strong { color: #bd7417; font-size: 14px; }
    .anomaly-status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      color: #9d6820;
      background: #fff4df;
      font-size: 11px;
      font-weight: 800;
    }
    .anomaly-open { min-height: 30px; border: 1px solid #eccb9b; border-radius: 9px; padding: 0 10px; color: #a66714; background: #fffaf2; font-weight: 800; }
    .anomaly-open:hover { background: #fff2df; }
    .anomaly-backdrop { position: fixed; z-index: 55; inset: 0; display: flex; justify-content: flex-end; background: rgba(31, 42, 74, .22); backdrop-filter: blur(3px); }
    .anomaly-drawer { width: min(460px, 100%); height: 100%; overflow: auto; padding: 22px; border-left: 1px solid rgba(255,255,255,.9); background: #fbfcff; box-shadow: -18px 0 50px rgba(34, 48, 89, .16); }
    .anomaly-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .anomaly-drawer-head h2 { margin: 0; font-size: 20px; }
    .anomaly-drawer-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .anomaly-drawer-close { width: 32px; height: 32px; border: 0; border-radius: 9px; color: var(--muted); background: #edf1fb; font-size: 20px; }
    .anomaly-section { margin-top: 18px; }
    .anomaly-section h3 { margin: 0 0 8px; color: #5b6887; font-size: 12px; }
    .anomaly-card { padding: 13px; border: 1px solid #e1e6f1; border-radius: 13px; background: #fff; }
    .anomaly-card + .anomaly-card { margin-top: 8px; }
    .anomaly-card-top { display: flex; align-items: center; gap: 8px; }
    .anomaly-card-top strong { font-size: 14px; }
    .anomaly-card p { margin: 7px 0 10px; color: #697793; font-size: 12px; line-height: 1.55; }
    .anomaly-status.is-resolved { color: #277d58; background: #eaf8f1; }
    .anomaly-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .anomaly-actions button { min-height: 29px; border: 1px solid #d7dff0; border-radius: 8px; padding: 0 9px; color: #495b91; background: #f9faff; font-size: 12px; font-weight: 800; }
    .anomaly-actions button:first-child { border-color: transparent; color: #fff; background: #5268d6; }
    .anomaly-drawer-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .anomaly-drawer-foot button { width: 100%; min-height: 38px; border: 1px solid #d8e0f1; border-radius: 10px; color: #657492; background: #fff; font-weight: 800; }
    .anomaly-confirm-backdrop { position: fixed; z-index: 70; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(30, 39, 70, .32); backdrop-filter: blur(7px); }
    .anomaly-confirm-dialog { width: min(440px, 100%); border-radius: 20px; padding: 22px; background: #fff; box-shadow: 0 26px 70px rgba(36, 49, 86, .24); }
    .anomaly-confirm-dialog h2 { margin: 0; font-size: 20px; }
    .anomaly-confirm-dialog p { margin: 10px 0 18px; color: var(--muted); line-height: 1.65; }
    .anomaly-confirm-actions { display: flex; justify-content: flex-end; gap: 9px; }
    .anomaly-confirm-actions button { min-height: 39px; border-radius: 10px; padding: 0 14px; font-weight: 800; }
    .anomaly-return { border: 1px solid #d9e0ef; color: var(--ink); background: #fff; }
    .anomaly-continue { border: 0; color: #fff; background: #5268d6; }
    .sticky {
      position: fixed;
      z-index: 20;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 14px 34px rgba(73, 91, 139, .17);
      backdrop-filter: blur(18px);
    }
    .form-message { margin: 0 auto 0 0; color: #9a6d29; font-size: 13px; font-weight: 700; }
    .form-message.is-error { color: #c54955; }
    .confirm {
      min-height: 40px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), #5c70d5);
      box-shadow: 0 10px 24px rgba(55, 74, 143, .24);
      font-size: 14px;
      font-weight: 850;
    }
    .confirm:hover { transform: translateY(-1px); }
    .collection-delete-backdrop {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(30, 39, 70, .32);
      backdrop-filter: blur(7px);
    }
    .collection-delete-dialog {
      width: min(430px, 100%);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 22px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 26px 70px rgba(36, 49, 86, .24);
    }
    .collection-delete-dialog h2 { margin: 0; font-size: 21px; }
    .collection-delete-dialog p { margin: 10px 0 22px; color: var(--muted); line-height: 1.65; }
    .collection-delete-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .collection-delete-actions button { min-height: 42px; border-radius: 12px; padding: 0 16px; font-weight: 800; }
    .collection-delete-cancel { border: 1px solid #dde3f0; color: var(--ink); background: #fff; }
    .collection-delete-confirm { border: 0; color: #fff; background: #c94f5a; }
    .submission-picker-trigger {
      flex: 0 0 auto;
      min-height: 30px;
      border: 1px solid #cfd8fb;
      border-radius: 9px;
      padding: 0 9px;
      color: #4b61bb;
      background: #f4f6ff;
      font-size: 11px;
      font-weight: 800;
    }
    .submission-picker-trigger:hover { color: #fff; background: #5c70d5; }
    .submission-picker-backdrop {
      position: fixed;
      z-index: 70;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(30, 39, 70, .38);
      backdrop-filter: blur(7px);
    }
    .submission-picker-dialog {
      display: grid;
      width: min(920px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 20px;
      background: #fbfcff;
      box-shadow: 0 26px 70px rgba(36, 49, 86, .28);
    }
    .submission-picker-head,
    .submission-picker-actions,
    .submission-picker-foot { display: flex; align-items: center; gap: 12px; }
    .submission-picker-head { justify-content: space-between; padding: 16px 18px 10px; }
    .submission-picker-head h2 { margin: 0; font-size: 18px; }
    .submission-picker-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .submission-picker-close { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 9px; color: #64708e; background: #eef1fa; font-size: 19px; }
    .submission-picker-actions { justify-content: space-between; padding: 10px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .submission-picker-search { width: min(280px, 100%); height: 34px; border: 1px solid #d9e0f1; border-radius: 9px; padding: 0 10px; color: var(--ink); background: #fff; font-size: 12px; }
    .submission-picker-filter { display: inline-flex; align-items: center; gap: 6px; color: #5c6988; font-size: 12px; font-weight: 700; }
    .submission-picker-list { overflow: auto; padding: 12px 18px 18px; }
    .submission-student { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .submission-student:last-child { border-bottom: 0; }
    .submission-student-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .submission-student-head strong { font-size: 14px; }
    .submission-student-head button { min-height: 28px; border: 1px solid #d3dcfb; border-radius: 8px; padding: 0 8px; color: #4b61bb; background: #f7f8ff; font-size: 11px; font-weight: 800; }
    .submission-page-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .submission-page-option { position: relative; display: grid; width: 128px; min-height: 86px; grid-template-columns: 17px 1fr; gap: 6px; align-items: start; border: 1px solid #dde4f1; border-radius: 10px; padding: 8px; color: #4b5675; background: #fffefb; font-size: 11px; line-height: 1.45; }
    .submission-page-option input { margin: 2px 0 0; accent-color: #596ed2; }
    .submission-page-option strong, .submission-page-option small { display: block; }
    .submission-page-option small { margin-top: 4px; color: #7c87a0; }
    .submission-page-option.is-owned { color: #8a7191; background: #f4f1f7; }
    .submission-page-option.is-owned small { color: #9a6d75; }
    .submission-picker-empty { padding: 36px 0; color: var(--muted); text-align: center; font-size: 13px; }
    .submission-picker-foot { justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: #fff; }
    .submission-picker-foot button { min-height: 36px; border-radius: 10px; padding: 0 13px; font-weight: 800; }
    .submission-picker-cancel { border: 1px solid #dce3f0; color: var(--ink); background: #fff; }
    .submission-picker-add { border: 0; color: #fff; background: #5268d6; }
    .submission-picker-add:disabled { cursor: not-allowed; opacity: .45; }
    body.is-read-only .notice-actions .add-sample,
    body.is-read-only .sticky { display: none; }
    .page-head .eyebrow,
    .sample-meta,
    .scan-mark { display: none; }
    body.is-read-only .kind-field::after { display: none; }
    body.is-read-only .kind-select,
    body.is-read-only .sample-title-input { cursor: default; opacity: 1; }
    body.is-read-only .scan-card { cursor: default; }
    body.is-read-only .scan-card:hover { transform: none; }
    @media (max-width: 820px) {
      .shell { padding: 20px 18px 124px; }
      .page-head { margin-top: 30px; }
      .sample-head { flex-wrap: wrap; align-items: flex-start; }
      .sample-fields { width: calc(100% - 88px); flex-wrap: wrap; }
      .sample-title-input { flex: 1; }
      .sample-meta { margin-left: 76px; }
      .hint { display: none; }
      .scan-card { width: calc(50% - 7px); min-width: 150px; }
      .form-message { max-width: 55%; }
    }
    @media (max-width: 520px) {
      .notice-actions { grid-template-columns: 1fr; }
      .notice-actions__right { align-items: flex-start; }
      .anomaly-summary { justify-content: flex-start; text-align: left; }
      .scan-notice { align-items: flex-start; }
      .sample-fields { width: 100%; }
      .sample-meta { width: 100%; margin-left: 0; }
      .pages { padding: 13px; }
      .scan-card { width: 100%; }
      .sticky { right: 10px; bottom: 10px; left: 10px; align-items: stretch; flex-direction: column; }
      .form-message { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="collection-history.html">← 返回历史采集任务</a>
    <header class="page-head">
      <p class="eyebrow">高扫采集 · 样卷确认</p>
      <h1 class="page-title" id="taskTitle">今天 19:42 · 六年级3班 · 数学</h1>
      <div class="notice-actions">
        <aside class="scan-notice" aria-live="polite">
          <span>本次扫描识别到以下 <strong id="sampleCount">2</strong> 个样卷，确认无误后 AI 开始分析</span>
        </aside>
        <div class="notice-actions__right">
          <button class="add-sample" type="button" data-action="add-sample">添加样卷</button>
          <div class="anomaly-summary" id="anomalySummary"><span>提交异常 <strong id="anomalyCount">5</strong> 人</span><button class="anomaly-open" type="button" data-action="open-anomaly-drawer">去处理</button></div>
        </div>
      </div>
    </header>

    <div class="sample-list" id="sampleList"></div>
  </main>

  <footer class="sticky">
    <p class="form-message" id="formMessage" role="status"></p>
    <button class="confirm" id="confirm" type="button">确认无误并开始分析</button>
  </footer>
  <div id="collectionDeleteLayer"></div>
  <div id="collectionSubmissionLayer"></div>
  <div id="collectionAnomalyLayer"></div>
  <div id="collectionContinueLayer"></div>

  <script src="collection-flow.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const task = params.get('task') || 'today-1942';
      const readOnly = params.get('mode') === 'view';
      const taskDataMap = {
        'today-1618': {
            title: '今天 16:18 · 六年级1班 · 数学',
            className: '六年级1班 · 数学',
            firstName: '小数运算专项',
            secondName: '几何图形检测',
        },
        'yesterday-1835': {
            title: '昨天 18:35 · 八年级3班 · 数学', className: '八年级3班 · 数学', firstName: '整式乘法练习', secondName: '周末单元检测',
        },
        'yesterday-1206': {
            title: '昨天 12:06 · 六年级2班 · 数学', className: '六年级2班 · 数学', firstName: '小数乘法练习', secondName: '计算能力检测',
        },
        'aug09-1740': {

      const savedRecord = historyState.records[task];

      const defaultAnomalies = [

      const renderDeleteDialog = () => {

            <h2 id="collection-delete-title">确认删除整个样卷？</h2>

            <div class="collection-delete-actions">

              <button class="collection-delete-confirm" type="button" data-action="confirm-delete-sample">确认删除</button>
            </div>
          </section>
        </div>`;
      };

      const renderAnomalySummary = () => {
        const visible = visibleAnomalies();
        if (!visible.length && !readOnly) {
          anomalySummary.innerHTML = '<span>异常提交均已处理，可开始分析。</span>';
          return;
        }
        anomalySummary.innerHTML = `<span>${readOnly ? '本次采集异常' : '提交异常'} <strong id="anomalyCount">${visible.length}</strong> 人</span><button class="anomaly-open" type="button" data-action="open-anomaly-drawer">${readOnly ? '查看' : '去处理'}</button>`;
      };

      const renderAnomalyDrawer = () => {
        if (!anomalyDrawerOpen) {
          collectionAnomalyLayer.innerHTML = '';
          return;
        }
        const grouped = ['缺页', '多页', '归属待确认', '重复提交'].map((type) => ({
          type,
          items: anomalies.filter((anomaly) => anomaly.type === type),
        })).filter((group) => group.items.length);
        collectionAnomalyLayer.innerHTML = `<div class="anomaly-backdrop" data-action="close-anomaly-drawer">
          <aside class="anomaly-drawer" role="dialog" aria-modal="true" aria-labelledby="anomaly-drawer-title">
            <header class="anomaly-drawer-head">
              <div><h2 id="anomaly-drawer-title">提交异常</h2><p>${readOnly ? '已确认采集任务，仅支持查看处理状态。' : '仅处理识别有风险的提交，普通提交无需逐份检查。'}</p></div>
              <button class="anomaly-drawer-close" type="button" data-action="close-anomaly-drawer" aria-label="关闭">×</button>
            </header>
            ${grouped.map(({ type, items }) => `<section class="anomaly-section"><h3>${type} · ${items.length}</h3>${items.map((anomaly) => {
              const resolved = anomaly.status === 'resolved';
              const choices = Array.isArray(anomaly.choices) ? anomaly.choices : [];
              const actions = readOnly || resolved
                ? ''
                : anomaly.type === '缺页'
                  ? `<button type="button" data-action="open-anomaly-submission-picker" data-anomaly-id="${anomaly.id}" data-group-id="${anomaly.groupId}">${anomaly.action}</button>`

              return `<article class="anomaly-card"><div class="anomaly-card-top"><strong>${escapeHtml(anomaly.student)}</strong><span class="anomaly-status ${resolved ? 'is-resolved' : ''}">${resolved ? `已处理${anomaly.choice ? ` · ${escapeHtml(anomaly.choice)}` : ''}` : '待处理'}</span></div><p>${escapeHtml(anomaly.detail)}</p><div class="anomaly-actions">${actions}</div></article>`;

      const renderContinueDialog = () => {

                <span><strong>第 ${page.sourcePageNumber} 页</strong><span>${escapeHtml(page.content[0] || page.paperTitle)}</span><small>${owned ? ownerLabel : '可添加'}</small></span>
              </label>`;
            }).join('')}</div>
          </section>`;
        }).join('');
        const selectedCount = submissionPicker.selectedPageIds.size;
        collectionSubmissionLayer.innerHTML = `<div class="submission-picker-backdrop">
          <section class="submission-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="submission-picker-title">
            <header class="submission-picker-head">
              <div><h2 id="submission-picker-title">从全部提交中添加</h2><p>添加到“${escapeHtml(FxCollectionFlow.normalizeName(targetGroup.name))}”</p></div>

            </header>
            <div class="submission-picker-actions">

              <label class="submission-picker-filter"><input type="checkbox" data-action="filter-unassigned-submissions" ${submissionPicker.unassignedOnly ? 'checked' : ''}>仅看未归属页面</label>

            <div class="submission-picker-list">${studentCards || '<p class="submission-picker-empty">没有符合条件的学生提交。</p>'}</div>

              <button class="submission-picker-add" type="button" data-action="add-selected-submissions" ${selectedCount ? '' : 'disabled'}>添加已选页面（${selectedCount}）</button>
            </footer>

      const render = () => {

      const findGroup = (groupId) => groups.find((group) => group.id === groupId);

      document.addEventListener('click', (event) => {
        const openAnomalyDrawer = event.target.closest('[data-action="open-anomaly-drawer"]');
        if (openAnomalyDrawer) {
          anomalyDrawerOpen = true;
          renderAnomalyDrawer();
          return;
        }
        const closeAnomalyDrawer = event.target.closest('[data-action="close-anomaly-drawer"]');
        const clickedAnomalyBackdrop = event.target.classList.contains('anomaly-backdrop');
        if (closeAnomalyDrawer || clickedAnomalyBackdrop) {
          anomalyDrawerOpen = false;
          renderAnomalyDrawer();
          return;
        }
        const returnAnomalyReview = event.target.closest('[data-action="return-anomaly-review"]');
        if (returnAnomalyReview) {
          anomalyConfirmOpen = false;
          anomalyDrawerOpen = true;
          renderAnomalyDrawer();
          renderContinueDialog();
          return;
        }
        const continueAnalysis = event.target.closest('[data-action="continue-analysis"]');
        if (continueAnalysis) {
          anomalyConfirmOpen = false;
          renderContinueDialog();
          confirmCollection();
          return;
        }
        if (readOnly) return;
        const deferAnomalies = event.target.closest('[data-action="defer-anomalies"]');
        if (deferAnomalies) {
          anomalyDrawerOpen = false;
          formMessage.textContent = '已保留未处理异常，可继续分析或稍后返回处理。';
          formMessage.classList.remove('is-error');
          renderAnomalyDrawer();
          return;
        }
        const resolveAnomaly = event.target.closest('[data-action="resolve-anomaly"]');
        if (resolveAnomaly) {
          const anomaly = anomalies.find((item) => item.id === resolveAnomaly.dataset.anomalyId);
          if (!anomaly) return;
          anomaly.status = 'resolved';
          anomaly.choice = resolveAnomaly.dataset.choice || anomaly.action;
          formMessage.textContent = `已处理${anomaly.student}的${anomaly.type}异常。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const openAnomalySubmissionPicker = event.target.closest('[data-action="open-anomaly-submission-picker"]');
        if (openAnomalySubmissionPicker) {
          anomalyDrawerOpen = false;
          submissionPicker = {
            targetGroupId: openAnomalySubmissionPicker.dataset.groupId,
            anomalyId: openAnomalySubmissionPicker.dataset.anomalyId,
            selectedPageIds: new Set(),
            query: '',
            unassignedOnly: true,
          };
          renderAnomalyDrawer();
          renderSubmissionPicker();
          return;
        }
        const openSubmissionPicker = event.target.closest('[data-action="open-submission-picker"]');
        if (openSubmissionPicker) {
          submissionPicker = {
            targetGroupId: openSubmissionPicker.dataset.groupId,
            selectedPageIds: new Set(),
            query: '',
            unassignedOnly: false,
          };
          renderSubmissionPicker();
          return;
        }
        const closeSubmissionPicker = event.target.closest('[data-action="close-submission-picker"]');
        const clickedSubmissionBackdrop = event.target.classList.contains('submission-picker-backdrop');
        if (closeSubmissionPicker || clickedSubmissionBackdrop) {
          submissionPicker = null;
          renderSubmissionPicker();
          return;
        }
        const selectStudentPages = event.target.closest('[data-action="select-student-pages"]');
        if (selectStudentPages && submissionPicker) {
          allSubmissions
            .filter((page) => page.studentId === selectStudentPages.dataset.studentId && !FxCollectionFlow.pageOwner(groups, page.id))
            .forEach((page) => submissionPicker.selectedPageIds.add(page.id));
          renderSubmissionPicker();
          return;
        }
        const addSelectedSubmissions = event.target.closest('[data-action="add-selected-submissions"]');
        if (addSelectedSubmissions && submissionPicker) {
          const selectedCount = submissionPicker.selectedPageIds.size;
          groups = FxCollectionFlow.addSubmissionPages(groups, submissionPicker.targetGroupId, allSubmissions, [...submissionPicker.selectedPageIds]);
          const anomaly = anomalies.find((item) => item.id === submissionPicker.anomalyId);
          if (anomaly && selectedCount) {
            anomaly.status = 'resolved';
            anomaly.choice = '已补充页面';
          }
          submissionPicker = null;
          formMessage.textContent = `已添加 ${selectedCount} 页学生提交。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const deleteSample = event.target.closest('[data-action="request-delete-sample"]');
        if (deleteSample) {
          const group = findGroup(deleteSample.dataset.groupId);
          if (!group) return;
          pendingSampleDelete = { groupId: group.id, name: FxCollectionFlow.normalizeName(group.name) };
          renderDeleteDialog();
          return;
        }
        const deletePage = event.target.closest('[data-action="request-delete-page"]');
        if (deletePage) {
          const group = findGroup(deletePage.dataset.groupId);
          const pageIndex = group?.pages.findIndex((page) => page.id === deletePage.dataset.pageId) ?? -1;
          if (!group || pageIndex < 0) return;
          const deletedPage = group.pages[pageIndex];
          const groupName = FxCollectionFlow.normalizeName(group.name);
          groups = FxCollectionFlow.removeSamplePage(groups, group.id, deletePage.dataset.pageId);
          draggedPage = null;
          formMessage.textContent = `已删除“${groupName}”第 ${Number(deletedPage.sourcePageNumber) || pageIndex + 1} 页。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const confirmDelete = event.target.closest('[data-action="confirm-delete-sample"]');
        if (confirmDelete && pendingSampleDelete) {
          const deletedName = pendingSampleDelete.name;
          groups = FxCollectionFlow.removeSampleGroup(groups, pendingSampleDelete.groupId);
          pendingSampleDelete = null;
          draggedPage = null;
          formMessage.textContent = `已删除样卷“${deletedName}”。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const cancelDelete = event.target.closest('[data-action="cancel-delete-sample"]');
        const clickedBackdrop = event.target.classList.contains('collection-delete-backdrop');
        if (cancelDelete || clickedBackdrop) {
          pendingSampleDelete = null;
          renderDeleteDialog();
        }
      });

      document.addEventListener('click', (event) => {
        if (readOnly) return;
        if (!event.target.closest('[data-action="add-sample"]')) return;
        const id = `sample-${Date.now()}-${groups.length + 1}`;
        groups.push({ id, name: '未命名样卷', kind: '作业', students: 0, pages: [] });
        formMessage.textContent = '已添加空样卷，可将上方页面拖到新分组中。';
        formMessage.classList.remove('is-error');
        render();
        requestAnimationFrame(() => {
          document.querySelector(`[data-group-id="${id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          document.querySelector(`[data-action="edit-sample-name"][data-group-id="${id}"]`)?.select();
        });
      });

      sampleList.addEventListener('input', (event) => {
        if (readOnly) return;
        const input = event.target.closest('[data-action="edit-sample-name"]');
        if (!input) return;
        const group = findGroup(input.dataset.groupId);
        if (group) group.name = input.value;
      });

      document.addEventListener('input', (event) => {
        const searchInput = event.target.closest('[data-action="search-submissions"]');
        if (!searchInput || !submissionPicker) return;
        submissionPicker.query = searchInput.value;
        renderSubmissionPicker();
        document.querySelector('[data-action="search-submissions"]')?.focus();
      });

      document.addEventListener('change', (event) => {
        const pageToggle = event.target.closest('[data-action="toggle-submission-page"]');
        if (pageToggle && submissionPicker) {
          if (pageToggle.checked) submissionPicker.selectedPageIds.add(pageToggle.dataset.pageId);
          else submissionPicker.selectedPageIds.delete(pageToggle.dataset.pageId);
          renderSubmissionPicker();
          return;
        }
        const unassignedFilter = event.target.closest('[data-action="filter-unassigned-submissions"]');
        if (unassignedFilter && submissionPicker) {
          submissionPicker.unassignedOnly = unassignedFilter.checked;
          renderSubmissionPicker();
        }
      });

      sampleList.addEventListener('change', (event) => {
        if (readOnly) return;
        const kindSelect = event.target.closest('[data-action="change-sample-kind"]');
        if (kindSelect) {
          const group = findGroup(kindSelect.dataset.groupId);
          if (group) group.kind = kindSelect.value;
          return;
        }
        const nameInput = event.target.closest('[data-action="edit-sample-name"]');
        if (!nameInput) return;
        const group = findGroup(nameInput.dataset.groupId);
        if (!group) return;
        group.name = FxCollectionFlow.normalizeName(nameInput.value);
        nameInput.value = group.name;
      });

      sampleList.addEventListener('dragstart', (event) => {
        if (readOnly) return;
        const card = event.target.closest('.scan-card');
        const zone = card?.closest('.pages');
        if (!card || !zone) return;
        draggedPage = { pageId: card.dataset.pageId, groupId: zone.dataset.groupId };
        card.classList.add('is-dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.dataset.pageId);
      });

      sampleList.addEventListener('dragend', (event) => {
        event.target.closest('.scan-card')?.classList.remove('is-dragging');
        document.querySelectorAll('.pages.drag-over').forEach((zone) => zone.classList.remove('drag-over'));
        draggedPage = null;
      });

      sampleList.addEventListener('dragover', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });

      sampleList.addEventListener('dragleave', (event) => {
        const zone = event.target.closest('.pages');
        if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('drag-over');
      });

      sampleList.addEventListener('drop', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        const targetGroup = findGroup(zone.dataset.groupId);
        const targetCard = event.target.closest('.scan-card');
        const moved = FxCollectionFlow.movePage(groups, {
          sourceGroupId: draggedPage.groupId,
          pageId: draggedPage.pageId,
          targetGroupId: zone.dataset.groupId,
          beforePageId: targetCard?.dataset.pageId,
        });
        if (!moved || !targetGroup) return;
        zone.classList.remove('drag-over');
        formMessage.textContent = `已将页面移动到“${FxCollectionFlow.normalizeName(targetGroup.name)}”。`;
        formMessage.classList.remove('is-error');
        draggedPage = null;
        render();
      });

      const confirmCollection = () => {
        const validGroups = FxCollectionFlow.validGroups(groups);
        if (validGroups.length === 0) {
          formMessage.textContent = '当前没有可创建的样卷，请先拖入样卷页面。';
          formMessage.classList.add('is-error');
          return;
        }

        const hasEmptyGroups = validGroups.length !== groups.length;
        if (hasEmptyGroups) {
          formMessage.textContent = '空样卷不会创建任务，正在确认其他样卷…';
          formMessage.classList.remove('is-error');
        }

        const batch = {
          version: 1,
          batchId: `${task}-${Date.now()}`,
          sourceTaskId: task,
          className: taskData.className,
          createdAt: Date.now(),
          groups: validGroups,
          anomalies: anomalies.map((anomaly) => ({ ...anomaly })),
        };
        localStorage.setItem('fxConfirmedCollectionBatch', JSON.stringify(batch));
        historyState = FxCollectionFlow.confirmHistoryRecord(historyState, batch, { title: taskData.title });
        localStorage.setItem('fxCollectionHistoryState', JSON.stringify(historyState));

        const goToList = () => { location.href = 'index.html?collectionCreated=1'; };
        if (hasEmptyGroups) window.setTimeout(goToList, 500);
        else goToList();
      };

      document.getElementById('confirm').addEventListener('click', () => {
        if (readOnly) return;
        if (pendingAnomalies().length) {
          anomalyConfirmOpen = true;
          renderContinueDialog();
          return;
        }
        confirmCollection();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (submissionPicker) {
          submissionPicker = null;
          renderSubmissionPicker();
          return;
        }
        if (anomalyDrawerOpen) {
          anomalyDrawerOpen = false;
          renderAnomalyDrawer();
          return;
        }
        if (anomalyConfirmOpen) {
          anomalyConfirmOpen = false;
          renderContinueDialog();
          return;
        }
        if (!pendingSampleDelete) return;
        pendingSampleDelete = null;
        renderDeleteDialog();
      });

      render();
    })();
  </script>
</body>
</html>
