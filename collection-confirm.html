<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2fb">
  <title>确认采集结果 · 飞象智批</title>
  <style>
    :root {
      --ink: #24345c;
      --muted: #7180a0;
      --line: rgba(103, 119, 158, .16);
      --primary: #5268d6;
      --primary-dark: #2b3f78;
      --paper: #fffdf9;
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(209, 227, 255, .92), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(225, 218, 252, .7), transparent 30%),
        linear-gradient(135deg, #edf3fb 0%, #f8faff 55%, #e9eef9 100%);
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(82, 104, 214, .25);
      outline-offset: 3px;
    }
    .shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 34px 126px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #5068a6;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
    }
    .page-head { margin: 38px 0 22px; }
    .eyebrow {
      margin: 0 0 8px;
      color: #6d7daf;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      letter-spacing: -.035em;
    }
    .scan-notice {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding: 17px 19px;
      border: 1px solid rgba(108, 131, 221, .2);
      border-radius: 18px;
      color: #526180;
      background: linear-gradient(115deg, rgba(255, 255, 255, .88), rgba(238, 242, 255, .82));
      box-shadow: 0 12px 30px rgba(66, 84, 137, .08);
      font-size: 14px;
    }
    .scan-notice::before {
      display: grid;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(145deg, #6f84e8, #8b78da);
      content: "AI";
      font-size: 10px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(91, 105, 196, .25);
    }
    .scan-notice strong { color: #4058bd; font-size: 18px; }
    .sample-list { display: grid; gap: 18px; }
    .sample {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 24px;
      background: rgba(255, 255, 255, .7);
      box-shadow: 0 15px 38px rgba(70, 88, 134, .09);
      backdrop-filter: blur(18px);
    }
    .sample-head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 82px;
      padding: 15px 58px 15px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .52);
    }
    .sample-delete,
    .page-delete {
      position: absolute;
      z-index: 6;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #bd4e59;
      background: #fff0f2;
      box-shadow: 0 7px 16px rgba(156, 60, 70, .13);
      cursor: pointer;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .16s ease, transform .16s ease, background .16s ease;
    }
    .sample-delete { top: 15px; right: 16px; }
    .page-delete { top: 9px; right: 9px; }
    .sample-head:hover .sample-delete,
    .sample-head:focus-within .sample-delete,
    .scan-card:hover .page-delete,
    .scan-card:focus-within .page-delete { opacity: 1; pointer-events: auto; transform: none; }
    .sample-delete:hover,
    .page-delete:hover { color: #fff; background: #ce5661; }
    .scan-card:hover .page-no,
    .scan-card:focus-within .page-no { opacity: 0; }
    .sample-badge {
      flex: 0 0 auto;
      padding: 8px 11px;
      border-radius: 12px;
      color: #5369c8;
      background: #e9edff;
      font-size: 12px;
      font-weight: 850;
    }
    .sample-fields {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
    }
    .kind-field { position: relative; flex: 0 0 auto; }
    .kind-field::after {
      position: absolute;
      top: 50%;
      right: 10px;
      pointer-events: none;
      content: "⌄";
      transform: translateY(-57%);
      color: #4d63be;
      font-size: 12px;
      font-weight: 900;
    }
    .kind-select {
      appearance: none;
      min-width: 74px;
      height: 36px;
      border: 1px solid #cfd8fb;
      border-radius: 10px;
      padding: 0 27px 0 11px;
      color: #465dbb;
      background: #f0f3ff;
      font-size: 13px;
      font-weight: 800;
    }
    .sample-title-input {
      width: min(430px, 100%);
      min-width: 120px;
      height: 39px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
      font-size: 18px;
      font-weight: 820;
    }
    .sample-title-input:hover { border-color: #dbe2f4; background: rgba(255, 255, 255, .72); }
    .sample-title-input:focus { border-color: #9eb0ef; background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(82, 104, 214, .12); }
    .sample-meta {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .hint {
      flex: 0 0 auto;
      color: #7885aa;
      font-size: 12px;
    }
    .pages {
      display: flex;
      min-height: 282px;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: flex-start;
      gap: 14px;
      overflow: visible;
      padding: 20px;
      transition: background .18s ease, box-shadow .18s ease;
    }
    .pages:empty::before {
      display: grid;
      width: 100%;
      min-height: 236px;
      place-items: center;
      border: 1.5px dashed #c9d3ef;
      border-radius: 16px;
      color: #8490ae;
      background: rgba(244, 247, 255, .55);
      content: "将上方样卷页面拖到这里";
      font-size: 13px;
      font-weight: 700;
    }
    .pages.drag-over {
      background: rgba(230, 236, 255, .72);
      box-shadow: inset 0 0 0 2px #7185df;
    }
    .scan-card {
      position: relative;
      width: 202px;
      min-width: 202px;
      min-height: 246px;
      border: 1px solid #dbe2ee;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(63, 78, 112, .08);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .scan-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(63, 78, 112, .14); }
    .scan-card.is-dragging { opacity: .45; transform: rotate(1.5deg) scale(.98); cursor: grabbing; }
    .clip {
      position: absolute;
      top: -4px;
      left: calc(50% - 17px);
      width: 34px;
      height: 7px;
      border-radius: 0 0 7px 7px;
      background: #e8ebf1;
    }
    .page-no {
      position: absolute;
      z-index: 2;
      top: 9px;
      right: 9px;
      padding: 5px 8px;
      border-radius: 9px;
      color: #5970cf;
      background: #edf1ff;
      font-size: 11px;
      font-weight: 850;
    }
    .scan-paper {
      height: 224px;
      padding: 24px 14px;
      color: #5c6174;
      background: repeating-linear-gradient(to bottom, var(--paper) 0, var(--paper) 23px, #eee6db 24px);
      font-family: Georgia, "Songti SC", serif;
    }
    .scan-paper h4 { margin: 0 0 15px; font-size: 12px; font-weight: 500; text-align: center; }
    .scan-paper p { margin: 8px 0; font-size: 10px; }
    .scan-mark { position: absolute; right: 18px; bottom: 14px; color: #e95a60; font-size: 24px; }
    .add-row { display: flex; justify-content: center; padding: 22px 0 8px; }
    .add-sample {
      min-height: 46px;
      border: 1px dashed #aebbe4;
      border-radius: 14px;
      padding: 0 20px;
      color: #4f64bd;
      background: rgba(255, 255, 255, .66);
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(79, 98, 172, .06);
    }
    .add-sample:hover { border-style: solid; background: #fff; transform: translateY(-1px); }
    .sticky {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: 20px;
      left: 20px;
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 14px 34px rgba(73, 91, 139, .17);
      backdrop-filter: blur(18px);
    }
    .form-message { margin: 0 auto 0 0; color: #9a6d29; font-size: 13px; font-weight: 700; }
    .form-message.is-error { color: #c54955; }
    .confirm {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 22px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), #5c70d5);
      box-shadow: 0 10px 24px rgba(55, 74, 143, .24);
      font-size: 15px;
      font-weight: 850;
    }
    .confirm:hover { transform: translateY(-1px); }
    .collection-delete-backdrop {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(30, 39, 70, .32);
      backdrop-filter: blur(7px);
    }
    .collection-delete-dialog {
      width: min(430px, 100%);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 22px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 26px 70px rgba(36, 49, 86, .24);
    }
    .collection-delete-dialog h2 { margin: 0; font-size: 21px; }
    .collection-delete-dialog p { margin: 10px 0 22px; color: var(--muted); line-height: 1.65; }
    .collection-delete-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .collection-delete-actions button { min-height: 42px; border-radius: 12px; padding: 0 16px; font-weight: 800; }
    .collection-delete-cancel { border: 1px solid #dde3f0; color: var(--ink); background: #fff; }
    .collection-delete-confirm { border: 0; color: #fff; background: #c94f5a; }
    body.is-read-only .add-row,
    body.is-read-only .sticky { display: none; }
    .page-head .eyebrow,
    .sample-meta,
    .scan-mark { display: none; }
    body.is-read-only .kind-field::after { display: none; }
    body.is-read-only .kind-select,
    body.is-read-only .sample-title-input { cursor: default; opacity: 1; }
    body.is-read-only .scan-card { cursor: default; }
    body.is-read-only .scan-card:hover { transform: none; }
    @media (max-width: 820px) {
      .shell { padding: 20px 18px 124px; }
      .page-head { margin-top: 30px; }
      .sample-head { flex-wrap: wrap; align-items: flex-start; }
      .sample-fields { width: calc(100% - 88px); flex-wrap: wrap; }
      .sample-title-input { flex: 1; }
      .sample-meta { margin-left: 76px; }
      .hint { display: none; }
      .scan-card { width: calc(50% - 7px); min-width: 150px; }
      .form-message { max-width: 55%; }
    }
    @media (max-width: 520px) {
      .scan-notice { align-items: flex-start; }
      .sample-fields { width: 100%; }
      .sample-meta { width: 100%; margin-left: 0; }
      .pages { padding: 13px; }
      .scan-card { width: 100%; }
      .sticky { right: 10px; bottom: 10px; left: 10px; align-items: stretch; flex-direction: column; }
      .form-message { max-width: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="collection-history.html">← 返回历史采集任务</a>
    <header class="page-head">
      <p class="eyebrow">高扫采集 · 样卷确认</p>
      <h1 class="page-title" id="taskTitle">今天 19:42 · 六年级3班 · 数学</h1>
      <aside class="scan-notice" aria-live="polite">
        <span>本次扫描识别到以下 <strong id="sampleCount">2</strong> 个样卷，确认无误后 AI 开始识别或批改</span>
      </aside>
    </header>

    <div class="sample-list" id="sampleList"></div>
    <div class="add-row">
      <button class="add-sample" type="button" data-action="add-sample">＋ 添加样卷</button>
    </div>
  </main>

  <footer class="sticky">
    <p class="form-message" id="formMessage" role="status"></p>
    <button class="confirm" id="confirm" type="button">确认并开始识别或批改</button>
  </footer>
  <div id="collectionDeleteLayer"></div>

  <script src="collection-flow.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const task = params.get('task') || 'today-1942';
      const readOnly = params.get('mode') === 'view';
      const taskDataMap = {
        'today-1618': {
            title: '今天 16:18 · 六年级1班 · 数学',
            className: '六年级1班 · 数学',
            firstName: '小数运算专项',
            secondName: '几何图形检测',
        },
        'yesterday-1835': {
            title: '昨天 18:35 · 八年级3班 · 数学', className: '八年级3班 · 数学', firstName: '整式乘法练习', secondName: '周末单元检测',
        },
        'yesterday-1206': {
            title: '昨天 12:06 · 六年级2班 · 数学', className: '六年级2班 · 数学', firstName: '小数乘法练习', secondName: '计算能力检测',
        },
        'aug09-1740': {
            title: '8月9日 17:40 · 七年级4班 · 数学', className: '七年级4班 · 数学', firstName: '有理数专项练习', secondName: '第一单元测试',
        },
      };
      const taskData = taskDataMap[task] || {
            title: '今天 19:42 · 六年级3班 · 数学',
            className: '六年级3班 · 数学',
            firstName: '分数乘法练习',
            secondName: '第三单元测试',
      };

      const pageQuestionSets = [
        ['一、分数乘整数', '1. 3/5 × 10 =', '2. 7/12 × 6 =', '二、解决问题', '计算一周阅读页数。'],
        ['一、分数乘分数', '1. 2/3 × 5/8 =', '2. 7/9 × 3/14 =', '二、填空', '积的分子是（ ）。'],
        ['一、简便计算', '1. 5/11 × 22 =', '2. 3/8 × 16/9 =', '二、判断', '乘积一定小于因数。（ ）'],
        ['一、单位换算', '1. 3/4 千米 =（ ）米', '2. 2/5 时 =（ ）分', '二、应用题', '求长方形草地面积。'],
        ['一、连续求积', '1. 4/7 × 7/8 × 2 =', '2. 5/6 × 3 × 2/5 =', '二、看图列式', '写出阴影部分算式。'],
        ['一、估算与比较', '1. 5/6 × 9 ○ 9', '2. 3/7 × 2 ○ 3/7', '二、改错', '找出计算中的错误。'],
        ['一、选择题', '1. 12 的 2/3 是（ ）', '2. 最小的积是（ ）', '二、计算题', '7/15 × 25 ='],
        ['一、基础检测', '1. 9 × 5/18 =', '2. 11/12 × 6/11 =', '二、实际应用', '计算已行驶的路程。'],
        ['一、综合计算', '1. 4/9 × 3/8 =', '2. 7/10 × 15/14 =', '二、列式解答', '求剩余彩带长度。'],
        ['一、图形问题', '1. 长 5/6 米', '2. 宽 3/5 米', '二、求面积', '结果保留最简分数。'],
        ['一、生活数学', '1. 每袋重 3/8 千克', '2. 一共有 12 袋', '二、提出问题', '这些物品共重多少？'],
        ['一、能力提升', '1. 8/15 × 5/12 =', '2. 1 - 3/7 × 7/9 =', '二、开放题', '写出两种解法。'],
      ];

      const makePages = (groupId, title, count, wrongPage, exampleStart = 0) => Array.from({ length: count }, (_, index) => ({
        id: `${groupId}-page-${index + 1}`,
        title,
        mark: index + 1 === wrongPage ? '×' : '√',
        exampleIndex: exampleStart + index,
        content: pageQuestionSets[(exampleStart + index) % pageQuestionSets.length],
      }));

      const defaultGroups = [
        {
          id: 'sample-1',
          name: taskData.firstName,
          kind: '作业',
          students: 31,
          pages: makePages('sample-1', taskData.firstName, 4),
        },
        {
          id: 'sample-2',
          name: taskData.secondName,
          kind: '考试',
          students: 30,
          pages: makePages('sample-2', taskData.secondName, 6, 2, 6),
        },
      ];
      let historyState = FxCollectionFlow.normalizeHistoryState(null);
      try {
        historyState = FxCollectionFlow.normalizeHistoryState(JSON.parse(localStorage.getItem('fxCollectionHistoryState') || 'null'));
      } catch (_) {
        historyState = FxCollectionFlow.normalizeHistoryState(null);
      }
      const savedRecord = historyState.records[task];
      let groups = readOnly && Array.isArray(savedRecord?.groups)
        ? JSON.parse(JSON.stringify(savedRecord.groups))
        : defaultGroups;
      let draggedPage = null;
      let pendingDelete = null;

      const sampleList = document.getElementById('sampleList');
      let sampleCount = document.getElementById('sampleCount');
      const formMessage = document.getElementById('formMessage');
      const collectionDeleteLayer = document.getElementById('collectionDeleteLayer');
      document.getElementById('taskTitle').textContent = taskData.title;
      if (readOnly) {
        document.body.classList.add('is-read-only');
        document.querySelector('.eyebrow').textContent = '高扫采集 · 查看结果';
        document.querySelector('.scan-notice span').innerHTML = `本采集任务已确认，共识别 <strong id="sampleCount">${groups.length}</strong> 个样卷；仅支持查看，不能修改`;
        sampleCount = document.getElementById('sampleCount');
      }

      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      })[character]);

      const renderPage = (page, pageIndex, groupName, groupId) => {
        const groupOffset = groupId === 'sample-2' ? 6 : 0;
        const exampleIndex = Number.isInteger(page.exampleIndex) ? page.exampleIndex : groupOffset + pageIndex;
        const content = Array.isArray(page.content) ? page.content : pageQuestionSets[exampleIndex % pageQuestionSets.length];
        return `
        <article class="scan-card" draggable="${readOnly ? 'false' : 'true'}" data-page-id="${escapeHtml(page.id)}">
          ${readOnly ? '' : `<button class="page-delete" type="button" data-action="request-delete-page" data-group-id="${escapeHtml(groupId)}" data-page-id="${escapeHtml(page.id)}" aria-label="删除${escapeHtml(groupName)}第${pageIndex + 1}页">×</button>`}
          <i class="clip" aria-hidden="true"></i>
          <b class="page-no">${pageIndex + 1}</b>
          <div class="scan-paper">
            <h4>${escapeHtml(groupName)} · 第${pageIndex + 1}页</h4>
            ${content.map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
          </div>
          <span class="scan-mark">${page.mark}</span>
        </article>`;
      };

      const renderGroup = (group, index) => `
        <section class="sample" data-group-id="${group.id}">
          <div class="sample-head">
            ${readOnly ? '' : `<button class="sample-delete" type="button" data-action="request-delete-sample" data-group-id="${escapeHtml(group.id)}" aria-label="删除样卷${escapeHtml(group.name)}">×</button>`}
            <span class="sample-badge">样卷 ${index + 1}</span>
            <div class="sample-fields">
              <label class="kind-field">
                <span class="sr-only" hidden>样卷类型</span>
                <select class="kind-select" data-action="change-sample-kind" data-group-id="${group.id}" aria-label="样卷 ${index + 1} 类型" ${readOnly ? 'disabled' : ''}>
                  <option value="作业" ${group.kind === '作业' ? 'selected' : ''}>作业</option>
                  <option value="考试" ${group.kind === '考试' ? 'selected' : ''}>考试</option>
                </select>
              </label>
              <input class="sample-title-input" data-action="edit-sample-name" data-group-id="${group.id}" aria-label="样卷 ${index + 1} 名称" value="${escapeHtml(group.name)}" ${readOnly ? 'disabled' : ''}>
            </div>
            <span class="sample-meta" data-role="sample-meta">${group.students ? `${group.students}人 · ` : ''}${group.pages.length}页</span>
            <span class="hint">${readOnly ? '已确认，仅支持查看' : '拖动页面调整顺序或归属'}</span>
          </div>
          <div class="pages" data-group-id="${group.id}">${group.pages.map((page, pageIndex) => renderPage(page, pageIndex, group.name, group.id)).join('')}</div>
        </section>`;

      const renderDeleteDialog = () => {
        if (!pendingDelete || readOnly) {
          collectionDeleteLayer.innerHTML = '';
          return;
        }
        const removesSample = pendingDelete.type === 'sample';
        collectionDeleteLayer.innerHTML = `<div class="collection-delete-backdrop" data-action="cancel-delete-collection-item">
          <section class="collection-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="collection-delete-title">
            <h2 id="collection-delete-title">${removesSample ? '确认删除整个样卷？' : '确认删除这一页？'}</h2>
            <p>${removesSample
              ? `删除“${escapeHtml(pendingDelete.name)}”后，其中全部页面也会一起删除。`
              : `将删除“${escapeHtml(pendingDelete.name)}”的第 ${pendingDelete.pageNumber} 页。`}</p>
            <div class="collection-delete-actions">
              <button class="collection-delete-cancel" type="button" data-action="cancel-delete-collection-item">取消</button>
              <button class="collection-delete-confirm" type="button" data-action="confirm-delete-collection-item">确认删除</button>
            </div>
          </section>
        </div>`;
      };

      const updateCount = () => {
        sampleCount.textContent = String(groups.filter((group) => group.pages.length > 0).length);
      };

      const render = () => {
        sampleList.innerHTML = groups.map(renderGroup).join('');
        updateCount();
        renderDeleteDialog();
      };

      const findGroup = (groupId) => groups.find((group) => group.id === groupId);

      document.addEventListener('click', (event) => {
        if (readOnly) return;
        const deleteSample = event.target.closest('[data-action="request-delete-sample"]');
        if (deleteSample) {
          const group = findGroup(deleteSample.dataset.groupId);
          if (!group) return;
          pendingDelete = { type: 'sample', groupId: group.id, name: FxCollectionFlow.normalizeName(group.name) };
          renderDeleteDialog();
          return;
        }
        const deletePage = event.target.closest('[data-action="request-delete-page"]');
        if (deletePage) {
          const group = findGroup(deletePage.dataset.groupId);
          const pageIndex = group?.pages.findIndex((page) => page.id === deletePage.dataset.pageId) ?? -1;
          if (!group || pageIndex < 0) return;
          pendingDelete = {
            type: 'page',
            groupId: group.id,
            pageId: deletePage.dataset.pageId,
            pageNumber: pageIndex + 1,
            name: FxCollectionFlow.normalizeName(group.name),
          };
          renderDeleteDialog();
          return;
        }
        const cancelDelete = event.target.closest('[data-action="cancel-delete-collection-item"]');
        if (cancelDelete) {
          if (event.target !== cancelDelete && cancelDelete.classList.contains('collection-delete-backdrop')) return;
          pendingDelete = null;
          renderDeleteDialog();
          return;
        }
        if (!event.target.closest('[data-action="confirm-delete-collection-item"]') || !pendingDelete) return;
        const message = pendingDelete.type === 'sample'
          ? `已删除样卷“${pendingDelete.name}”。`
          : `已删除“${pendingDelete.name}”第 ${pendingDelete.pageNumber} 页。`;
        groups = pendingDelete.type === 'sample'
          ? FxCollectionFlow.removeSampleGroup(groups, pendingDelete.groupId)
          : FxCollectionFlow.removeSamplePage(groups, pendingDelete.groupId, pendingDelete.pageId);
        pendingDelete = null;
        draggedPage = null;
        formMessage.textContent = message;
        formMessage.classList.remove('is-error');
        render();
      });

      document.addEventListener('click', (event) => {
        if (readOnly) return;
        if (!event.target.closest('[data-action="add-sample"]')) return;
        const id = `sample-${Date.now()}-${groups.length + 1}`;
        groups.push({ id, name: '未命名样卷', kind: '作业', students: 0, pages: [] });
        formMessage.textContent = '已添加空样卷，可将上方页面拖到新分组中。';
        formMessage.classList.remove('is-error');
        render();
        requestAnimationFrame(() => {
          document.querySelector(`[data-group-id="${id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          document.querySelector(`[data-action="edit-sample-name"][data-group-id="${id}"]`)?.select();
        });
      });

      sampleList.addEventListener('input', (event) => {
        if (readOnly) return;
        const input = event.target.closest('[data-action="edit-sample-name"]');
        if (!input) return;
        const group = findGroup(input.dataset.groupId);
        if (group) group.name = input.value;
      });

      sampleList.addEventListener('change', (event) => {
        if (readOnly) return;
        const kindSelect = event.target.closest('[data-action="change-sample-kind"]');
        if (kindSelect) {
          const group = findGroup(kindSelect.dataset.groupId);
          if (group) group.kind = kindSelect.value;
          return;
        }
        const nameInput = event.target.closest('[data-action="edit-sample-name"]');
        if (!nameInput) return;
        const group = findGroup(nameInput.dataset.groupId);
        if (!group) return;
        group.name = FxCollectionFlow.normalizeName(nameInput.value);
        nameInput.value = group.name;
      });

      sampleList.addEventListener('dragstart', (event) => {
        if (readOnly) return;
        const card = event.target.closest('.scan-card');
        const zone = card?.closest('.pages');
        if (!card || !zone) return;
        draggedPage = { pageId: card.dataset.pageId, groupId: zone.dataset.groupId };
        card.classList.add('is-dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.dataset.pageId);
      });

      sampleList.addEventListener('dragend', (event) => {
        event.target.closest('.scan-card')?.classList.remove('is-dragging');
        document.querySelectorAll('.pages.drag-over').forEach((zone) => zone.classList.remove('drag-over'));
        draggedPage = null;
      });

      sampleList.addEventListener('dragover', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });

      sampleList.addEventListener('dragleave', (event) => {
        const zone = event.target.closest('.pages');
        if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('drag-over');
      });

      sampleList.addEventListener('drop', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        const targetGroup = findGroup(zone.dataset.groupId);
        const targetCard = event.target.closest('.scan-card');
        const moved = FxCollectionFlow.movePage(groups, {
          sourceGroupId: draggedPage.groupId,
          pageId: draggedPage.pageId,
          targetGroupId: zone.dataset.groupId,
          beforePageId: targetCard?.dataset.pageId,
        });
        if (!moved || !targetGroup) return;
        zone.classList.remove('drag-over');
        formMessage.textContent = `已将页面移动到“${FxCollectionFlow.normalizeName(targetGroup.name)}”。`;
        formMessage.classList.remove('is-error');
        draggedPage = null;
        render();
      });

      document.getElementById('confirm').addEventListener('click', () => {
        if (readOnly) return;
        const validGroups = FxCollectionFlow.validGroups(groups);
        if (validGroups.length === 0) {
          formMessage.textContent = '当前没有可创建的样卷，请先拖入样卷页面。';
          formMessage.classList.add('is-error');
          return;
        }

        const hasEmptyGroups = validGroups.length !== groups.length;
        if (hasEmptyGroups) {
          formMessage.textContent = '空样卷不会创建任务，正在确认其他样卷…';
          formMessage.classList.remove('is-error');
        }

        const batch = {
          version: 1,
          batchId: `${task}-${Date.now()}`,
          sourceTaskId: task,
          className: taskData.className,
          createdAt: Date.now(),
          groups: validGroups,
        };
        localStorage.setItem('fxConfirmedCollectionBatch', JSON.stringify(batch));
        historyState = FxCollectionFlow.confirmHistoryRecord(historyState, batch, { title: taskData.title });
        localStorage.setItem('fxCollectionHistoryState', JSON.stringify(historyState));

        const goToList = () => { location.href = 'index.html?collectionCreated=1'; };
        if (hasEmptyGroups) window.setTimeout(goToList, 500);
        else goToList();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || !pendingDelete) return;
        pendingDelete = null;
        renderDeleteDialog();
      });

      render();
    })();
  </script>
</body>
</html>
