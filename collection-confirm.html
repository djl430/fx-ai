<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2fb">
  <title>确认采集结果 · 飞象智批</title>
  <style>
    :root {
      --ink: #24345c;
      --muted: #7180a0;
      --line: rgba(103, 119, 158, .16);
      --primary: #5268d6;
      --primary-dark: #2b3f78;
      --paper: #fffdf9;
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(209, 227, 255, .92), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(225, 218, 252, .7), transparent 30%),
        linear-gradient(135deg, #edf3fb 0%, #f8faff 55%, #e9eef9 100%);
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(82, 104, 214, .25);
      outline-offset: 3px;
    }
    .shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 28px 82px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #5068a6;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }
    .page-head { margin: 22px 0 14px; }
    .eyebrow {
      margin: 0 0 8px;
      color: #6d7daf;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(24px, 2.4vw, 30px);
      letter-spacing: -.035em;
    }
    .scan-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #526180;
      font-size: 13px;
    }
    .notice-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 12px;
      margin-top: 12px;
    }
    .notice-actions__right { display: flex; align-items: flex-end; flex-direction: column; gap: 8px; }
    .scan-notice strong { color: #4058bd; font-size: 16px; }
    .sample-list { display: grid; gap: 12px; }
    .sample-list[hidden] { display: none; }
    .sample-drag-hint { margin: 10px 2px 8px; color: #7885aa; font-size: 11px; text-align: right; }
    .sample-drag-hint[hidden] { display: none; }
    .sample {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 18px;
      background: rgba(255, 255, 255, .7);
      box-shadow: 0 15px 38px rgba(70, 88, 134, .09);
      backdrop-filter: blur(18px);
    }
    .sample-head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
      padding: 10px 48px 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .52);
    }
    .sample-delete,
    .page-delete {
      position: absolute;
      z-index: 6;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #bd4e59;
      background: #fff0f2;
      box-shadow: 0 7px 16px rgba(156, 60, 70, .13);
      cursor: pointer;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .16s ease, transform .16s ease, background .16s ease;
    }
    .sample-delete { top: 10px; right: 12px; }
    .page-delete { top: 9px; right: 9px; }
    .sample-head:hover .sample-delete,
    .sample-head:focus-within .sample-delete,
    .scan-card:hover .page-delete,
    .scan-card:focus-within .page-delete { opacity: 1; pointer-events: auto; transform: none; }
    .sample-delete:hover,
    .page-delete:hover { color: #fff; background: #ce5661; }
    .sample-badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 10px;
      color: #5369c8;
      background: #e9edff;
      font-size: 12px;
      font-weight: 850;
    }
    .sample-fields {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 7px;
    }
    .kind-field { position: relative; flex: 0 0 auto; }
    .kind-field::after {
      position: absolute;
      top: 50%;
      right: 10px;
      pointer-events: none;
      content: "⌄";
      transform: translateY(-57%);
      color: #4d63be;
      font-size: 12px;
      font-weight: 900;
    }
    .kind-select {
      appearance: none;
      min-width: 74px;
      height: 32px;
      border: 1px solid #cfd8fb;
      border-radius: 10px;
      padding: 0 27px 0 11px;
      color: #465dbb;
      background: #f0f3ff;
      font-size: 12px;
      font-weight: 800;
    }
    .sample-title-input {
      width: min(430px, 100%);
      min-width: 120px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
      font-size: 16px;
      font-weight: 820;
    }
    .sample-title-input:hover { border-color: #dbe2f4; background: rgba(255, 255, 255, .72); }
    .sample-title-input:focus { border-color: #9eb0ef; background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(82, 104, 214, .12); }
    .sample-meta {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .sample-anomaly-tags { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
    .sample-anomaly-tags button { min-height: 28px; border: 1px solid #edc98e; border-radius: 999px; padding: 0 10px; color: #a56716; background: #fff7e8; font-size: 11px; font-weight: 820; }
    .sample-anomaly-tags button:hover { border-color: #d99e43; color: #8a510a; background: #ffefcf; }
    .hint {
      flex: 0 0 auto;
      color: #7885aa;
      font-size: 11px;
    }
    .pages {
      display: flex;
      min-height: 216px;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: flex-start;
      gap: 10px;
      overflow: visible;
      padding: 13px;
      transition: background .18s ease, box-shadow .18s ease;
    }
    .pages.is-empty::before {
      display: grid;
      min-width: 240px;
      min-height: 188px;
      flex: 1;
      place-items: center;
      border: 1.5px dashed #c9d3ef;
      border-radius: 16px;
      color: #8490ae;
      background: rgba(244, 247, 255, .55);
      content: "将上方样卷页面拖到这里";
      font-size: 12px;
      font-weight: 700;
    }
    .pages.drag-over {
      background: rgba(230, 236, 255, .72);
      box-shadow: inset 0 0 0 2px #7185df;
    }
    .scan-card {
      position: relative;
      width: 172px;
      min-width: 172px;
      min-height: 202px;
      border: 1px solid #dbe2ee;
      border-radius: 10px;
      padding: 8px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(63, 78, 112, .08);
      cursor: grab;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .scan-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(63, 78, 112, .14); }
    .scan-card.is-dragging { opacity: .45; transform: rotate(1.5deg) scale(.98); cursor: grabbing; }
    .clip {
      position: absolute;
      top: -4px;
      left: calc(50% - 15px);
      width: 30px;
      height: 6px;
      border-radius: 0 0 7px 7px;
      background: #e8ebf1;
    }
    .scan-paper {
      position: relative;
      height: 184px;
      padding: 18px 11px 28px;
      color: #5c6174;
      background: repeating-linear-gradient(to bottom, var(--paper) 0, var(--paper) 19px, #eee6db 20px);
      font-family: Georgia, "Songti SC", serif;
    }
    .scan-paper h4 { margin: 0 0 10px; font-size: 11px; font-weight: 500; text-align: center; }
    .scan-paper p { margin: 6px 0; font-size: 9px; }
    .paper-page-number {
      position: absolute;
      right: 0;
      bottom: 7px;
      left: 0;
      color: #8a8f9d;
      font-size: 9px;
      text-align: center;
    }
    .scan-mark { position: absolute; right: 18px; bottom: 14px; color: #e95a60; font-size: 24px; }
    .add-sample {
      min-height: 38px;
      border: 1px solid #c6d0fa;
      border-radius: 12px;
      padding: 0 20px;
      color: #4f64bd;
      background: rgba(255, 255, 255, .66);
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(79, 98, 172, .06);
    }
    .add-sample:hover { background: #fff; transform: translateY(-1px); }
    .anomaly-summary { display: flex; align-items: center; justify-content: flex-end; gap: 8px; color: #7b5c2d; font-size: 12px; font-weight: 750; text-align: right; }
    .anomaly-summary[hidden] { display: none; }
    .anomaly-summary strong { color: #bd7417; font-size: 14px; }
    .anomaly-summary button { min-height: 30px; border: 1px solid #eccb9b; border-radius: 9px; padding: 0 10px; color: #a66714; background: #fffaf2; font-weight: 800; }
    .anomaly-review[hidden] { display: none; }
    .anomaly-review { overflow: hidden; border: 1px solid rgba(255,255,255,.92); border-radius: 22px; background: rgba(255,255,255,.76); box-shadow: 0 18px 48px rgba(62,81,132,.12); }
    .anomaly-workspace { display: grid; min-height: 690px; grid-template-columns: 240px minmax(420px, 1fr) 292px; }
    .anomaly-workspace.is-missing { grid-template-columns: 240px minmax(420px, 1fr); }
    .anomaly-student-rail { padding: 14px; border-right: 1px solid var(--line); background: rgba(246,248,253,.72); }
    .anomaly-student-rail h3 { margin: 0 4px 10px; color: #74809d; font-size: 11px; letter-spacing: .08em; }
    .anomaly-sample-nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; border-bottom: 1px solid var(--line); background: rgba(248,250,255,.8); scrollbar-width: thin; }
    .anomaly-sample-card { display: grid; width: 230px; min-width: 230px; grid-template-columns: minmax(0,1fr) auto; gap: 4px 8px; border: 1px solid #dce2ef; border-radius: 12px; padding: 10px 11px; color: #4e5c7d; background: #fff; text-align: left; }
    .anomaly-sample-card:hover { border-color: #bdc8ef; }
    .anomaly-sample-card.is-active { border-color: #8fa2ec; color: #30468e; background: #edf1ff; box-shadow: inset 3px 0 0 #5268d6; }
    .anomaly-sample-card strong { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .anomaly-sample-card span { grid-row: 1; grid-column: 2; align-self: center; color: #a66c1c; font-size: 11px; font-weight: 850; }
    .anomaly-sample-card small { color: #8490a9; font-size: 10px; }
    .anomaly-student-card { display: grid; width: 100%; grid-template-columns: 1fr auto; gap: 5px 8px; margin-bottom: 8px; border: 1px solid transparent; border-radius: 13px; padding: 12px; color: var(--ink); background: transparent; text-align: left; }
    .anomaly-student-card:hover { background: #fff; }
    .anomaly-student-card.is-active { border-color: #aab9f2; background: #edf1ff; box-shadow: inset 3px 0 0 #5268d6; }
    .anomaly-student-card.is-resolved { color: #63708a; }
    .anomaly-student-card strong { font-size: 13px; }
    .anomaly-student-card small { grid-column: 1; color: #bd7417; font-size: 11px; font-weight: 800; }
    .anomaly-student-card.is-resolved small { color: #2c8a64; }
    .anomaly-student-card i { grid-row: 1 / 3; grid-column: 2; align-self: center; color: #7a88a5; font-style: normal; font-size: 13px; }
    .anomaly-viewer { min-width: 0; padding: 16px 18px 24px; background: #f1f4fa; }
    .anomaly-page-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0 12px; }
    .anomaly-page-tabs button { min-width: 42px; min-height: 30px; border: 1px solid #d8dfec; border-radius: 9px; color: #65718d; background: #fff; font-size: 11px; font-weight: 800; }
    .anomaly-page-tabs button.is-active { border-color: #5268d6; color: #fff; background: #5268d6; }
    .anomaly-page-tabs .is-missing { border-style: dashed; color: #b87319; background: #fff8eb; }
    .missing-rescan-inline { align-self: center; color: #a66a17; font-size: 12px; font-weight: 800; }
    .anomaly-document-viewer { display: grid; min-height: 586px; place-items: start center; overflow: auto; border: 1px solid #dce2ed; border-radius: 16px; padding: 20px; background: #e7ebf3; }
    .student-document { position: relative; width: min(520px, 100%); min-height: 700px; padding: 42px 48px 64px; color: #41485a; background: repeating-linear-gradient(to bottom,#fffdf9 0,#fffdf9 31px,#eee8de 32px); box-shadow: 0 15px 35px rgba(48,59,89,.15); font-family: Georgia,"Songti SC",serif; }
    .student-document h3 { margin: 0 0 8px; color: #2f3546; font-size: 22px; text-align: center; }
    .student-document-meta { display: flex; justify-content: space-between; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid #d8d2c8; color: #646b7d; font-size: 12px; }
    .student-document-line { min-height: 31px; margin: 0; font-size: 14px; line-height: 31px; }
    .student-document-answer { display: inline-block; margin-left: 12px; color: #35548b; font-family:"Kaiti SC","STKaiti",serif; font-size: 16px; transform: rotate(-1deg); }
    .student-document-page { position: absolute; right: 0; bottom: 22px; left: 0; color: #8b8f9c; font-size: 12px; text-align: center; }
    .missing-document { display: grid; width: min(520px,100%); min-height: 700px; place-items: center; border: 2px dashed #ddb976; color: #98661d; background: #fffaf0; text-align: center; }
    .missing-document strong { display: block; margin-bottom: 8px; font-size: 21px; }
    .missing-document span { font-size: 13px; }
    .anomaly-decision { padding: 18px; border-left: 1px solid var(--line); background: #fff; }
    .anomaly-type { display: inline-flex; min-height: 26px; align-items: center; border-radius: 999px; padding: 0 9px; color: #9d6820; background: #fff3dd; font-size: 11px; font-weight: 850; }
    .anomaly-decision h3 { margin: 14px 0 7px; font-size: 18px; }
    .anomaly-decision p { margin: 0; color: #6d7893; font-size: 12px; line-height: 1.65; }
    .anomaly-actions { display: grid; gap: 8px; margin-top: 20px; }
    .anomaly-actions button { min-height: 40px; border: 1px solid #d8dfed; border-radius: 11px; color: #46577f; background: #fff; font-size: 12px; font-weight: 820; }
    .anomaly-actions button:first-child { border-color: transparent; color: #fff; background: #5268d6; }
    .anomaly-actions button:disabled { cursor: not-allowed; opacity: .45; }
    .owner-picker { margin-top: 18px; }
    .owner-search { width: 100%; height: 38px; border: 1px solid #d8dfed; border-radius: 10px; padding: 0 11px; color: var(--ink); background: #fff; font-size: 12px; }
    .owner-group { margin-top: 14px; }
    .owner-group h4 { margin: 0 0 7px; color: #7885a0; font-size: 11px; }
    .owner-all-students summary { color: #7885a0; cursor: pointer; font-size: 11px; font-weight: 800; list-style-position: inside; }
    .owner-all-students[open] summary { margin-bottom: 7px; }
    .owner-options { display: flex; max-height: 126px; flex-wrap: wrap; gap: 6px; overflow-y: auto; }
    .owner-option { min-height: 30px; border: 1px solid #dce2ef; border-radius: 9px; padding: 0 9px; color: #52617e; background: #fff; font-size: 11px; }
    .owner-option.is-recommended { border-color: #edc98e; color: #9a6419; background: #fff7e8; }
    .owner-option.is-selected { border-color: #5268d6; color: #fff; background: #5268d6; }
    .owner-empty { color: #8a94a8; font-size: 11px; }
    .anomaly-resolved { margin-top: 20px; padding: 14px; border-radius: 12px; color: #247a59; background: #eaf8f1; font-size: 13px; font-weight: 800; }
    .sticky {
      position: fixed;
      z-index: 20;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 14px 34px rgba(73, 91, 139, .17);
      backdrop-filter: blur(18px);
    }
    .form-message { margin: 0 auto 0 0; color: #9a6d29; font-size: 13px; font-weight: 700; }
    .form-message.is-error { color: #c54955; }
    .confirm {
      min-height: 40px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-dark), #5c70d5);
      box-shadow: 0 10px 24px rgba(55, 74, 143, .24);
      font-size: 14px;
      font-weight: 850;
    }
    .confirm:hover { transform: translateY(-1px); }
    .confirm:disabled { cursor: not-allowed; opacity: .52; transform: none; }
    .footer-secondary { min-height: 40px; border: 1px solid #dbe1ef; border-radius: 12px; padding: 0 16px; color: #53617d; background: #fff; font-size: 13px; font-weight: 800; }
    .footer-secondary[hidden] { display: none; }
    .collection-delete-backdrop {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(30, 39, 70, .32);
      backdrop-filter: blur(7px);
    }
    .collection-delete-dialog {
      width: min(430px, 100%);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 22px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 26px 70px rgba(36, 49, 86, .24);
    }
    .collection-delete-dialog h2 { margin: 0; font-size: 21px; }
    .collection-delete-dialog p { margin: 10px 0 22px; color: var(--muted); line-height: 1.65; }
    .collection-delete-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .collection-delete-actions button { min-height: 42px; border-radius: 12px; padding: 0 16px; font-weight: 800; }
    .collection-delete-cancel { border: 1px solid #dde3f0; color: var(--ink); background: #fff; }
    .collection-delete-confirm { border: 0; color: #fff; background: #c94f5a; }
    .submission-picker-trigger {
      flex: 0 0 auto;
      min-height: 30px;
      border: 1px solid #cfd8fb;
      border-radius: 9px;
      padding: 0 9px;
      color: #4b61bb;
      background: #f4f6ff;
      font-size: 11px;
      font-weight: 800;
    }
    .submission-picker-trigger:hover { color: #fff; background: #5c70d5; }
    .submission-picker-card {
      width: 104px;
      min-width: 104px;
      min-height: 202px;
      align-self: stretch;
      border-style: dashed;
      border-radius: 12px;
      color: #5268d6;
      background: rgba(247, 249, 255, .72);
      font-size: 14px;
    }
    .submission-picker-backdrop {
      position: fixed;
      z-index: 70;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(30, 39, 70, .38);
      backdrop-filter: blur(7px);
    }
    .submission-picker-dialog {
      display: grid;
      width: min(920px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 20px;
      background: #fbfcff;
      box-shadow: 0 26px 70px rgba(36, 49, 86, .28);
    }
    .submission-picker-head,
    .submission-picker-actions,
    .submission-picker-foot { display: flex; align-items: center; gap: 12px; }
    .submission-picker-head { justify-content: space-between; padding: 16px 18px 10px; }
    .submission-picker-head h2 { margin: 0; font-size: 18px; }
    .submission-picker-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .submission-picker-close { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 9px; color: #64708e; background: #eef1fa; font-size: 19px; }
    .submission-picker-actions { justify-content: space-between; padding: 10px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .submission-picker-search { width: min(280px, 100%); height: 34px; border: 1px solid #d9e0f1; border-radius: 9px; padding: 0 10px; color: var(--ink); background: #fff; font-size: 12px; }
    .submission-picker-filter { display: inline-flex; align-items: center; gap: 6px; color: #5c6988; font-size: 12px; font-weight: 700; }
    .submission-picker-list { overflow: auto; padding: 12px 18px 18px; }
    .submission-student { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .submission-student:last-child { border-bottom: 0; }
    .submission-student-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .submission-student-head strong { font-size: 14px; }
    .submission-student-head button { min-height: 28px; border: 1px solid #d3dcfb; border-radius: 8px; padding: 0 8px; color: #4b61bb; background: #f7f8ff; font-size: 11px; font-weight: 800; }
    .submission-page-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .submission-page-option { position: relative; display: grid; width: 128px; min-height: 86px; grid-template-columns: 17px 1fr; gap: 6px; align-items: start; border: 1px solid #dde4f1; border-radius: 10px; padding: 8px; color: #4b5675; background: #fffefb; font-size: 11px; line-height: 1.45; }
    .submission-page-option input { margin: 2px 0 0; accent-color: #596ed2; }
    .submission-page-option strong, .submission-page-option small { display: block; }
    .submission-page-option small { margin-top: 4px; color: #7c87a0; }
    .submission-page-option.is-owned { color: #8a7191; background: #f4f1f7; }
    .submission-page-option.is-owned small { color: #9a6d75; }
    .submission-picker-empty { padding: 36px 0; color: var(--muted); text-align: center; font-size: 13px; }
    .submission-picker-foot { justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: #fff; }
    .submission-picker-foot button { min-height: 36px; border-radius: 10px; padding: 0 13px; font-weight: 800; }
    .submission-picker-cancel { border: 1px solid #dce3f0; color: var(--ink); background: #fff; }
    .submission-picker-add { border: 0; color: #fff; background: #5268d6; }
    .submission-picker-add:disabled { cursor: not-allowed; opacity: .45; }
    body.is-read-only .notice-actions .add-sample,
    body.is-read-only .sticky { display: none; }
    .page-head .eyebrow,
    .sample-meta,
    .scan-mark { display: none; }
    body.is-read-only .kind-field::after { display: none; }
    body.is-read-only .kind-select,
    body.is-read-only .sample-title-input { cursor: default; opacity: 1; }
    body.is-read-only .scan-card { cursor: default; }
    body.is-read-only .scan-card:hover { transform: none; }
    @media (max-width: 820px) {
      .shell { padding: 20px 18px 124px; }
      .page-head { margin-top: 30px; }
      .sample-head { flex-wrap: wrap; align-items: flex-start; }
      .sample-fields { width: calc(100% - 88px); flex-wrap: wrap; }
      .sample-title-input { flex: 1; }
      .sample-meta { margin-left: 76px; }
      .hint { display: none; }
      .scan-card { width: calc(50% - 7px); min-width: 150px; }
      .form-message { max-width: 55%; }
      .anomaly-workspace { grid-template-columns: 170px minmax(360px,1fr); }
      .anomaly-workspace.is-missing { grid-template-columns: 170px minmax(360px,1fr); }
      .anomaly-decision { grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
    }
    @media (max-width: 520px) {
      .notice-actions { grid-template-columns: 1fr; }
      .notice-actions__right { align-items: flex-start; }
      .anomaly-summary { justify-content: flex-start; text-align: left; }
      .scan-notice { align-items: flex-start; }
      .sample-fields { width: 100%; }
      .sample-meta { width: 100%; margin-left: 0; }
      .pages { padding: 13px; }
      .scan-card { width: 100%; }
      .sticky { right: 10px; bottom: 10px; left: 10px; align-items: stretch; flex-direction: column; }
      .form-message { max-width: none; }
      .anomaly-workspace { display: block; }
      .anomaly-student-rail { border-right: 0; border-bottom: 1px solid var(--line); }
      .anomaly-student-card { display: inline-grid; width: calc(50% - 6px); margin-right: 6px; vertical-align: top; }
      .student-document { min-height: 590px; padding: 34px 28px 58px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="collection-history.html">← 返回历史采集任务</a>
    <header class="page-head">
      <p class="eyebrow">高扫采集 · 样卷确认</p>
      <h1 class="page-title" id="taskTitle">今天 19:42 · 六年级3班 · 数学</h1>
      <div class="notice-actions">
        <aside class="scan-notice" aria-live="polite">
          <span>本次扫描识别到以下 <strong id="sampleCount">2</strong> 个样卷，确认无误后 AI 开始分析</span>
        </aside>
        <div class="notice-actions__right">
          <button class="add-sample" type="button" data-action="add-sample">添加样卷</button>
          <div class="anomaly-summary" id="anomalySummary" hidden></div>
        </div>
      </div>
    </header>

    <p class="sample-drag-hint" id="sampleDragHint">拖动页面调整顺序或归属</p>
    <div class="sample-list" id="sampleList"></div>
    <section class="anomaly-review" id="anomalyReview" hidden></section>
  </main>

  <footer class="sticky">
    <p class="form-message" id="formMessage" role="status"></p>
    <button class="footer-secondary" id="backToSamples" type="button" data-action="back-to-samples" hidden>返回修改样卷</button>
    <button class="confirm" id="confirm" type="button">确认无误并开始分析</button>
  </footer>
  <div id="collectionDeleteLayer"></div>
  <div id="collectionSubmissionLayer"></div>

  <script src="collection-flow.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const task = params.get('task') || 'today-2026';
      const readOnly = params.get('mode') === 'view';
      const taskDataMap = {
        'today-2026': {
            title: '今天 20:26 · 六年级2班 · 数学',
            className: '六年级2班 · 数学',
            firstName: '分数除法基础练习',
            secondName: '圆的认识随堂测',
            hasAnomalies: false,
        },
        'today-1618': {
            title: '今天 16:18 · 六年级1班 · 数学',
            className: '六年级1班 · 数学',
            firstName: '小数运算专项',
            secondName: '几何图形检测',
        },
        'yesterday-1835': {
            title: '昨天 18:35 · 八年级3班 · 数学', className: '八年级3班 · 数学', firstName: '整式乘法练习', secondName: '周末单元检测',
        },
        'yesterday-1206': {
            title: '昨天 12:06 · 六年级2班 · 数学', className: '六年级2班 · 数学', firstName: '小数乘法练习', secondName: '计算能力检测',
        },
        'aug09-1740': {
            title: '8月9日 17:40 · 七年级4班 · 数学', className: '七年级4班 · 数学', firstName: '有理数专项练习', secondName: '第一单元测试',
        },
      };
      const taskData = taskDataMap[task] || {
            title: '今天 19:42 · 六年级3班 · 数学',
            className: '六年级3班 · 数学',
            firstName: '分数乘法练习',
            secondName: '第三单元测试',
            hasAnomalies: true,
      };

      const paperTemplates = {
        homework: [
          { sourcePageNumber: 1, content: ['一、计算题', '1. 3/5 × 10 =', '2. 7/12 × 6 =', '3. 2/3 × 5/8 ='] },
          { sourcePageNumber: 2, content: ['4. 简便计算', '（1）5/11 × 22', '（2）3/8 × 16/9', '5. 比较积的大小'] },
          { sourcePageNumber: 3, content: ['二、解决问题', '6. 计算一周阅读页数。', '7. 求长方形草地面积。'] },
          { sourcePageNumber: 4, content: ['三、综合应用', '8. 求剩余彩带长度。', '9. 写出两种解法。'] },
        ],
        exam: [
          { sourcePageNumber: 1, content: ['一、选择题', '1. 判断图形的对称轴。', '2. 选择正确的展开图。', '3. 比较两个图形周长。'] },
          { sourcePageNumber: 2, content: ['二、填空题', '4. 三角形内角和是（ ）。', '5. 填写面积计算结果。', '6. 写出合适的单位。'] },
          { sourcePageNumber: 3, content: ['三、计算题', '7. 求阴影部分面积。', '8. 计算组合图形周长。'] },
          { sourcePageNumber: 4, content: ['四、作图题', '9. 画出平移后的图形。', '10. 补全轴对称图形。'] },
          { sourcePageNumber: 5, content: ['五、解答题', '11. 设计教室铺砖方案。', '12. 比较两种方案费用。'] },
          { sourcePageNumber: 6, content: ['六、拓展题', '13. 求未知图形面积。', '14. 说明你的推理方法。'] },
        ],
      };

      const makePages = (groupId, paperTitle, templates, wrongPage, studentId, studentName) => templates.map((template, index) => ({
        id: `${groupId}-page-${index + 1}`,
        studentId,
        studentName,
        paperTitle,
        sourcePageNumber: template.sourcePageNumber,
        content: [...template.content],
        mark: index + 1 === wrongPage ? '×' : '√',
      }));

      const defaultGroups = [
        {
          id: 'sample-1',
          name: taskData.firstName,
          kind: '作业',
          students: 31,
          pages: makePages('sample-1', taskData.firstName, paperTemplates.homework, null, 'student-zhang', '张小凡'),
        },
        {
          id: 'sample-2',
          name: taskData.secondName,
          kind: '考试',
          students: 30,
          pages: makePages('sample-2', taskData.secondName, paperTemplates.exam, 2, 'student-li', '李思雨'),
        },
      ];
      const allSubmissions = [
        ...defaultGroups.flatMap((group) => group.pages),
        ...makePages('submission-wang', taskData.firstName, paperTemplates.homework.slice(0, 3), null, 'student-wang', '王晓宇'),
        ...makePages('submission-chen', taskData.secondName, paperTemplates.exam.slice(0, 2), null, 'student-chen', '陈子涵'),
      ];
      const makeStudentPreviewPages = (prefix, paperTitle, studentName, templates) => templates.map((template, index) => ({
        id: `${prefix}-preview-${index + 1}`,
        paperTitle,
        studentName,
        sourcePageNumber: Number(template.sourcePageNumber) || index + 1,
        content: [...template.content],
      }));
      const classStudents = ['张小明', '李华', '王芳', '王凡', '陈子涵', '陈梓涵', '赵敏', '周雨桐', '孙晨', '刘洋', '林悦', '郭航'];
      const identifiedStudentsByGroup = {
        'sample-1': ['张小明', '李华', '陈子涵', '陈梓涵', '赵敏', '周雨桐', '孙晨', '刘洋', '林悦', '郭航'],
        'sample-2': ['张小明', '李华', '王芳', '王凡', '赵敏', '周雨桐', '孙晨', '刘洋', '林悦', '郭航'],
      };
      let historyState = FxCollectionFlow.normalizeHistoryState(null);
      try {
        historyState = FxCollectionFlow.normalizeHistoryState(JSON.parse(localStorage.getItem('fxCollectionHistoryState') || 'null'));
      } catch (_) {
        historyState = FxCollectionFlow.normalizeHistoryState(null);
      }
      const savedRecord = historyState.records[task];
      let groups = readOnly && Array.isArray(savedRecord?.groups)
        ? JSON.parse(JSON.stringify(savedRecord.groups))
        : defaultGroups;
      const anomalySeeds = [
        {
          id: 'missing-zhang', groupId: 'sample-1', type: '缺页', student: '张小明',
          detail: '该样卷应提交 4 页，当前只有 3 页，缺少第 2 页。',
          note: '请先查看现有页面是否属于同一位学生，再确认按缺页提交处理。',
          missingPageNumbers: [2], status: 'pending',
          pages: makeStudentPreviewPages('missing-zhang', taskData.firstName, '张小明', [paperTemplates.homework[0], paperTemplates.homework[2], paperTemplates.homework[3]]),
        },
        {
          id: 'identity-wang-1', groupId: 'sample-1', type: '未识别学生', student: '未识别',
          detail: '这张纸的姓名区域识别不清，请选择所属学生。', status: 'pending',
          pages: makeStudentPreviewPages('identity-wang-1', taskData.firstName, '未识别', [paperTemplates.homework[1]]),
        },
        {
          id: 'identity-wang-2', groupId: 'sample-1', type: '未识别学生', student: '未识别',
          detail: '这张纸未识别到学生信息，请选择所属学生。', status: 'pending',
          pages: makeStudentPreviewPages('identity-wang-2', taskData.firstName, '未识别', [paperTemplates.homework[3]]),
        },
        {
          id: 'missing-li', groupId: 'sample-2', type: '缺页', student: '李华',
          detail: '该样卷应提交 6 页，当前只有 5 页，缺少第 4 页。',
          note: '请先核对其余五页属于同一位学生，再确认按缺页提交处理。',
          missingPageNumbers: [4], status: 'pending',
          pages: makeStudentPreviewPages('missing-li', taskData.secondName, '李华', paperTemplates.exam.filter((page) => page.sourcePageNumber !== 4)),
        },
        {
          id: 'identity-chen-1', groupId: 'sample-2', type: '未识别学生', student: '未识别',
          detail: '这张纸的姓名区域被涂改，请选择所属学生。', status: 'pending',
          pages: makeStudentPreviewPages('identity-chen-1', taskData.secondName, '未识别', [paperTemplates.exam[2]]),
        },
        {
          id: 'identity-chen-2', groupId: 'sample-2', type: '未识别学生', student: '未识别',
          detail: '这张纸未识别到学生信息，请选择所属学生。', status: 'pending',
          pages: makeStudentPreviewPages('identity-chen-2', taskData.secondName, '未识别', [paperTemplates.exam[5]]),
        },
      ];
      const defaultAnomalies = taskData.hasAnomalies ? anomalySeeds : [];
      let anomalies = readOnly && Array.isArray(savedRecord?.anomalies)
        ? JSON.parse(JSON.stringify(savedRecord.anomalies))
        : JSON.parse(JSON.stringify(defaultAnomalies));
      anomalies = FxCollectionFlow.supportedCollectionAnomalies(anomalies);
      const draftKey = FxCollectionFlow.collectionDraftKey(task);
      if (!readOnly && params.get('resumeCollection') === '1') {
        try {
          const restoredDraft = FxCollectionFlow.normalizeCollectionDraft(JSON.parse(localStorage.getItem(draftKey) || 'null'), task);
          if (restoredDraft) {
            groups = restoredDraft.groups;
            anomalies = restoredDraft.anomalies;
          }
        } catch (_) {}
      }
      let draggedPage = null;
      let pendingSampleDelete = null;
      let submissionPicker = null;
      let ownershipSearch = '';
      let selectedOwnershipStudent = '';
      let stage = 'samples';
      let selectedAnomalyGroupId = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies)[0]?.groupId || '';
      let selectedAnomalyId = anomalies.find((anomaly) => anomaly.status !== 'resolved')?.id || anomalies[0]?.id || '';
      let selectedAnomalyPageId = anomalies[0]?.pages?.[0]?.id || '';

      const sampleList = document.getElementById('sampleList');
      const sampleDragHint = document.getElementById('sampleDragHint');
      const pageHead = document.querySelector('.page-head');
      let sampleCount = document.getElementById('sampleCount');
      const formMessage = document.getElementById('formMessage');
      const collectionDeleteLayer = document.getElementById('collectionDeleteLayer');
      const collectionSubmissionLayer = document.getElementById('collectionSubmissionLayer');
      const anomalySummary = document.getElementById('anomalySummary');
      const anomalyReview = document.getElementById('anomalyReview');
      const confirmButton = document.getElementById('confirm');
      const backToSamples = document.getElementById('backToSamples');
      document.getElementById('taskTitle').textContent = taskData.title;
      if (readOnly) {
        document.body.classList.add('is-read-only');
        document.querySelector('.eyebrow').textContent = '高扫采集 · 查看结果';
        document.querySelector('.scan-notice span').innerHTML = `本采集任务已确认，共识别 <strong id="sampleCount">${groups.length}</strong> 个样卷；仅支持查看，不能修改`;
        sampleCount = document.getElementById('sampleCount');
      }

      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      })[character]);

      const renderPage = (page, pageIndex, groupName, groupId) => {
        const sourcePageNumber = Number(page.sourcePageNumber) || pageIndex + 1;
        const paperTitle = page.paperTitle || groupName;
        const content = Array.isArray(page.content) ? page.content : ['扫描页内容待识别'];
        return `
        <article class="scan-card" draggable="${readOnly ? 'false' : 'true'}" data-page-id="${escapeHtml(page.id)}">
          ${readOnly ? '' : `<button class="page-delete" type="button" data-action="request-delete-page" data-group-id="${escapeHtml(groupId)}" data-page-id="${escapeHtml(page.id)}" aria-label="删除${escapeHtml(groupName)}第${sourcePageNumber}页">×</button>`}
          <i class="clip" aria-hidden="true"></i>
          <div class="scan-paper">
            <h4>${escapeHtml(paperTitle)}</h4>
            ${content.map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
            <footer class="paper-page-number">第 ${sourcePageNumber} 页</footer>
          </div>
          <span class="scan-mark">${page.mark}</span>
        </article>`;
      };

      const pendingAnomalies = () => FxCollectionFlow.blockingCollectionAnomalies(anomalies);

      const saveCollectionDraft = () => {
        localStorage.setItem(draftKey, JSON.stringify({
          version: 1,
          taskId: task,
          taskData,
          groups,
          anomalies,
          updatedAt: Date.now(),
        }));
      };

      const openIndependentAnomalyPage = (anomalyId = '') => {
        saveCollectionDraft();
        const focusQuery = anomalyId ? `&focus=${encodeURIComponent(anomalyId)}` : '';
        location.href = `collection-anomalies.html?task=${encodeURIComponent(task)}${focusQuery}`;
      };

      const resetOwnershipSelection = () => {
        ownershipSearch = '';
        selectedOwnershipStudent = '';
      };

      const renderGroup = (group, index) => {
        const anomalyCounts = FxCollectionFlow.summarizeCollectionAnomalies(anomalies, group.id);
        const anomalyTags = readOnly ? '' : [
          anomalyCounts.missingStudents
            ? `<button type="button" data-action="open-sample-anomaly" data-group-id="${escapeHtml(group.id)}" data-anomaly-type="缺页">缺页 ${anomalyCounts.missingStudents} 人</button>`
            : '',
          anomalyCounts.unrecognizedPages
            ? `<button type="button" data-action="open-sample-anomaly" data-group-id="${escapeHtml(group.id)}" data-anomaly-type="未识别学生">未识别 ${anomalyCounts.unrecognizedPages} 页</button>`
            : '',
        ].filter(Boolean).join('');
        return `<section class="sample" data-group-id="${group.id}">
          <div class="sample-head">
            ${readOnly ? '' : `<button class="sample-delete" type="button" data-action="request-delete-sample" data-group-id="${escapeHtml(group.id)}" aria-label="删除样卷${escapeHtml(group.name)}">×</button>`}
            <span class="sample-badge">样卷 ${index + 1}</span>
            <div class="sample-fields">
              <label class="kind-field">
                <span class="sr-only" hidden>样卷类型</span>
                <select class="kind-select" data-action="change-sample-kind" data-group-id="${group.id}" aria-label="样卷 ${index + 1} 类型" ${readOnly ? 'disabled' : ''}>
                  <option value="作业" ${group.kind === '作业' ? 'selected' : ''}>作业</option>
                  <option value="考试" ${group.kind === '考试' ? 'selected' : ''}>考试</option>
                </select>
              </label>
              <input class="sample-title-input" data-action="edit-sample-name" data-group-id="${group.id}" aria-label="样卷 ${index + 1} 名称" value="${escapeHtml(group.name)}" ${readOnly ? 'disabled' : ''}>
            </div>
            ${anomalyTags ? `<div class="sample-anomaly-tags" aria-label="待处理提交异常">${anomalyTags}</div>` : ''}
            <span class="sample-meta" data-role="sample-meta">${group.students ? `${group.students}人 · ` : ''}${group.pages.length}页</span>
          </div>
          <div class="pages ${group.pages.length ? '' : 'is-empty'}" data-group-id="${group.id}">${group.pages.map((page, pageIndex) => renderPage(page, pageIndex, group.name, group.id)).join('')}${readOnly ? '' : `<button class="submission-picker-trigger submission-picker-card" type="button" data-action="open-submission-picker" data-group-id="${escapeHtml(group.id)}">＋ 添加</button>`}</div>
        </section>`;
      };

      const renderDeleteDialog = () => {
        if (!pendingSampleDelete || readOnly) {
          collectionDeleteLayer.innerHTML = '';
          return;
        }
        collectionDeleteLayer.innerHTML = `<div class="collection-delete-backdrop">
          <section class="collection-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="collection-delete-title">
            <h2 id="collection-delete-title">确认删除整个样卷？</h2>
            <p>删除“${escapeHtml(pendingSampleDelete.name)}”后，其中全部页面也会一起删除。</p>
            <div class="collection-delete-actions">
              <button class="collection-delete-cancel" type="button" data-action="cancel-delete-sample">取消</button>
              <button class="collection-delete-confirm" type="button" data-action="confirm-delete-sample">确认删除</button>
            </div>
          </section>
        </div>`;
      };

      const renderAnomalySummary = () => {
        if (!readOnly || !anomalies.length || stage === 'anomalies') {
          anomalySummary.hidden = true;
          anomalySummary.innerHTML = '';
          return;
        }
        const anomalyGroups = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies);
        anomalySummary.hidden = false;
        anomalySummary.innerHTML = `<span>本次采集异常 <strong id="anomalyCount">${anomalies.length}</strong> 人 · ${anomalyGroups.length} 份样卷</span><button type="button" data-action="view-anomalies">查看</button>`;
      };

      const anomalyPageOptions = (anomaly) => {
        const pages = Array.isArray(anomaly?.pages) ? anomaly.pages : [];
        const missingPages = (Array.isArray(anomaly?.missingPageNumbers) ? anomaly.missingPageNumbers : []).map((pageNumber) => ({
          id: `missing-page-${pageNumber}`,
          sourcePageNumber: pageNumber,
          missing: true,
        }));
        return [...pages, ...missingPages].sort((left, right) => Number(left.sourcePageNumber) - Number(right.sourcePageNumber));
      };

      const renderStudentDocument = (anomaly, page) => {
        if (!page || page.missing) {
          return `<div class="missing-document"><div><strong>缺少第 ${Number(page?.sourcePageNumber) || 1} 页</strong><span>本次扫描中未找到这一页</span></div></div>`;
        }
        const content = Array.isArray(page.content) ? page.content : ['扫描页面内容'];
        return `<article class="student-document">
          <h3>${escapeHtml(page.paperTitle || taskData.firstName)}</h3>
          <div class="student-document-meta"><span>姓名：${escapeHtml(anomaly.student)}</span><span>${escapeHtml(taskData.className)}</span></div>
          ${content.map((line, index) => `<p class="student-document-line">${escapeHtml(line)}${/^\d|^（/.test(line) ? `<span class="student-document-answer">${['12', '5/6', '24 cm²', '答：符合题意'][index % 4]}</span>` : ''}</p>`).join('')}
          <footer class="student-document-page">第 ${Number(page.sourcePageNumber) || 1} 页</footer>
        </article>`;
      };

      const renderOwnerOptions = (students, recommended = false) => students.length
        ? students.map((student) => `<button class="owner-option ${recommended ? 'is-recommended' : ''} ${selectedOwnershipStudent === student ? 'is-selected' : ''}" type="button" data-action="select-owner-student" data-student-name="${escapeHtml(student)}" aria-pressed="${selectedOwnershipStudent === student}">${escapeHtml(student)}</button>`).join('')
        : '<span class="owner-empty">暂无匹配学生</span>';

      const renderAnomalyActions = (anomaly) => {
        if (anomaly.type === '缺页') return '';
        if (readOnly || anomaly.status === 'resolved') {
          return `<div class="anomaly-resolved">${anomaly.status === 'resolved' ? `已处理${anomaly.choice ? ` · ${escapeHtml(anomaly.choice)}` : ''}` : '待处理'}</div>`;
        }
        const alreadyIdentified = new Set([
          ...(identifiedStudentsByGroup[anomaly.groupId] || []),
          ...anomalies.filter((item) => item.groupId === anomaly.groupId && item.status === 'resolved' && item.choice).map((item) => item.choice),
        ]);
        const query = ownershipSearch.trim();
        const recommended = classStudents.filter((student) => !alreadyIdentified.has(student) && (!query || student.includes(query)));
        const allStudents = classStudents.filter((student) => !query || student.includes(query));
        return `<div class="owner-picker">
          <input class="owner-search" type="search" value="${escapeHtml(ownershipSearch)}" placeholder="搜索学生姓名" data-action="search-owner-students" aria-label="搜索学生姓名">
          <section class="owner-group"><h4>优先推荐 · 当前样卷未识别到作业</h4><div class="owner-options">${renderOwnerOptions(recommended, true)}</div></section>
          <details class="owner-group owner-all-students" ${query ? 'open' : ''}><summary>全部学生</summary><div class="owner-options">${renderOwnerOptions(allStudents)}</div></details>
          <div class="anomaly-actions"><button type="button" data-action="resolve-anomaly" data-anomaly-id="${anomaly.id}" data-choice="${escapeHtml(selectedOwnershipStudent)}" ${selectedOwnershipStudent ? '' : 'disabled'}>确认归属给${selectedOwnershipStudent ? ` ${escapeHtml(selectedOwnershipStudent)}` : '所选学生'}</button></div>
        </div>`;
      };

      const renderAnomalyReview = () => {
        if (stage !== 'anomalies' || !anomalies.length) {
          anomalyReview.hidden = true;
          anomalyReview.innerHTML = '';
          return;
        }
        anomalyReview.hidden = false;
        const anomalyGroups = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies);
        const selectedGroup = anomalyGroups.find((group) => group.groupId === selectedAnomalyGroupId) || anomalyGroups[0];
        if (!selectedGroup) return;
        selectedAnomalyGroupId = selectedGroup.groupId;
        const selected = selectedGroup.anomalies.find((anomaly) => anomaly.id === selectedAnomalyId)
          || selectedGroup.anomalies.find((anomaly) => anomaly.status !== 'resolved')
          || selectedGroup.anomalies[0];
        selectedAnomalyId = selected.id;
        const pageOptions = anomalyPageOptions(selected);
        if (!pageOptions.some((page) => page.id === selectedAnomalyPageId)) selectedAnomalyPageId = pageOptions[0]?.id || '';
        const selectedPage = pageOptions.find((page) => page.id === selectedAnomalyPageId) || pageOptions[0];
        anomalyReview.innerHTML = `<nav class="anomaly-sample-nav" aria-label="异常样卷">${anomalyGroups.map((group) => {
          const blockingCount = group.anomalies.filter((anomaly) => anomaly.type === '未识别学生' && anomaly.status !== 'resolved').length;
          const hasMissing = group.anomalies.some((anomaly) => anomaly.type === '缺页');
          const statusCopy = blockingCount ? `${blockingCount} 页待归属` : (hasMissing ? '仅缺页提示' : '已完成归属');
          return `<button class="anomaly-sample-card ${group.groupId === selectedGroup.groupId ? 'is-active' : ''}" type="button" data-action="select-anomaly-sample" data-group-id="${escapeHtml(group.groupId)}"><strong>${escapeHtml(group.name)}</strong><span>${group.anomalies.length} 项异常</span><small>${statusCopy}</small></button>`;
        }).join('')}</nav>
        <div class="anomaly-workspace ${selected.type === '缺页' ? 'is-missing' : ''}">
          <aside class="anomaly-student-rail">
            <h3>当前样卷异常</h3>
            <nav aria-label="当前样卷异常">${selectedGroup.anomalies.map((anomaly) => {
              const identityIndex = selectedGroup.anomalies.filter((item) => item.type === '未识别学生').indexOf(anomaly) + 1;
              const itemName = anomaly.type === '未识别学生' ? `未识别页面 ${identityIndex}` : anomaly.student;
              return `<button class="anomaly-student-card ${anomaly.id === selected.id ? 'is-active' : ''} ${anomaly.status === 'resolved' ? 'is-resolved' : ''}" type="button" data-action="select-anomaly-student" data-anomaly-id="${anomaly.id}"><strong>${escapeHtml(itemName)}</strong><small>${anomaly.status === 'resolved' ? `已归属 · ${escapeHtml(anomaly.choice || anomaly.student)}` : escapeHtml(anomaly.type)}</small><i>›</i></button>`;
            }).join('')}</nav>
          </aside>
          <section class="anomaly-viewer">
            ${selected.type === '未识别学生' ? '' : `<div class="anomaly-page-tabs">${pageOptions.map((page) => `<button class="${page.id === selectedPage?.id ? 'is-active' : ''} ${page.missing ? 'is-missing' : ''}" type="button" data-action="select-anomaly-page" data-page-id="${page.id}">${page.missing ? '缺' : ''}第${page.sourcePageNumber}页</button>${page.missing ? '<span class="missing-rescan-inline">请重新扫描缺失页面</span>' : ''}`).join('')}</div>`}
            <div class="anomaly-document-viewer">${renderStudentDocument(selected, selectedPage)}</div>
          </section>
          ${selected.type === '缺页' ? '' : `<aside class="anomaly-decision"><span class="anomaly-type">${escapeHtml(selected.type)}</span><h3>${escapeHtml(selected.student)}</h3><p>${escapeHtml(selected.detail)}</p>${renderAnomalyActions(selected)}</aside>`}
        </div>`;
      };

      const submissionOwnerLabel = (pageId) => {
        const owner = FxCollectionFlow.pageOwner(groups, pageId);
        if (!owner) return '';
        const index = groups.findIndex((group) => group.id === owner.id) + 1;
        return `已添加至样卷 ${index}`;
      };

      const renderSubmissionPicker = () => {
        if (!submissionPicker || readOnly) {
          collectionSubmissionLayer.innerHTML = '';
          return;
        }
        const targetGroup = findGroup(submissionPicker.targetGroupId);
        if (!targetGroup) {
          submissionPicker = null;
          collectionSubmissionLayer.innerHTML = '';
          return;
        }
        const query = submissionPicker.query.trim();
        const students = [];
        allSubmissions.forEach((page) => {
          let student = students.find((item) => item.id === page.studentId);
          if (!student) {
            student = { id: page.studentId, name: page.studentName, pages: [] };
            students.push(student);
          }
          student.pages.push(page);
        });
        const studentCards = students.map((student) => {
          if (query && !student.name.includes(query)) return '';
          const pages = student.pages.filter((page) => !submissionPicker.unassignedOnly || !FxCollectionFlow.pageOwner(groups, page.id));
          if (!pages.length) return '';
          const selectable = pages.filter((page) => !FxCollectionFlow.pageOwner(groups, page.id));
          return `<section class="submission-student">
            <header class="submission-student-head">
              <strong>${escapeHtml(student.name)} · ${student.pages.length} 页</strong>
              ${selectable.length ? `<button type="button" data-action="select-student-pages" data-student-id="${escapeHtml(student.id)}">全选本次可添加页面</button>` : '<span class="hint">全部页面已归属</span>'}
            </header>
            <div class="submission-page-list">${pages.map((page) => {
              const ownerLabel = submissionOwnerLabel(page.id);
              const owned = Boolean(ownerLabel);
              return `<label class="submission-page-option ${owned ? 'is-owned' : ''}">
                <input type="checkbox" data-action="toggle-submission-page" data-page-id="${escapeHtml(page.id)}" ${owned ? 'disabled' : ''} ${submissionPicker.selectedPageIds.has(page.id) ? 'checked' : ''}>
                <span><strong>第 ${page.sourcePageNumber} 页</strong><span>${escapeHtml(page.content[0] || page.paperTitle)}</span><small>${owned ? ownerLabel : '可添加'}</small></span>
              </label>`;
            }).join('')}</div>
          </section>`;
        }).join('');
        const selectedCount = submissionPicker.selectedPageIds.size;
        collectionSubmissionLayer.innerHTML = `<div class="submission-picker-backdrop">
          <section class="submission-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="submission-picker-title">
            <header class="submission-picker-head">
              <div><h2 id="submission-picker-title">从全部提交中添加</h2><p>添加到“${escapeHtml(FxCollectionFlow.normalizeName(targetGroup.name))}”</p></div>
              <button class="submission-picker-close" type="button" aria-label="关闭" data-action="close-submission-picker">×</button>
            </header>
            <div class="submission-picker-actions">
              <input class="submission-picker-search" type="search" data-action="search-submissions" value="${escapeHtml(submissionPicker.query)}" placeholder="搜索学生姓名">
              <label class="submission-picker-filter"><input type="checkbox" data-action="filter-unassigned-submissions" ${submissionPicker.unassignedOnly ? 'checked' : ''}>仅看未归属页面</label>
            </div>
            <div class="submission-picker-list">${studentCards || '<p class="submission-picker-empty">没有符合条件的学生提交。</p>'}</div>
            <footer class="submission-picker-foot">
              <button class="submission-picker-cancel" type="button" data-action="close-submission-picker">取消</button>
              <button class="submission-picker-add" type="button" data-action="add-selected-submissions" ${selectedCount ? '' : 'disabled'}>添加已选页面（${selectedCount}）</button>
            </footer>
          </section>
        </div>`;
      };

      const updateCount = () => {
        sampleCount.textContent = String(groups.filter((group) => group.pages.length > 0).length);
      };

      const renderWorkflowState = () => {
        const pendingCount = pendingAnomalies().length;
        sampleList.hidden = stage === 'anomalies';
        sampleDragHint.hidden = readOnly || stage === 'anomalies';
        pageHead.hidden = stage === 'anomalies';
        formMessage.hidden = stage === 'anomalies';
        backToSamples.hidden = stage !== 'anomalies' || readOnly;
        document.querySelector('[data-action="add-sample"]').hidden = stage === 'anomalies';
        const notice = document.querySelector('.scan-notice span');
        if (!readOnly) {
          notice.innerHTML = stage === 'anomalies'
            ? `已确认 <strong>${groups.filter((group) => group.pages.length).length}</strong> 个样卷，请逐一预览并处理异常学生作业`
            : `本次扫描识别到以下 <strong id="sampleCount">${groups.filter((group) => group.pages.length).length}</strong> 个样卷，确认无误后 AI 开始分析`;
          sampleCount = document.getElementById('sampleCount');
        }
        if (stage === 'anomalies') {
          confirmButton.disabled = pendingCount > 0;
          confirmButton.textContent = '确认无误并开始分析';
          return;
        }
        confirmButton.disabled = false;
        confirmButton.textContent = '确认无误并开始分析';
      };

      const render = () => {
        sampleList.innerHTML = groups.map(renderGroup).join('');
        updateCount();
        renderAnomalySummary();
        renderDeleteDialog();
        renderSubmissionPicker();
        renderAnomalyReview();
        renderWorkflowState();
      };

      const findGroup = (groupId) => groups.find((group) => group.id === groupId);

      document.addEventListener('click', (event) => {
        const openSampleAnomaly = event.target.closest('[data-action="open-sample-anomaly"]');
        if (openSampleAnomaly && !readOnly) {
          const targetGroupId = openSampleAnomaly.dataset.groupId;
          const targetType = openSampleAnomaly.dataset.anomalyType;
          const targetGroup = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies)
            .find((group) => group.groupId === targetGroupId);
          const targetAnomaly = targetGroup?.anomalies.find((anomaly) => anomaly.type === targetType && anomaly.status !== 'resolved');
          if (!targetAnomaly) return;
          openIndependentAnomalyPage(targetAnomaly.id);
          return;
        }
        const viewAnomalies = event.target.closest('[data-action="view-anomalies"]');
        if (viewAnomalies) {
          openIndependentAnomalyPage();
          return;
        }
        const selectAnomalySample = event.target.closest('[data-action="select-anomaly-sample"]');
        if (selectAnomalySample) {
          selectedAnomalyGroupId = selectAnomalySample.dataset.groupId;
          const selectedGroup = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies)
            .find((group) => group.groupId === selectedAnomalyGroupId);
          const nextAnomaly = FxCollectionFlow.blockingCollectionAnomalies(selectedGroup?.anomalies)[0] || selectedGroup?.anomalies[0];
          selectedAnomalyId = nextAnomaly?.id || '';
          selectedAnomalyPageId = anomalyPageOptions(nextAnomaly)[0]?.id || '';
          resetOwnershipSelection();
          renderAnomalyReview();
          return;
        }
        const selectAnomalyStudent = event.target.closest('[data-action="select-anomaly-student"]');
        if (selectAnomalyStudent) {
          selectedAnomalyId = selectAnomalyStudent.dataset.anomalyId;
          const selected = anomalies.find((anomaly) => anomaly.id === selectedAnomalyId);
          selectedAnomalyPageId = anomalyPageOptions(selected)[0]?.id || '';
          resetOwnershipSelection();
          renderAnomalyReview();
          return;
        }
        const selectAnomalyPage = event.target.closest('[data-action="select-anomaly-page"]');
        if (selectAnomalyPage) {
          selectedAnomalyPageId = selectAnomalyPage.dataset.pageId;
          renderAnomalyReview();
          return;
        }
        const backToSampleStage = event.target.closest('[data-action="back-to-samples"]');
        if (backToSampleStage) {
          stage = 'samples';
          anomalies = JSON.parse(JSON.stringify(defaultAnomalies));
          const firstGroup = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies)[0];
          const firstAnomaly = firstGroup?.anomalies[0];
          selectedAnomalyGroupId = firstGroup?.groupId || '';
          selectedAnomalyId = firstAnomaly?.id || '';
          selectedAnomalyPageId = anomalyPageOptions(firstAnomaly)[0]?.id || '';
          resetOwnershipSelection();
          formMessage.textContent = '已返回样卷编辑；再次确认样卷后，异常处理结果将重新计算。';
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        if (readOnly) return;
        const selectOwnerStudent = event.target.closest('[data-action="select-owner-student"]');
        if (selectOwnerStudent) {
          selectedOwnershipStudent = selectOwnerStudent.dataset.studentName;
          renderAnomalyReview();
          return;
        }
        const resolveAnomaly = event.target.closest('[data-action="resolve-anomaly"]');
        if (resolveAnomaly) {
          const anomaly = anomalies.find((item) => item.id === resolveAnomaly.dataset.anomalyId);
          if (!anomaly) return;
          anomalies = FxCollectionFlow.resolveCollectionAnomaly(anomalies, anomaly.id, resolveAnomaly.dataset.choice);
          resetOwnershipSelection();
          formMessage.textContent = `已处理${anomaly.student}的${anomaly.type}异常。`;
          formMessage.classList.remove('is-error');
          const anomalyGroups = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies);
          const currentGroup = anomalyGroups.find((group) => group.groupId === selectedAnomalyGroupId);
          const currentGroupPending = FxCollectionFlow.blockingCollectionAnomalies(currentGroup?.anomalies)[0];
          const nextGroup = anomalyGroups.find((group) => group.groupId !== selectedAnomalyGroupId
            && FxCollectionFlow.blockingCollectionAnomalies(group.anomalies).length);
          const nextAnomaly = currentGroupPending || FxCollectionFlow.blockingCollectionAnomalies(nextGroup?.anomalies)[0];
          if (nextAnomaly) {
            selectedAnomalyGroupId = currentGroupPending ? selectedAnomalyGroupId : nextGroup.groupId;
            selectedAnomalyId = nextAnomaly.id;
            selectedAnomalyPageId = anomalyPageOptions(nextAnomaly)[0]?.id || '';
          } else {
            selectedAnomalyId = anomaly.id;
          }
          render();
          return;
        }
        const openSubmissionPicker = event.target.closest('[data-action="open-submission-picker"]');
        if (openSubmissionPicker) {
          submissionPicker = {
            targetGroupId: openSubmissionPicker.dataset.groupId,
            selectedPageIds: new Set(),
            query: '',
            unassignedOnly: false,
          };
          renderSubmissionPicker();
          return;
        }
        const closeSubmissionPicker = event.target.closest('[data-action="close-submission-picker"]');
        const clickedSubmissionBackdrop = event.target.classList.contains('submission-picker-backdrop');
        if (closeSubmissionPicker || clickedSubmissionBackdrop) {
          submissionPicker = null;
          renderSubmissionPicker();
          return;
        }
        const selectStudentPages = event.target.closest('[data-action="select-student-pages"]');
        if (selectStudentPages && submissionPicker) {
          allSubmissions
            .filter((page) => page.studentId === selectStudentPages.dataset.studentId && !FxCollectionFlow.pageOwner(groups, page.id))
            .forEach((page) => submissionPicker.selectedPageIds.add(page.id));
          renderSubmissionPicker();
          return;
        }
        const addSelectedSubmissions = event.target.closest('[data-action="add-selected-submissions"]');
        if (addSelectedSubmissions && submissionPicker) {
          const selectedCount = submissionPicker.selectedPageIds.size;
          groups = FxCollectionFlow.addSubmissionPages(groups, submissionPicker.targetGroupId, allSubmissions, [...submissionPicker.selectedPageIds]);
          submissionPicker = null;
          formMessage.textContent = `已添加 ${selectedCount} 页学生提交。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const deleteSample = event.target.closest('[data-action="request-delete-sample"]');
        if (deleteSample) {
          const group = findGroup(deleteSample.dataset.groupId);
          if (!group) return;
          pendingSampleDelete = { groupId: group.id, name: FxCollectionFlow.normalizeName(group.name) };
          renderDeleteDialog();
          return;
        }
        const deletePage = event.target.closest('[data-action="request-delete-page"]');
        if (deletePage) {
          const group = findGroup(deletePage.dataset.groupId);
          const pageIndex = group?.pages.findIndex((page) => page.id === deletePage.dataset.pageId) ?? -1;
          if (!group || pageIndex < 0) return;
          const deletedPage = group.pages[pageIndex];
          const groupName = FxCollectionFlow.normalizeName(group.name);
          groups = FxCollectionFlow.removeSamplePage(groups, group.id, deletePage.dataset.pageId);
          draggedPage = null;
          formMessage.textContent = `已删除“${groupName}”第 ${Number(deletedPage.sourcePageNumber) || pageIndex + 1} 页。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const confirmDelete = event.target.closest('[data-action="confirm-delete-sample"]');
        if (confirmDelete && pendingSampleDelete) {
          const deletedName = pendingSampleDelete.name;
          groups = FxCollectionFlow.removeSampleGroup(groups, pendingSampleDelete.groupId);
          pendingSampleDelete = null;
          draggedPage = null;
          formMessage.textContent = `已删除样卷“${deletedName}”。`;
          formMessage.classList.remove('is-error');
          render();
          return;
        }
        const cancelDelete = event.target.closest('[data-action="cancel-delete-sample"]');
        const clickedBackdrop = event.target.classList.contains('collection-delete-backdrop');
        if (cancelDelete || clickedBackdrop) {
          pendingSampleDelete = null;
          renderDeleteDialog();
        }
      });

      document.addEventListener('click', (event) => {
        if (readOnly) return;
        if (!event.target.closest('[data-action="add-sample"]')) return;
        const id = `sample-${Date.now()}-${groups.length + 1}`;
        groups.push({ id, name: '未命名样卷', kind: '作业', students: 0, pages: [] });
        formMessage.textContent = '已添加空样卷，可将上方页面拖到新分组中。';
        formMessage.classList.remove('is-error');
        render();
        requestAnimationFrame(() => {
          document.querySelector(`[data-group-id="${id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          document.querySelector(`[data-action="edit-sample-name"][data-group-id="${id}"]`)?.select();
        });
      });

      sampleList.addEventListener('input', (event) => {
        if (readOnly) return;
        const input = event.target.closest('[data-action="edit-sample-name"]');
        if (!input) return;
        const group = findGroup(input.dataset.groupId);
        if (group) group.name = input.value;
      });

      document.addEventListener('input', (event) => {
        const ownerSearchInput = event.target.closest('[data-action="search-owner-students"]');
        if (ownerSearchInput) {
          ownershipSearch = ownerSearchInput.value;
          renderAnomalyReview();
          requestAnimationFrame(() => {
            const nextInput = document.querySelector('[data-action="search-owner-students"]');
            nextInput?.focus();
            nextInput?.setSelectionRange(ownershipSearch.length, ownershipSearch.length);
          });
          return;
        }
        const searchInput = event.target.closest('[data-action="search-submissions"]');
        if (!searchInput || !submissionPicker) return;
        submissionPicker.query = searchInput.value;
        renderSubmissionPicker();
        document.querySelector('[data-action="search-submissions"]')?.focus();
      });

      document.addEventListener('change', (event) => {
        const pageToggle = event.target.closest('[data-action="toggle-submission-page"]');
        if (pageToggle && submissionPicker) {
          if (pageToggle.checked) submissionPicker.selectedPageIds.add(pageToggle.dataset.pageId);
          else submissionPicker.selectedPageIds.delete(pageToggle.dataset.pageId);
          renderSubmissionPicker();
          return;
        }
        const unassignedFilter = event.target.closest('[data-action="filter-unassigned-submissions"]');
        if (unassignedFilter && submissionPicker) {
          submissionPicker.unassignedOnly = unassignedFilter.checked;
          renderSubmissionPicker();
        }
      });

      sampleList.addEventListener('change', (event) => {
        if (readOnly) return;
        const kindSelect = event.target.closest('[data-action="change-sample-kind"]');
        if (kindSelect) {
          const group = findGroup(kindSelect.dataset.groupId);
          if (group) group.kind = kindSelect.value;
          return;
        }
        const nameInput = event.target.closest('[data-action="edit-sample-name"]');
        if (!nameInput) return;
        const group = findGroup(nameInput.dataset.groupId);
        if (!group) return;
        group.name = FxCollectionFlow.normalizeName(nameInput.value);
        nameInput.value = group.name;
      });

      sampleList.addEventListener('dragstart', (event) => {
        if (readOnly) return;
        const card = event.target.closest('.scan-card');
        const zone = card?.closest('.pages');
        if (!card || !zone) return;
        draggedPage = { pageId: card.dataset.pageId, groupId: zone.dataset.groupId };
        card.classList.add('is-dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', card.dataset.pageId);
      });

      sampleList.addEventListener('dragend', (event) => {
        event.target.closest('.scan-card')?.classList.remove('is-dragging');
        document.querySelectorAll('.pages.drag-over').forEach((zone) => zone.classList.remove('drag-over'));
        draggedPage = null;
      });

      sampleList.addEventListener('dragover', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });

      sampleList.addEventListener('dragleave', (event) => {
        const zone = event.target.closest('.pages');
        if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('drag-over');
      });

      sampleList.addEventListener('drop', (event) => {
        if (readOnly) return;
        const zone = event.target.closest('.pages');
        if (!zone || !draggedPage) return;
        event.preventDefault();
        const targetGroup = findGroup(zone.dataset.groupId);
        const targetCard = event.target.closest('.scan-card');
        const moved = FxCollectionFlow.movePage(groups, {
          sourceGroupId: draggedPage.groupId,
          pageId: draggedPage.pageId,
          targetGroupId: zone.dataset.groupId,
          beforePageId: targetCard?.dataset.pageId,
        });
        if (!moved || !targetGroup) return;
        zone.classList.remove('drag-over');
        formMessage.textContent = `已将页面移动到“${FxCollectionFlow.normalizeName(targetGroup.name)}”。`;
        formMessage.classList.remove('is-error');
        draggedPage = null;
        render();
      });

      const confirmCollection = () => {
        const validGroups = FxCollectionFlow.validGroups(groups);
        if (validGroups.length === 0) {
          formMessage.textContent = '当前没有可创建的样卷，请先拖入样卷页面。';
          formMessage.classList.add('is-error');
          return;
        }

        const hasEmptyGroups = validGroups.length !== groups.length;
        if (hasEmptyGroups) {
          formMessage.textContent = '空样卷不会创建任务，正在确认其他样卷…';
          formMessage.classList.remove('is-error');
        }

        const batch = {
          version: 1,
          batchId: `${task}-${Date.now()}`,
          sourceTaskId: task,
          className: taskData.className,
          createdAt: Date.now(),
          groups: validGroups,
          anomalies: anomalies.map((anomaly) => ({ ...anomaly })),
        };
        localStorage.setItem('fxConfirmedCollectionBatch', JSON.stringify(batch));
        historyState = FxCollectionFlow.confirmHistoryRecord(historyState, batch, { title: taskData.title });
        localStorage.setItem('fxCollectionHistoryState', JSON.stringify(historyState));

        const goToList = () => { location.href = 'index.html?collectionCreated=1'; };
        if (hasEmptyGroups) window.setTimeout(goToList, 500);
        else goToList();
      };

      document.getElementById('confirm').addEventListener('click', () => {
        if (readOnly) return;
        if (stage === 'samples' && FxCollectionFlow.validGroups(groups).length === 0) {
          formMessage.textContent = '当前没有可创建的样卷，请先拖入样卷页面。';
          formMessage.classList.add('is-error');
          return;
        }
        if (stage === 'samples' && FxCollectionFlow.nextCollectionStep(anomalies) === 'review-anomalies') {
          openIndependentAnomalyPage();
          return;
        }
        if (stage === 'anomalies' && pendingAnomalies().length) return;
        confirmCollection();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (submissionPicker) {
          submissionPicker = null;
          renderSubmissionPicker();
          return;
        }
        if (!pendingSampleDelete) return;
        pendingSampleDelete = null;
        renderDeleteDialog();
      });

      render();
    })();
  </script>
</body>
</html>
