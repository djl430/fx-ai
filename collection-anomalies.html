<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2fb">
  <title>处理提交异常 · 飞象智批</title>
  <style>
    :root { --ink:#24345c; --muted:#7180a0; --line:rgba(103,119,158,.16); --primary:#5268d6; font-family:"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 14% 8%,rgba(209,227,255,.92),transparent 30%),radial-gradient(circle at 88% 16%,rgba(225,218,252,.7),transparent 30%),linear-gradient(135deg,#edf3fb 0%,#f8faff 55%,#e9eef9 100%); }
    button { font:inherit; cursor:pointer; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline:3px solid rgba(82,104,214,.25); outline-offset:3px; }
    .shell { width:min(1480px,100%); min-height:100vh; margin:0 auto; padding:20px 28px 96px; }
    .back { display:inline-flex; color:#5068a6; font-size:13px; font-weight:800; text-decoration:none; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:24px 0 14px; }
    .page-head h1 { margin:0; font-size:clamp(23px,2.2vw,30px); }
    .page-head p { margin:7px 0 0; color:var(--muted); font-size:12px; }
    .anomaly-review { overflow:hidden; border:1px solid rgba(255,255,255,.92); border-radius:22px; background:rgba(255,255,255,.78); box-shadow:0 18px 48px rgba(62,81,132,.12); }
    .anomaly-sample-nav { display:flex; gap:8px; overflow-x:auto; padding:12px 14px; border-bottom:1px solid var(--line); background:rgba(248,250,255,.82); scrollbar-width:thin; }
    .anomaly-sample-card { display:grid; width:260px; min-width:260px; grid-template-columns:minmax(0,1fr) auto; gap:4px 8px; border:1px solid #dce2ef; border-radius:13px; padding:11px 13px; color:#4e5c7d; background:#fff; text-align:left; }
    .anomaly-sample-card.is-active { border-color:#8fa2ec; color:#30468e; background:#edf1ff; box-shadow:inset 3px 0 0 var(--primary); }
    .anomaly-sample-card strong { overflow:hidden; font-size:14px; text-overflow:ellipsis; white-space:nowrap; }
    .anomaly-sample-card span { grid-row:1; grid-column:2; color:#a66c1c; font-size:12px; font-weight:850; }
    .anomaly-sample-card small { color:#8490a9; font-size:11px; }
    .anomaly-workspace { display:grid; min-height:690px; grid-template-columns:240px minmax(430px,1fr) 310px; }
    .anomaly-workspace.is-missing { grid-template-columns:240px minmax(430px,1fr); }
    .anomaly-student-rail { padding:16px 14px; border-right:1px solid var(--line); background:rgba(246,248,253,.72); }
    .anomaly-student-rail h2 { margin:0 5px 12px; color:#74809d; font-size:12px; }
    .anomaly-student-card { display:grid; width:100%; grid-template-columns:1fr auto; gap:6px 8px; margin-bottom:8px; border:1px solid transparent; border-radius:13px; padding:13px; color:var(--ink); background:transparent; text-align:left; }
    .anomaly-student-card:hover { background:#fff; }
    .anomaly-student-card.is-active { border-color:#aab9f2; background:#edf1ff; box-shadow:inset 3px 0 0 var(--primary); }
    .anomaly-student-card.is-resolved { color:#63708a; }
    .anomaly-student-card strong { font-size:13px; }
    .anomaly-student-card small { grid-column:1; color:#bd7417; font-size:11px; font-weight:800; }
    .anomaly-student-card.is-resolved small { color:#2c8a64; }
    .anomaly-student-card i { grid-row:1 / 3; grid-column:2; align-self:center; color:#7a88a5; font-style:normal; }
    .anomaly-viewer { min-width:0; padding:16px 18px 24px; background:#f1f4fa; }
    .anomaly-page-tabs { display:flex; min-height:38px; flex-wrap:wrap; align-items:center; gap:7px; margin:0 0 12px; }
    .anomaly-page-tabs button { min-width:46px; min-height:32px; border:1px solid #d8dfec; border-radius:9px; color:#65718d; background:#fff; font-size:11px; font-weight:800; }
    .anomaly-page-tabs button.is-active { border-color:var(--primary); color:#fff; background:var(--primary); }
    .anomaly-page-tabs button.is-missing { border-style:dashed; color:#b87319; background:#fff8eb; }
    .missing-rescan-inline { margin-left:auto; align-self:center; color:#a66a17; font-size:12px; font-weight:850; }
    .anomaly-document-viewer { display:grid; min-height:600px; place-items:start center; overflow:auto; border:1px solid #dce2ed; border-radius:16px; padding:20px; background:#e7ebf3; }
    .student-document { position:relative; width:min(560px,100%); min-height:720px; padding:42px 48px 64px; color:#41485a; background:repeating-linear-gradient(to bottom,#fffdf9 0,#fffdf9 31px,#eee8de 32px); box-shadow:0 15px 35px rgba(48,59,89,.15); font-family:Georgia,"Songti SC",serif; }
    .student-document h3 { margin:0 0 8px; color:#2f3546; font-size:22px; text-align:center; }
    .student-document-meta { display:flex; justify-content:space-between; margin-bottom:28px; padding-bottom:12px; border-bottom:1px solid #d8d2c8; color:#646b7d; font-size:12px; }
    .student-document-line { min-height:31px; margin:0; font-size:14px; line-height:31px; }
    .student-document-answer { display:inline-block; margin-left:12px; color:#35548b; font-family:"Kaiti SC","STKaiti",serif; font-size:16px; }
    .student-document-page { position:absolute; right:0; bottom:22px; left:0; color:#8b8f9c; font-size:12px; text-align:center; }
    .missing-document { display:grid; width:min(560px,100%); min-height:720px; place-items:center; border:2px dashed #ddb976; color:#98661d; background:#fffaf0; text-align:center; }
    .missing-document strong { display:block; margin-bottom:8px; font-size:21px; }
    .missing-document span { font-size:13px; }
    .anomaly-decision { padding:22px 18px; border-left:1px solid var(--line); background:#fff; }
    .anomaly-decision > p { margin:0 0 18px; color:#6d7893; font-size:12px; line-height:1.7; }
    .owner-group { margin-top:15px; }
    .owner-group h3 { margin:0 0 8px; color:#7885a0; font-size:11px; }
    .owner-options { display:flex; max-height:160px; flex-wrap:wrap; gap:7px; overflow-y:auto; }
    .owner-option { min-height:32px; border:1px solid #dce2ef; border-radius:9px; padding:0 10px; color:#52617e; background:#fff; font-size:11px; }
    .owner-option.is-recommended { border-color:#edc98e; color:#9a6419; background:#fff7e8; }
    .owner-option.is-selected { border-color:var(--primary); color:#fff; background:var(--primary); }
    .owner-all-students summary { color:#7885a0; cursor:pointer; font-size:11px; font-weight:800; list-style-position:inside; }
    .owner-all-students[open] summary { margin-bottom:8px; }
    .resolve-button { width:100%; min-height:42px; margin-top:22px; border:0; border-radius:11px; color:#fff; background:var(--primary); font-size:12px; font-weight:850; }
    .resolve-button:disabled { cursor:not-allowed; opacity:.45; }
    .anomaly-resolved { margin-top:18px; padding:13px; border-radius:11px; color:#247a59; background:#eaf8f1; font-size:12px; font-weight:800; }
    .sticky { position:fixed; z-index:20; right:14px; bottom:14px; left:14px; display:flex; min-height:62px; align-items:center; justify-content:flex-end; gap:12px; padding:9px 14px; border:1px solid rgba(255,255,255,.95); border-radius:16px; background:rgba(255,255,255,.93); box-shadow:0 14px 34px rgba(73,91,139,.17); backdrop-filter:blur(18px); }
    .sticky p { margin:0 auto 0 0; color:#7a86a1; font-size:12px; }
    .secondary, .primary { min-height:42px; border-radius:12px; padding:0 18px; font-size:13px; font-weight:850; }
    .secondary { border:1px solid #dbe1ef; color:#53617d; background:#fff; }
    .primary { border:0; color:#fff; background:linear-gradient(135deg,#2b3f78,#5c70d5); }
    .primary:disabled { cursor:not-allowed; opacity:.5; }
    .toast { position:fixed; z-index:50; left:50%; top:88px; min-width:220px; border:1px solid #cfe6db; border-radius:12px; padding:11px 16px; color:#247a59; background:#f1fbf6; box-shadow:0 12px 30px rgba(43,84,68,.18); font-size:13px; font-weight:800; text-align:center; opacity:0; pointer-events:none; transform:translateX(-50%); transition:opacity .2s ease; }
    .toast.is-visible { opacity:1; }
    .empty-state { margin-top:24px; border:1px solid rgba(255,255,255,.9); border-radius:20px; padding:50px 24px; background:rgba(255,255,255,.75); text-align:center; }
    .empty-state h1 { margin:0 0 10px; }
    .empty-state p { color:var(--muted); }
    @media (max-width:900px) { .anomaly-workspace { grid-template-columns:190px minmax(360px,1fr); } .anomaly-workspace.is-missing { grid-template-columns:190px minmax(360px,1fr); } .anomaly-decision { grid-column:1 / -1; border-top:1px solid var(--line); border-left:0; } }
    @media (max-width:580px) { .shell { padding:18px 14px 126px; } .page-head { align-items:flex-start; flex-direction:column; } .anomaly-workspace,.anomaly-workspace.is-missing { display:block; } .anomaly-student-rail { border-right:0; border-bottom:1px solid var(--line); } .student-document { min-height:590px; padding:34px 26px 58px; } .sticky { right:8px; bottom:8px; left:8px; align-items:stretch; flex-direction:column; } .sticky p { margin:0; } }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="collection-history.html">← 返回采集记录</a>
    <header class="page-head" id="pageHead"><div><h1>处理提交异常</h1><p>逐份样卷查看异常页面，未识别页面完成归属后即可开始分析。</p></div></header>
    <section class="anomaly-review" id="anomalyReview"></section>
    <section class="empty-state" id="emptyState" hidden><h1>未找到待处理采集任务</h1><p>采集草稿可能已完成或已失效，请返回采集记录重新进入。</p><a class="back" href="collection-history.html">返回采集记录</a></section>
  </main>
  <footer class="sticky" id="sticky"><p id="footerHint"></p><button class="secondary" id="backToSamples" type="button">返回修改样卷</button><button class="primary" id="startAnalysis" type="button">开始分析</button></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="collection-flow.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const task = params.get('task') || '';
      const focusedAnomalyId = params.get('focus') || '';
      const draftKey = FxCollectionFlow.collectionDraftKey(task);
      let draft = null;
      try {
        draft = FxCollectionFlow.normalizeCollectionDraft(JSON.parse(localStorage.getItem(draftKey) || 'null'), task);
      } catch (_) {}

      const review = document.getElementById('anomalyReview');
      const emptyState = document.getElementById('emptyState');
      const sticky = document.getElementById('sticky');
      const startAnalysis = document.getElementById('startAnalysis');
      const footerHint = document.getElementById('footerHint');
      const toast = document.getElementById('toast');
      const classStudents = ['张小明','李华','王芳','王凡','陈子涵','陈梓涵','赵敏','周雨桐','孙晨','刘洋','林悦','郭航'];
      let toastTimer = null;

      if (!draft) {
        review.hidden = true;
        emptyState.hidden = false;
        sticky.hidden = true;
        return;
      }

      let groups = draft.groups;
      let anomalies = FxCollectionFlow.supportedCollectionAnomalies(draft.anomalies);
      let selectedStudent = '';
      const anomalyGroups = FxCollectionFlow.groupCollectionAnomalies(groups, anomalies);
      const focusedAnomaly = anomalies.find((anomaly) => anomaly.id === focusedAnomalyId);
      const initialGroup = anomalyGroups.find((group) => group.groupId === focusedAnomaly?.groupId) || anomalyGroups[0];
      let selectedGroupId = focusedAnomaly?.groupId || initialGroup?.groupId || '';
      let selectedAnomalyId = focusedAnomaly?.id || FxCollectionFlow.blockingCollectionAnomalies(initialGroup?.anomalies)[0]?.id || initialGroup?.anomalies[0]?.id || '';
      let selectedPageId = '';

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[character]);
      const persistDraft = () => {
        draft = { ...draft, groups, anomalies, updatedAt:Date.now() };
        localStorage.setItem(draftKey, JSON.stringify(draft));
      };
      const showToast = (message) => {
        toast.innerHTML = message;
        toast.classList.add('is-visible');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
      };
      const anomalyPageOptions = (anomaly) => {
        const pages = Array.isArray(anomaly?.pages) ? anomaly.pages : [];
        const missing = (Array.isArray(anomaly?.missingPageNumbers) ? anomaly.missingPageNumbers : []).map((number) => ({ id:`missing-${anomaly.id}-${number}`, sourcePageNumber:number, missing:true }));
        return [...pages,...missing].sort((left,right) => Number(left.sourcePageNumber) - Number(right.sourcePageNumber));
      };
      const currentGroups = () => FxCollectionFlow.groupCollectionAnomalies(groups, anomalies);
      const nextBlockingAnomaly = () => {
        const blocking = FxCollectionFlow.blockingCollectionAnomalies(anomalies);
        return blocking[0] || null;
      };
      const selectAnomaly = (anomaly) => {
        if (!anomaly) return;
        selectedGroupId = anomaly.groupId;
        selectedAnomalyId = anomaly.id;
        selectedPageId = anomalyPageOptions(anomaly)[0]?.id || '';
        selectedStudent = '';
      };
      const renderDocument = (anomaly, page) => {
        if (!page || page.missing) return `<div class="missing-document"><div><strong>缺少第 ${Number(page?.sourcePageNumber) || 1} 页</strong><span>本次扫描中未找到这一页</span></div></div>`;
        const lines = Array.isArray(page.content) ? page.content : ['扫描页面内容'];
        return `<article class="student-document"><h3>${escapeHtml(page.paperTitle || draft.taskData?.firstName || '学生作业')}</h3><div class="student-document-meta"><span>姓名：${escapeHtml(anomaly.choice || anomaly.student)}</span><span>${escapeHtml(draft.taskData?.className || '')}</span></div>${lines.map((line,index) => `<p class="student-document-line">${escapeHtml(line)}${/^\d|^（/.test(line) ? `<span class="student-document-answer">${['12','5/6','24 cm²','答：符合题意'][index % 4]}</span>` : ''}</p>`).join('')}<footer class="student-document-page">第 ${Number(page.sourcePageNumber) || 1} 页</footer></article>`;
      };
      const ownerButtons = (students, recommended = false) => students.map((student) => `<button class="owner-option ${recommended ? 'is-recommended' : ''} ${selectedStudent === student ? 'is-selected' : ''}" type="button" data-action="select-owner-student" data-student-name="${escapeHtml(student)}" aria-pressed="${selectedStudent === student}">${escapeHtml(student)}</button>`).join('');
      const renderDecision = (anomaly) => {
        if (anomaly.status === 'resolved') return `<aside class="anomaly-decision"><p>该页面已完成学生归属。</p><div class="anomaly-resolved">已归属给 ${escapeHtml(anomaly.choice)}</div></aside>`;
        const used = new Set(anomalies.filter((item) => item.groupId === anomaly.groupId && item.choice).map((item) => item.choice));
        const recommended = classStudents.filter((student) => !used.has(student)).slice(0,2);
        return `<aside class="anomaly-decision"><p>${escapeHtml(anomaly.detail || '请选择这张纸所属的学生。')}</p><section class="owner-group"><h3>优先推荐</h3><div class="owner-options">${ownerButtons(recommended,true)}</div></section><details class="owner-group owner-all-students"><summary>全部学生</summary><div class="owner-options">${ownerButtons(classStudents)}</div></details><button class="resolve-button" type="button" data-action="resolve-anomaly" data-anomaly-id="${escapeHtml(anomaly.id)}" ${selectedStudent ? '' : 'disabled'}>确认归属给${selectedStudent ? ` ${escapeHtml(selectedStudent)}` : '所选学生'}</button></aside>`;
      };
      const render = () => {
        const grouped = currentGroups();
        const selectedGroup = grouped.find((group) => group.groupId === selectedGroupId) || grouped[0];
        if (!selectedGroup) return;
        selectedGroupId = selectedGroup.groupId;
        const selected = selectedGroup.anomalies.find((anomaly) => anomaly.id === selectedAnomalyId) || FxCollectionFlow.blockingCollectionAnomalies(selectedGroup.anomalies)[0] || selectedGroup.anomalies[0];
        selectedAnomalyId = selected.id;
        const pages = anomalyPageOptions(selected);
        if (!pages.some((page) => page.id === selectedPageId)) selectedPageId = pages[0]?.id || '';
        const selectedPage = pages.find((page) => page.id === selectedPageId) || pages[0];
        review.innerHTML = `<nav class="anomaly-sample-nav" aria-label="异常样卷">${grouped.map((group) => { const blockers = FxCollectionFlow.blockingCollectionAnomalies(group.anomalies).length; return `<button class="anomaly-sample-card ${group.groupId === selectedGroup.groupId ? 'is-active' : ''}" type="button" data-action="select-anomaly-sample" data-group-id="${escapeHtml(group.groupId)}"><strong>${escapeHtml(group.name)}</strong><span>${group.anomalies.length} 项异常</span><small>${blockers ? `${blockers} 页待归属` : '归属已完成'}</small></button>`; }).join('')}</nav><div class="anomaly-workspace ${selected.type === '缺页' ? 'is-missing' : ''}"><aside class="anomaly-student-rail"><h2>当前样卷异常</h2><nav>${selectedGroup.anomalies.map((anomaly) => { const index = selectedGroup.anomalies.filter((item) => item.type === '未识别学生').indexOf(anomaly) + 1; const name = anomaly.type === '未识别学生' ? `未识别页面 ${index}` : anomaly.student; const subtitle = anomaly.type === '未识别学生' ? (anomaly.choice || '未识别学生') : '缺页'; return `<button class="anomaly-student-card ${anomaly.id === selected.id ? 'is-active' : ''} ${anomaly.status === 'resolved' ? 'is-resolved' : ''}" type="button" data-action="select-anomaly-student" data-anomaly-id="${escapeHtml(anomaly.id)}"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(subtitle)}</small><i>›</i></button>`; }).join('')}</nav></aside><section class="anomaly-viewer">${selected.type === '未识别学生' ? '' : `<div class="anomaly-page-tabs">${pages.map((page) => `<button class="${page.id === selectedPage?.id ? 'is-active' : ''} ${page.missing ? 'is-missing' : ''}" type="button" data-action="select-anomaly-page" data-page-id="${escapeHtml(page.id)}">${page.missing ? '缺' : ''}第${page.sourcePageNumber}页</button>`).join('')}<span class="missing-rescan-inline">请重新扫描缺失页面</span></div>`}<div class="anomaly-document-viewer">${renderDocument(selected,selectedPage)}</div></section>${selected.type === '缺页' ? '' : renderDecision(selected)}</div>`;
        const blockers = FxCollectionFlow.blockingCollectionAnomalies(anomalies).length;
        startAnalysis.disabled = blockers > 0;
        startAnalysis.textContent = blockers ? `请归属剩余 ${blockers} 页` : '开始分析';
        footerHint.textContent = blockers ? `还有 ${blockers} 张未识别页面待归属；缺页不影响开始分析。` : '未识别页面已完成归属，可以开始分析。';
      };

      document.addEventListener('click', (event) => {
        const sample = event.target.closest('[data-action="select-anomaly-sample"]');
        if (sample) { const group = currentGroups().find((item) => item.groupId === sample.dataset.groupId); selectAnomaly(FxCollectionFlow.blockingCollectionAnomalies(group?.anomalies)[0] || group?.anomalies[0]); render(); return; }
        const item = event.target.closest('[data-action="select-anomaly-student"]');
        if (item) { selectAnomaly(anomalies.find((anomaly) => anomaly.id === item.dataset.anomalyId)); render(); return; }
        const page = event.target.closest('[data-action="select-anomaly-page"]');
        if (page) { selectedPageId = page.dataset.pageId; render(); return; }
        const owner = event.target.closest('[data-action="select-owner-student"]');
        if (owner) { selectedStudent = owner.dataset.studentName; render(); return; }
        const resolve = event.target.closest('[data-action="resolve-anomaly"]');
        if (resolve && selectedStudent) {
          const choice = selectedStudent;
          anomalies = FxCollectionFlow.resolveCollectionAnomaly(anomalies, resolve.dataset.anomalyId, choice);
          persistDraft();
          const next = nextBlockingAnomaly();
          if (next) selectAnomaly(next);
          render();
          showToast(`已归属给 ${escapeHtml(choice)}`);
        }
      });

      document.getElementById('backToSamples').addEventListener('click', () => { persistDraft(); location.href = `collection-confirm.html?task=${encodeURIComponent(task)}&resumeCollection=1`; });
      startAnalysis.addEventListener('click', () => {
        if (FxCollectionFlow.blockingCollectionAnomalies(anomalies).length) return;
        const validGroups = FxCollectionFlow.validGroups(groups);
        const batch = { version:1, batchId:`${task}-${Date.now()}`, sourceTaskId:task, className:draft.taskData?.className || '', createdAt:Date.now(), groups:validGroups, anomalies:anomalies.map((anomaly) => ({ ...anomaly })) };
        localStorage.setItem('fxConfirmedCollectionBatch', JSON.stringify(batch));
        let historyState = FxCollectionFlow.normalizeHistoryState(null);
        try { historyState = FxCollectionFlow.normalizeHistoryState(JSON.parse(localStorage.getItem('fxCollectionHistoryState') || 'null')); } catch (_) {}
        historyState = FxCollectionFlow.confirmHistoryRecord(historyState, batch, { title:draft.taskData?.title || task });
        localStorage.setItem('fxCollectionHistoryState', JSON.stringify(historyState));
        localStorage.removeItem(draftKey);
        location.href = 'index.html?collectionCreated=1';
      });

      render();
    })();
  </script>
</body>
</html>
